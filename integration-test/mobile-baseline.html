('已拉取 ' + models.length + ' 个模型，请在下拉列表中选择');\n          } catch (e) {\n            alert('拉取模型列表失败：' + (e && e.message ? e.message : e));\n          } finally {\n            btn.disabled = false;\n            btn.innerHTML = original;\n          }\n        },\n\n        // ---------- API 预设 UI ----------\n        initApiPresetUI() {\n          this.renderApiPresetUI();\n          const select = document.getElementById('mms-api-preset-select');\n          if (select) {\n            select.addEventListener('change', () => {\n              const data = this.loadApiPresets();\n              data.active = select.value;\n              this.saveApiPresets(data);\n              this.syncActiveApiToConfig(data);\n              this.renderApiPresetUI();\n            });\n          }\n          const addBtn = document.getElementById('mms-api-add');\n          if (addBtn) addBtn.addEventListener('click', () => this.addApiPreset());\n          const delBtn = document.getElementById('mms-api-delete');\n          if (delBtn) delBtn.addEventListener('click', () => this.deleteApiPreset());\n          const renameBtn = document.getElementById('mms-api-rename');\n          if (renameBtn) renameBtn.addEventListener('click', () => this.renameApiPreset());\n          const importBtn = document.getElementById('mms-api-import');\n          if (importBtn) {\n            importBtn.addEventListener('click', () => {\n              MMS_IMG.importPresetFile('.json', (data) => this.importApiPresetFile(data));\n            });\n          }\n          const exportBtn = document.getElementById('mms-api-export');\n          if (exportBtn) exportBtn.addEventListener('click', () => this.exportApiPresetFile());\n\n          const bindApiField = (id, key, transform) => {\n            const el = document.getElementById(id);\n            if (!el) return;\n            const handler = () => {\n              const data = this.loadApiPresets();\n              const preset = data.presets.find((p) => p.id === data.active);\n              if (!preset) return;\n              preset.config[key] = transform ? transform(el.value) : el.value;\n              this.saveApiPresets(data);\n              this.syncActiveApiToConfig(data);\n            };\n            el.addEventListener('change', handler);\n          };\n          bindApiField('mms-api-url', 'apiUrl');\n          bindApiField('mms-api-key', 'apiKey');\n          bindApiField('mms-api-model', 'model');\n          const fetchModelsBtn = document.getElementById('mms-fetch-models');\n          if (fetchModelsBtn) fetchModelsBtn.addEventListener('click', () => this.fetchModels());\n          // 拉取到的模型下拉：选中即写回模型输入框，并派发 change 走预设保存链路\n          const modelSelectEl = document.getElementById('mms-model-select');\n          if (modelSelectEl) {\n            modelSelectEl.addEventListener('change', () => {\n              if (!modelSelectEl.value) return;\n              const input = document.getElementById('mms-api-model');\n              if (!input) return;\n              input.value = modelSelectEl.value;\n              input.dispatchEvent(new Event('change'));\n            });\n          }\n          bindApiField('mms-api-preset', 'preset');\n          bindApiField('mms-api-temperature', 'temperature', (v) => {\n            const t = parseFloat(v);\n            return isNaN(t) ? 0.3 : Math.min(2, Math.max(0, t));\n          });\n          bindApiField('mms-api-max-tokens', 'maxTokens', (v) => {\n            const t = parseInt(v, 10);\n            return isNaN(t) ? 4096 : Math.min(32000, Math.max(256, t));\n          });\n          bindApiField('mms-api-top-p', 'topP', (v) => {\n            const t = parseFloat(v);\n            return isNaN(t) || t <= 0 ? '' : Math.min(1, Math.max(0, t));\n          });\n          const sourceSel = document.getElementById('mms-api-source');\n          if (sourceSel) {\n            sourceSel.addEventListener('change', () => {\n              const data = this.loadApiPresets();\n              const preset = data.presets.find((p) => p.id === data.active);\n              if (!preset) return;\n              preset.config.source = sourceSel.value;\n              this.saveApiPresets(data);\n              this.syncActiveApiToConfig(data);\n            });\n          }\n        },\n\n        renderApiPresetUI() {\n          const select = document.getElementById('mms-api-preset-select');\n          if (!select) return;\n          const data = this.loadApiPresets();\n          select.innerHTML = '';\n          data.presets.forEach((p) => {\n            const opt = document.createElement('option');\n            opt.value = p.id;\n            opt.textContent = p.name + (p.locked ? ' 🔒' : '');\n            select.appendChild(opt);\n          });\n          select.value = data.active;\n          // 表单回填当前预设\n          const preset = data.presets.find((p) => p.id === data.active) || data.presets[0];\n          const c = (preset && preset.config) || {};\n          const set = (id, v) => {\n            const el = document.getElementById(id);\n            if (el) el.value = v == null ? '' : String(v);\n          };\n          set('mms-api-url', c.apiUrl);\n          set('mms-api-key', c.apiKey);\n          set('mms-api-model', c.model);\n          set('mms-api-preset', c.preset);\n          set('mms-api-temperature', c.temperature != null ? c.temperature : 0.3);\n          set('mms-api-max-tokens', c.maxTokens != null ? c.maxTokens : 4096);\n          set('mms-api-top-p', c.topP != null ? c.topP : '');\n          const sourceSel = document.getElementById('mms-api-source');\n          if (sourceSel) sourceSel.value = c.source || 'custom';\n          const delBtn = document.getElementById('mms-api-delete');\n          if (delBtn) delBtn.disabled = !!(preset && preset.locked);\n        },\n\n        addApiPreset() {\n          const data = this.loadApiPresets();\n          const name = prompt('新 API 预设名称：', '');\n          if (!name) return;\n          const id = 'api_' + Date.now();\n          const cur = data.presets.find((p) => p.id === data.active);\n          data.presets.push({\n            id,\n            name,\n            config: cur && !cur.locked ? JSON.parse(JSON.stringify(cur.config || {})) : {},\n            locked: false,\n          });\n          data.active = id;\n          this.saveApiPresets(data);\n          this.syncActiveApiToConfig(data);\n          this.renderApiPresetUI();\n        },\n\n        deleteApiPreset() {\n          const data = this.loadApiPresets();\n          const preset = data.presets.find((p) => p.id === data.active);\n          if (!preset) return;\n          if (preset.locked) {\n            alert('默认预设不可删除');\n            return;\n          }\n          if (!confirm('确定删除 API 预设「' + preset.name + '」？')) return;\n          data.presets = data.presets.filter((p) => p.id !== data.active);\n          data.active = 'default';\n          this.saveApiPresets(data);\n          this.syncActiveApiToConfig(data);\n          this.renderApiPresetUI();\n        },\n\n        renameApiPreset() {\n          const data = this.loadApiPresets();\n          const preset = data.presets.find((p) => p.id === data.active);\n          if (!preset) return;\n          if (preset.locked) {\n            alert('默认预设不可重命名');\n            return;\n          }\n          const name = prompt('重命名 API 预设：', preset.name);\n          if (!name) return;\n          preset.name = name;\n          this.saveApiPresets(data);\n          this.renderApiPresetUI();\n        },\n\n        exportApiPresetFile() {\n          const data = this.loadApiPresets();\n          const preset = data.presets.find((p) => p.id === data.active);\n          if (!preset) return;\n          MMS_IMG.exportPresetFile(\n            { type: 'mms-api-config', v: 2, name: preset.name, config: preset.config },\n            'mms-api-preset.json',\n          );\n        },\n\n        importApiPresetFile(data) {\n          if (!data || data.type !== 'mms-api-config') {\n            alert('这不是 API 预设文件（type 应为 mms-api-config）');\n            return;\n          }\n          const ps = this.loadApiPresets();\n          // 兼容 v1（扁平字段）与 v2（嵌套 config）\n          const config = data.config || {\n            source: data.source,\n            apiUrl: data.apiUrl,\n            apiKey: data.apiKey,\n            model: data.model,\n            preset: data.preset,\n            contextFloors: data.contextFloors,\n          };\n          ps.presets.push({\n            id: 'api_' + Date.now(),\n            name: data.name || '导入的API预设',\n            config,\n            locked: false,\n          });\n          ps.active = ps.presets[ps.presets.length - 1].id;\n          this.saveApiPresets(ps);\n          this.syncActiveApiToConfig(ps);\n          this.renderApiPresetUI();\n        },\n\n        // ---------- 地图管理 UI（开关 + 独立大地图表单 + 标签池三栏） ----------\n        initMapsUI() {\n          // 地图开关（渲染层控制：关闭后对应字段回退普通列表，正文数据不丢失）\n          const bindMapToggle = (id, key) => {\n            const el = document.getElementById(id);\n            if (!el) return;\n            el.addEventListener('change', () => {\n              const rr = this.loadRoster();\n              rr.maps[key] = el.checked;\n              this.saveRoster(rr);\n              this.renderMapTags();\n              reRenderStatusBar();\n            });\n          };\n          const miniEl = document.getElementById('mms-map-minimap');\n          if (miniEl) miniEl.checked = this.loadRoster().maps.minimap !== false;\n          const bigEl = document.getElementById('mms-map-bigmap');\n          if (bigEl) bigEl.checked = !!this.loadRoster().maps.bigmap;\n          bindMapToggle('mms-map-minimap', 'minimap');\n          bindMapToggle('mms-map-bigmap', 'bigmap');\n\n          // 独立大地图（AI 绘制）\n          const bigArtChk = document.getElementById('mms-bigart-enabled');\n          const bigArtForm = document.getElementById('mms-bigart-form');\n          const bigArtStyle = document.getElementById('mms-bigart-style');\n          const bigArtNote = document.getElementById('mms-bigart-note');\n          const syncBigArtUI = () => {\n            const art = this.loadRoster().bigmapArt;\n            if (bigArtChk) bigArtChk.checked = art.enabled;\n            if (bigArtForm) bigArtForm.style.display = art.enabled ? 'block' : 'none';\n            if (bigArtStyle) bigArtStyle.value = art.style;\n            if (bigArtNote && bigArtNote.value !== art.note) bigArtNote.value = art.note;\n          };\n          if (bigArtChk) {\n            bigArtChk.addEventListener('change', () => {\n              const rr = this.loadRoster();\n              rr.bigmapArt.enabled = bigArtChk.checked;\n              this.saveRoster(rr);\n              syncBigArtUI();\n              reRenderStatusBar();\n            });\n          }\n          if (bigArtStyle) {\n            bigArtStyle.addEventListener('change', () => {\n              const rr = this.loadRoster();\n              rr.bigmapArt.style = bigArtStyle.value === 'parchment' ? 'parchment' : 'flat';\n              this.saveRoster(rr);\n              this.refreshBigMapCard();\n            });\n          }\n          if (bigArtNote) {\n            bigArtNote.addEventListener('change', () => {\n              const rr = this.loadRoster();\n              rr.bigmapArt.note = bigArtNote.value.trim();\n              this.saveRoster(rr);\n            });\n          }\n          syncBigArtUI();\n\n          // 标签池三栏交互\n          const moveMini = document.getElementById('mms-tags-move-mini');\n          if (moveMini) moveMini.addEventListener('click', () => this.moveSelectedTags('mini'));\n          const moveBig = document.getElementById('mms-tags-move-big');\n          if (moveBig) moveBig.addEventListener('click', () => this.moveSelectedTags('big'));\n          const resetMini = document.getElementById('mms-tags-reset-mini');\n          if (resetMini) resetMini.addEventListener('click', () => this.resetMapTags('mini'));\n          const resetBig = document.getElementById('mms-tags-reset-big');\n          if (resetBig) resetBig.addEventListener('click', () => this.resetMapTags('big'));\n          const copyBtn = document.getElementById('mms-tags-copy');\n          if (copyBtn) copyBtn.addEventListener('click', () => this.copyMapTags());\n          this.renderMapTags();\n        },\n\n        renderMapTags() {\n          const cfg = this.loadRoster().mapTags;\n          const tagInfo = {};\n          for (const t of MMS_ALL_MAP_TAGS) tagInfo[t.name] = t;\n\n          // mode: 'pool' = 池中芯片（多选迁移），'map' = 地图栏芯片（单击退回池）\n          const makeChip = (name, mode) => {\n            const info = tagInfo[name] || { type: 'svg' };\n            const chip = document.createElement('span');\n            chip.className = 'map-tag-chip' + (this.mapTagsSelection.has(name) ? ' selected' : '');\n            chip.setAttribute('data-tag', name);\n            if (info.type === 'image' && BACKGROUND_MAP && BACKGROUND_MAP[name]) {\n              const img = document.createElement('img');\n              img.src = BACKGROUND_MAP[name];\n              img.loading = 'lazy';\n              img.alt = '';\n              chip.appendChild(img);\n            } else if (info.type === 'image') {\n              chip.textContent = '🖼 ';\n            }\n            chip.appendChild(document.createTextNode(name));\n            if (mode === 'pool') {\n              // 池中：多选（配合迁入按钮）\n              chip.addEventListener('click', () => {\n                if (this.mapTagsSelection.has(name)) this.mapTagsSelection.delete(name);\n                else this.mapTagsSelection.add(name);\n                chip.classList.toggle('selected');\n              });\n            } else if (mode === 'map') {\n              // 地图栏：单击直接退回池（附 title 提示）\n              chip.title = '点击退回标签池';\n              chip.addEventListener('click', () => {\n                const rr = this.loadRoster();\n                rr.mapTags.mini = rr.mapTags.mini.filter((x) => x !== name);\n                rr.mapTags.big = rr.mapTags.big.filter((x) => x !== name);\n                if (!rr.mapTags.pool.includes(name)) rr.mapTags.pool.push(name);\n                this.saveRoster(rr);\n                this.mapTagsSelection.delete(name);\n                this.renderMapTags();\n              });\n            }\n            return chip;\n          };\n\n          const poolEl = document.getElementById('mms-tags-pool');\n          const miniEl = document.getElementById('mms-tags-mini');\n          const bigEl = document.getElementById('mms-tags-big');\n          if (poolEl) {\n            poolEl.innerHTML = '';\n            for (const n of cfg.pool) poolEl.appendChild(makeChip(n, 'pool'));\n            if (!cfg.pool.length) poolEl.innerHTML = '<span class=\"text-[10px] text-gray-500\">池空：所有标签已分配<\/span>';\n          }\n          const poolCount = document.getElementById('mms-tags-pool-count');\n          if (poolCount) poolCount.textContent = cfg.pool.length + ' 个可选';\n          if (miniEl) {\n            miniEl.innerHTML = '';\n            for (const n of cfg.mini) miniEl.appendChild(makeChip(n, 'map'));\n            if (!cfg.mini.length) miniEl.innerHTML = '<span class=\"text-[10px] text-gray-500\">未分配（小地图白名单为空）<\/span>';\n          }\n          if (bigEl) {\n            bigEl.innerHTML = '';\n            for (const n of cfg.big) bigEl.appendChild(makeChip(n, 'map'));\n            if (!cfg.big.length) bigEl.innerHTML = '<span class=\"text-[10px] text-gray-500\">未分配<\/span>';\n          }\n        },\n\n        saveMapTags(cfg) {\n          const rr = this.loadRoster();\n          rr.mapTags = cfg;\n          this.saveRoster(rr);\n          this.mapTagsSelection.clear();\n          this.renderMapTags();\n        },\n\n        // 池中勾选的标签迁入目标栏（从另一栏互斥移除）\n        moveSelectedTags(target) {\n          const cfg = this.loadRoster().mapTags;\n          if (!this.mapTagsSelection.size) {\n            alert('请先在标签池中点击选择标签');\n            return;\n          }\n          const picked = [...this.mapTagsSelection];\n          const other = target === 'mini' ? 'big' : 'mini';\n          for (const n of picked) {\n            if (!cfg[target].includes(n)) cfg[target].push(n);\n            cfg[other] = cfg[other].filter((x) => x !== n);\n            cfg.pool = cfg.pool.filter((x) => x !== n);\n          }\n          this.saveMapTags(cfg);\n        },\n\n        // 重置目标栏：标签回池\n        resetMapTags(target) {\n          const cfg = this.loadRoster().mapTags;\n          const moved = cfg[target];\n          cfg[target] = [];\n          for (const n of moved) if (!cfg.pool.includes(n)) cfg.pool.push(n);\n          this.saveMapTags(cfg);\n        },\n\n        // 复制当前标签池（未分配栏）为 [标签] 连缀枚举，\n        // 供用户粘贴进自己的正文提示词（预设/世界书），让正文 AI 按这些标签输出地图字段\n        async copyMapTags() {\n          const cfg = this.loadRoster().mapTags;\n          const names = (cfg.pool || []).filter(Boolean);\n          if (!names.length) {\n            alert('标签池为空：所有标签都已分配给小地图/大地图，可先在对应栏点标签退回池中');\n            return;\n          }\n          const text = names.map((n) => '[' + n + ']').join('');\n          const ok = await mmsCopyText(text);\n          if (ok) {\n            alert('已复制标签池中的 ' + names.length + ' 个标签，粘贴进你的正文提示词即可');\n          } else {\n            alert('复制失败，请手动记录标签：' + text);\n          }\n        },\n\n        // ---------- 剧情收集（供绘图提示词组装） ----------\n        readFloorMaintext(floorId) {\n          try {\n            if (typeof getChatMessages !== 'function') return '';\n            const arr = getChatMessages(floorId);\n            const m = Array.isArray(arr) && arr.length > 0 ? arr[0] : arr;\n            if (!m || typeof m.message !== 'string') return '';\n            let text = extractLastBlock(m.message, 'maintext');\n            if (!text) {\n              text = m.message.replace(/<Status_block>[\\s\\S]*?<\\/Status_block>/gi, '');\n            }\n            text = text.replace(/\\[IMG_GEN\\][\\s\\S]*?\\[\\/IMG_GEN\\]/gi, '');\n            return text.trim();\n          } catch (e) {\n            return '';\n          }\n        },\n\n        readFloorUserInput(m) {\n          return String((m && m.message) || '')\n            .replace(/\\[IMG_GEN\\][\\s\\S]*?\\[\\/IMG_GEN\\]/gi, '')\n            .trim();\n        },\n\n        // 收集最近 N 层剧情：latest = 目标AI楼正文 + 紧邻用户输入；context = 更早楼层（n>=3 才有）\n        collectStorySegments(targetFloorId, n = 2) {\n          const aiText = this.readFloorMaintext(targetFloorId);\n          const latestParts = [];\n          let pairedUserId = null;\n          try {\n            if (typeof getChatMessages === 'function') {\n              // 向前找紧邻的用户楼（跳过连续的AI楼/空楼）\n              let id = targetFloorId - 1;\n              while (id >= 0 && id >= targetFloorId - 5) {\n                const arr = getChatMessages(id);\n                const m = Array.isArray(arr) && arr.length > 0 ? arr[0] : arr;\n                if (m) {\n                  const isUser = m.role === 'user' || m.is_user;\n                  if (isUser) {\n                    const raw = this.readFloorUserInput(m);\n                    if (raw) {\n                      latestParts.push('【用户输入】' + raw);\n                      pairedUserId = id;\n                    }\n                    break;\n                  }\n                }\n                id--;\n              }\n            }\n          } catch (e) {\n            /* 取不到用户楼时只喂AI正文 */\n          }\n          if (aiText) latestParts.push('【AI回复】' + aiText);\n          const latest = latestParts.join('\\n\\n') || aiText;\n\n          let context = '';\n          try {\n            if (typeof getLastMessageId !== 'function' || n < 3) return { latest, context };\n            const parts = [];\n            let id = (pairedUserId != null ? pairedUserId : targetFloorId) - 1;\n            let collected = 0;\n            const maxCollect = n - 2;\n            while (id >= 0 && collected < maxCollect) {\n              const arr = getChatMessages(id);\n              const m = Array.isArray(arr) && arr.length > 0 ? arr[0] : arr;\n              if (!m) {\n                id--;\n                continue;\n              }\n              const isUser = m.role === 'user' || m.is_user;\n              if (isUser) {\n                const raw = this.readFloorUserInput(m);\n                if (raw) {\n                  parts.unshift('【用户输入】' + raw);\n                  collected++;\n                }\n              } else {\n                const t = this.readFloorMaintext(id);\n                if (t) {\n                  parts.unshift('【AI回复】' + t);\n                  collected++;\n                }\n              }\n              id--;\n            }\n            context = parts.join('\\n\\n');\n          } catch (e) {\n            context = '';\n          }\n          return { latest, context };\n        },\n\n        collectLocationLines(floorId, count) {\n          const lines = [];\n          try {\n            if (typeof getChatMessages !== 'function') return lines;\n            const start = Math.max(0, floorId - count + 1);\n            for (let id = floorId; id >= start; id--) {\n              const t = this.readFloorMaintext(id);\n              if (!t) continue;\n              const re = /【[^】]*📍[^】]*】/g;\n              let m;\n              while ((m = re.exec(t)) !== null) lines.push(m[0]);\n            }\n          } catch (e) { /* 忽略 */ }\n          return lines;\n        },\n\n        // ---------- 独立大地图（AI 绘制：语义 JSON + 本地渲染器） ----------\n        // 聊天变量 $mms_map_art = { json, prev, ts }：每个聊天一张演化中的地图，缓存后零 LLM 开销\n        loadMapArt() {\n          this.mapArt = null;\n          this.mapArtPrev = null;\n          try {\n            if (!this.hasVarsApi()) return;\n            const chatVars = getVariables({ type: 'chat' }) || {};\n            const a = chatVars && chatVars.$mms_map_art;\n            const valid = (j) => j && typeof j === 'object' && Array.isArray(j.markers) && j.markers.length;\n            if (a && typeof a === 'object' && valid(a.json)) {\n              this.mapArt = this.sanitizeMapArt(a.json);\n              if (valid(a.prev)) this.mapArtPrev = this.sanitizeMapArt(a.prev);\n            }\n          } catch (e) {\n            this.mapArt = null;\n            this.mapArtPrev = null;\n          }\n        },\n\n        // keepPrev=false 时把当前 json 存为备份（正常保存）；true 时沿用传入的 prev（撤销场景）\n        saveMapArt(json, prevOverride) {\n          try {\n            if (!this.hasVarsApi()) return;\n            const prev = prevOverride !== undefined ? prevOverride : this.mapArt || null;\n            const payload = { json: json, ts: Date.now() };\n            if (prev && prev !== json) payload.prev = prev;\n            insertOrAssignVariables({ $mms_map_art: payload }, { type: 'chat' });\n            this.mapArtPrev = payload.prev || null;\n          } catch (e) {\n            console.error('[MMS] 保存大地图失败:', e);\n          }\n        },\n\n        // 撤销上一次地图更新：与备份互换（可再次点击回到新版，形成单步来回）\n        undoMapArt() {\n          if (!this.mapArtPrev) {\n            alert('没有可撤销的上一版地图');\n            return false;\n          }\n          const cur = this.mapArt;\n          const prev = this.mapArtPrev;\n          this.mapArt = prev;\n          this.saveMapArt(prev, cur || null);\n          this.refreshBigMapCard();\n          if (typeof eventEmit === 'function') {\n            try { eventEmit(MMS_EVENT_MAPART, {}); } catch (e) { /* 忽略 */ }\n          }\n          return true;\n        },\n\n        // 解析正文地点行（形如【📍悉尼·澳大利亚酒店-总督套房】），取候选地名与地标匹配\n        matchHereMarker(art) {\n          try {\n            const text = this.messageText || '';\n            const main = extractMaintext(text) || text;\n            const matches = [];\n            const re = /📍\\s*([^】\\n]{1,40})/g;\n            let m;\n            while ((m = re.exec(main)) !== null) matches.push(m[1]);\n            if (!matches.length) return null;\n            const last = matches[matches.length - 1];\n            // 从最细到最粗（\"悉尼·澳大利亚酒店-总督套房\" → 总督套房/澳大利亚酒店/悉尼），优先精确楼层\n            const cands = last.split(/[·\\-—–]/).map((s) => s.trim()).filter(Boolean).reverse();\n            for (const c of cands) {\n              const hit = (art.markers || []).find(\n                (mk) => mk && mk.name && (c.includes(mk.name) || mk.name.includes(c)),\n              );\n              if (hit) return hit;\n            }\n          } catch (e) { /* 忽略 */ }\n          return null;\n        },\n\n        // 渲染前注入：把大地图（AI 版）合成进显示数据副本，并更新全局渲染开关 MMS_BIGMAP_ART_STATE\n        injectBigMapArt(rootData) {\n          const display = JSON.parse(JSON.stringify(rootData || {}));\n          this.lastState = rootData;\n          let artCfg = null;\n          try {\n            artCfg = this.loadRoster().bigmapArt;\n          } catch (e) {\n            artCfg = null;\n          }\n          if (!display || typeof display !== 'object' || !artCfg || !artCfg.enabled) {\n            MMS_BIGMAP_ART_STATE = { enabled: false };\n            return display;\n          }\n          const style = artCfg.style === 'parchment' ? 'parchment' : 'flat';\n          const art = this.mapArt;\n          if (art && Array.isArray(art.markers) && art.markers.length) {\n            const name = art.name || '大地图';\n            const here = this.matchHereMarker(art);\n            display['大地图'] = {};\n            display['大地图'][name] = art.markers.map(\n              (mk) => (mk.emoji || '📍') + '【' + mk.name + '】(' + mk.x + ', ' + mk.y + ') ' + (mk.desc || ''),\n            );\n            MMS_BIGMAP_ART_STATE = {\n              enabled: true,\n              key: name,\n              name: name,\n              svg: mmsRenderMapArt(art, style),\n              style: style,\n              hereName: here ? here.name : null,\n              hereMatched: !!here,\n              empty: false,\n              generating: !!this.mapArtBusy,\n              canUndo: !!this.mapArtPrev,\n            };\n          } else {\n            display['大地图'] = {};\n            display['大地图']['AI大地图'] = [\n              '🗺️【大地图尚未生成】(50, 50) 点击下方按钮，由绘图 AI 依据剧情生成',\n            ];\n            MMS_BIGMAP_ART_STATE = {\n              enabled: true,\n              key: 'AI大地图',\n              name: 'AI大地图',\n              svg: null,\n              style: style,\n              hereName: null,\n              hereMatched: false,\n              empty: true,\n              generating: !!this.mapArtBusy,\n              canUndo: !!this.mapArtPrev,\n            };\n          }\n          return display;\n        },\n\n        // 大地图卡片原地刷新：只重建该卡片节点，不整栏重渲染（不切标签页、不丢滚动位置）。\n        // 找不到现有卡片（状态栏尚未渲染过大地图）时回退整栏重渲染。\n        refreshBigMapCard() {\n          if (!this.lastState) return;\n          try {\n            this.injectBigMapArt(this.lastState); // 同步 MMS_BIGMAP_ART_STATE\n            const bma = MMS_BIGMAP_ART_STATE;\n            const oldBar = document.querySelector(\n              '.character-panel .mms-bm-bar, .character-panel .mms-bm-placeholder',\n            );\n            const oldLi = oldBar ? oldBar.closest('li') : null;\n            if (bma && bma.enabled && oldLi) {\n              const markersData = bma.empty\n                ? [{ emoji: '🗺️', name: '大地图尚未生成', x: 50, y: 50, desc: '' }]\n                : (this.mapArt && this.mapArt.markers ? this.mapArt.markers : []).map((m) => ({\n                    emoji: m.emoji,\n                    name: m.name,\n                    x: m.x,\n                    y: m.y,\n                    desc: m.desc,\n                  }));\n              const sr = new StoryRenderer('yaml-data-source');\n              oldLi.replaceWith(sr.createBigMapArtItem(bma.key, markersData, bma));\n              return;\n            }\n          } catch (e) {\n            console.warn('[MMS] 大地图卡片原地刷新失败，回退整栏渲染:', e);\n          }\n          reRenderStatusBar();\n        },\n\n        // 风格切换：同一份 JSON 本地重绘，零 AI 开销\n        switchMapArtStyle() {\n          const rr = this.loadRoster();\n          rr.bigmapArt.style = rr.bigmapArt.style === 'parchment' ? 'flat' : 'parchment';\n          this.saveRoster(rr);\n          const sel = document.getElementById('mms-bigart-style');\n          if (sel) sel.value = rr.bigmapArt.style;\n          this.refreshBigMapCard();\n        },\n\n        buildMapArtSystemPrompt(mode) {\n          const isPatch = mode === 'merge';\n          const lines = [];\n          lines.push('你是跑团大地图绘制师。根据剧情信息规划区域大地图，输出「语义 JSON」——本地渲染器会把它绘制成图，你只负责地理布局与地标，不要输出 SVG，不要解释。');\n          lines.push('');\n          lines.push('## 输出格式硬性要求');\n          lines.push('- 只输出一个 JSON 对象，前后不得有任何文字，不要 markdown 围栏。');\n          lines.push('- 必须是严格合法 JSON：禁止 // 与 /* */ 注释、禁止尾随逗号、数组与对象的元素之间必须有英文逗号、标点一律英文半角。');\n          lines.push('- 输出紧凑单行 JSON（不缩进、不换行）。');\n          lines.push('');\n          if (isPatch) {\n            lines.push('## 增量模式：只输出新增内容');\n            lines.push('用户会给出「当前地图 JSON」，其中的内容已经画好了，绝对不要重复输出它们。你的输出结构：');\n            lines.push('{\"add\":{\"markers\":[…],\"features\":[…],\"houses\":[…],\"trees\":[…],\"terrain\":[…],\"roads\":[…],\"districts\":[…],\"labels\":[…],\"bridges\":[…]},\"name\":\"可选的新图名\"}');\n            lines.push('- add 里只放本次新出现地点所需的新元素，各数组均可省略；旧元素一律不要重复。');\n            lines.push('- 不要输出 outline/towers/gates/river/ridge/ground/bays——这些是已定型的地图骨架，增量模式不可改动。');\n            lines.push('- name 仅在图名确实需要更新时给出，否则省略。');\n            lines.push('- 若剧情中没有出现地图上尚不存在的地点，输出 {\"add\":{}} 即可。');\n            lines.push('');\n            lines.push('## 各数组的元素结构');\n            lines.push('- markers: {\"emoji\":\"🏰\",\"name\":\"地标名\",\"x\":50,\"y\":25,\"desc\":\"一句话描述\"}');\n            lines.push('- features: {\"type\":\"castle\",\"at\":[500,258]}');\n            lines.push('- terrain: {\"type\":\"grass\",\"shape\":\"ellipse\",\"at\":[150,850],\"r\":[110,90]}');\n            lines.push('- districts: {\"type\":\"royal\",\"shape\":\"ellipse\",\"at\":[500,258],\"r\":[118,80],\"label\":\"区名\"}');\n            lines.push('- labels: {\"at\":[500,345],\"text\":\"地名\"}');\n            lines.push('- bridges: {\"at\":[578,418],\"size\":[52,26]}');\n            lines.push('- roads: \"M 500 940 C 496 820, 490 640, 487 575\"（SVG 路径字符串）');\n            lines.push('- houses / trees: [x,y] 坐标对');\n          } else {\n            lines.push('## 完整 JSON 结构');\n            lines.push('{');\n            lines.push('  \"name\": \"地图名\",');\n            lines.push('  \"ground\": \"field\",');\n            lines.push('  \"terrain\": [ {\"type\":\"grass\",\"shape\":\"ellipse\",\"at\":[150,850],\"r\":[110,90]} ],');\n            lines.push('  \"outline\": {\"shape\":\"roundRect\",\"at\":[120,160],\"size\":[760,780],\"r\":36,\"wall\":true},');\n            lines.push('  \"bays\": [\"M 355 900 C 330 820, 305 780, 312 738 Z\"],');\n            lines.push('  \"towers\": [[150,190],[850,190]],');\n            lines.push('  \"gates\": [[500,930]],');\n            lines.push('  \"river\": \"M 645 150 C 615 300, 598 390, 608 480\",');\n            lines.push('  \"bridges\": [ {\"at\":[578,418],\"size\":[52,26]} ],');\n            lines.push('  \"roads\": [\"M 500 940 C 496 820, 490 640, 487 575\"],');\n            lines.push('  \"districts\": [ {\"type\":\"royal\",\"shape\":\"ellipse\",\"at\":[500,258],\"r\":[118,80],\"label\":\"王城区\"} ],');\n            lines.push('  \"ridge\": {\"from\":[400,620],\"to\":[700,500],\"peaks\":7},');\n            lines.push('  \"features\": [ {\"type\":\"castle\",\"at\":[500,258]} ],');\n            lines.push('  \"houses\": [[200,230],[240,225]],');\n            lines.push('  \"trees\": [[70,240],[105,335]],');\n            lines.push('  \"labels\": [ {\"at\":[500,345],\"text\":\"王城区\"} ],');\n            lines.push('  \"markers\": [ {\"emoji\":\"🏰\",\"name\":\"领主城堡\",\"x\":50,\"y\":25,\"desc\":\"一句话描述\"} ]');\n            lines.push('}');\n          }\n          lines.push('');\n          lines.push('## 字段说明');\n          lines.push('- ground：陆地底色，城市与内陆图用 \"field\"，海岛与大陆图用 \"sea\"。');\n          lines.push('- terrain：地形色块，type 取 grass|snow|forest|desert|field|lake；shape 取 ellipse（配 at+r）、rect（配 at+size）或 path（配 d，SVG 路径字符串）。');\n          lines.push('- outline：城市围墙用 {\"shape\":\"roundRect\",\"at\":[x,y],\"size\":[w,h],\"r\":36,\"wall\":true}；大陆海岸线用 {\"shape\":\"path\",\"d\":\"M…Z\",\"land\":true}。');\n          lines.push('- bays：海湾，SVG 闭合路径字符串数组，把大陆轮廓内的区域挖成水面（仅大陆图需要）。');\n          lines.push('- river：单条 SVG 路径字符串；跨河处用 bridges 架桥。');\n          lines.push('- districts：城区色块，type 取 royal|craft|garden|plaza|harbor。');\n          lines.push('- ridge：山脉，自动在 from 与 to 之间排布 peaks 个山峰。');\n          lines.push('- features：特色地物，type 只能取 ' + MMS_MAPART_FEATURE_TYPES.join('|') + '。');\n          lines.push('- houses / trees：批量民居与树木的坐标对数组。');\n          lines.push('- labels：图上的文字地名标注。');\n          lines.push('- markers：玩家可见的交互地标（emoji + 名称 + 描述）。');\n          lines.push('');\n          lines.push('## 布局规则');\n          lines.push('1. 画布 1000×1000：terrain/outline/bays/river/roads/bridges/districts/ridge/features/houses/trees/labels 用 0~1000 画布坐标；markers 的 x/y 用 ' + MMS_COORD_MIN + '~' + MMS_COORD_MAX + ' 的整数（百分比）。');\n          lines.push('2. 每个 marker 必须在对应位置有 features 地物：marker(x,y) 对应画布坐标 (x*10, y*10)，确保 emoji 落在地物上；河流与道路不得压住地标落点。');\n          lines.push('3. 城市图：outline(wall)+towers+gates 组成城墙，districts 分区，roads 主干道，river 可穿城并配 bridges，houses 15~40 个民居，trees 郊野点缀。');\n          lines.push('4. 大陆图：ground=\"sea\"，outline 用 path+land:true 画海岸线，terrain 拼雪原/森林/沙漠/农田/湖泊，ridge 表达山脉，roads 连接主要地标。');\n          lines.push('5. 布局紧凑饱满、疏密有致；地标之间保持距离，不要都挤在中心或边缘。');\n          if (!isPatch) {\n            lines.push('6. markers 控制在 5~12 个，覆盖剧情中已出现或提及的重要地点。');\n          }\n          return lines.join('\\n');\n        },\n\n        buildMapArtUserPrompt(mode, artCfg, latest, context, locLines, retryHint) {\n          let p = '';\n          if (artCfg && artCfg.note) {\n            p += '<地图设定备注（优先遵循）>\\n' + artCfg.note + '\\n<\/地图设定备注>\\n\\n';\n          }\n          if (locLines && locLines.length) {\n            p += '<剧情出现过的地点行（按时间顺序，最新在最后）>\\n' + locLines.join('\\n') + '\\n<\/地点行>\\n\\n';\n          }\n          if (context) {\n            p += '<前情提要>\\n' + context + '\\n<\/前情提要>\\n\\n';\n          }\n          if (latest) {\n            p += '<最新剧情>\\n' + latest + '\\n<\/最新剧情>\\n\\n';\n          }\n          if (mode === 'merge' && this.mapArt) {\n            // 增量模式：旧图作为输入（让 AI 知道哪些位置已占），输出只要新增部分\n            p +=\n              '<当前地图 JSON（已经画好，仅供你判断哪些地点已存在、哪些坐标已被占用；不要重复输出其中任何内容）>\\n' +\n              JSON.stringify(this.mapArt) +\n              '\\n<\/当前地图>\\n\\n' +\n              '已有地标：' +\n              (this.mapArt.markers || []).map((m) => m.name).join('、') +\n              '\\n请找出剧情中出现、但当前地图上还没有的地点，只输出新增部分：{\"add\":{…}}。' +\n              '新地标要避开已占坐标，并在 (x*10, y*10) 处补上对应 features 地物。若没有新地点，输出 {\"add\":{}}。\\n';\n          } else {\n            p += '请依据以上剧情信息规划一张大地图并输出完整 JSON。地图必须覆盖剧情中已出现或提及的所有重要地点，并为每个地点配置 markers 与对应地物。\\n';\n          }\n          if (retryHint) {\n            p +=\n              '\\n<上次输出失败原因（务必避免同类错误）>\\n' +\n              retryHint +\n              '\\n<\/上次输出失败原因>\\n请重新输出：严格合法、无注释、无尾随逗号、紧凑单行的 JSON。\\n';\n          }\n          return p;\n        },\n\n        // 字符串感知的 JSON 修复：只在字符串外做结构性修补，字符串内的中文/斜杠/引号一律不动\n        repairJsonText(text) {\n          const src = String(text || '');\n          let out = '';\n          let inStr = false;\n          let esc = false;\n          const notes = [];\n          for (let i = 0; i < src.length; i++) {\n            const c = src[i];\n            if (inStr) {\n              out += c;\n              if (esc) esc = false;\n              else if (c === '\\\\') esc = true;\n              else if (c === '\"') inStr = false;\n              continue;\n            }\n            // 字符串外\n            if (c === '\"') {\n              // 缺失逗号：前一个有效 token 结束后紧跟新字符串\n              const prev = out.replace(/\\s+$/, '').slice(-1);\n              if (prev === '}' || prev === ']' || prev === '\"' || /[0-9a-zA-Z]/.test(prev)) {\n                out += ',';\n                notes.push('补逗号');\n              }\n              out += c;\n              inStr = true;\n              continue;\n            }\n            if (c === '/' && (src[i + 1] === '/' || src[i + 1] === '*')) {\n              // 剥注释\n              if (src[i + 1] === '/') {\n                while (i < src.length && src[i] !== '\\n') i++;\n              } else {\n                i += 2;\n                while (i < src.length && !(src[i] === '*' && src[i + 1] === '/')) i++;\n                i++; // 跳过 '/'\n              }\n              notes.push('剥注释');\n              continue;\n            }\n            if (c === '，' || c === '、') { out += ','; notes.push('全角逗号'); continue; }\n            if (c === '：') { out += ':'; notes.push('全角冒号'); continue; }\n            if (c === '“' || c === '”') {\n              out += '\"';\n              inStr = !inStr;\n              notes.push('全角引号');\n              continue;\n            }\n            if (c === '{' || c === '[') {\n              const prev = out.replace(/\\s+$/, '').slice(-1);\n              if (prev === '}' || prev === ']' || prev === '\"' || /[0-9]/.test(prev)) {\n                out += ',';\n                notes.push('补逗号');\n              }\n              out += c;\n              continue;\n            }\n            if (c === '}' || c === ']') {\n              // 删尾随逗号\n              const trimmed = out.replace(/\\s+$/, '');\n              if (trimmed.slice(-1) === ',') {\n                out = trimmed.slice(0, -1);\n                notes.push('删尾随逗号');\n              }\n              out += c;\n              continue;\n            }\n            out += c;\n          }\n          return { text: out, notes: notes };\n        },\n\n        // 宽松解析：原样 parse 失败则修复后重试一次；失败信息保留 position/line 便于回传给 AI\n        parseJsonLoose(raw, label) {\n          let text = String(raw || '').trim();\n          // \\u0060 = 反引号：字面量三反引号会破坏源文件围栏纪律（首尾自围栏仅 2 处）\n          text = text.replace(/^\\u0060\\u0060\\u0060[a-zA-Z]*\\s*\\n?/, '').replace(/\\n?\\u0060\\u0060\\u0060\\s*$/, '');\n          const first = text.indexOf('{');\n          const last = text.lastIndexOf('}');\n          if (first === -1 || last === -1 || last <= first) {\n            throw new Error('AI 输出中未找到 JSON 对象（可能被截断或返回了纯文本）');\n          }\n          const sliced = text.slice(first, last + 1);\n          try {\n            return JSON.parse(sliced);\n          } catch (e1) {\n            const fixed = this.repairJsonText(sliced);\n            try {\n              const json = JSON.parse(fixed.text);\n              const kinds = [...new Set(fixed.notes)].join('/');\n              console.info('[MMS] ' + (label || '地图') + ' JSON 已自动修复（' + (kinds || '未知') + '）');\n              return json;\n            } catch (e2) {\n              const msg = e1 && e1.message ? e1.message : String(e1);\n              const lineNo = Number((msg.match(/line (\\d+)/) || [])[1]);\n              let excerpt = '';\n              if (lineNo) {\n                const srcLine = sliced.split('\\n')[lineNo - 1];\n                if (srcLine) excerpt = '\\n出错行内容：' + srcLine.slice(0, 200);\n              }\n              throw new Error(msg + excerpt);\n            }\n          }\n        },\n\n        // 整图模式：解析完整地图 JSON\n        parseMapArtOutput(raw) {\n          const json = this.parseJsonLoose(raw, '大地图');\n          if (!json || typeof json !== 'object' || Array.isArray(json)) {\n            throw new Error('JSON 顶层不是对象');\n          }\n          if (!Array.isArray(json.markers) || json.markers.length === 0) {\n            throw new Error('缺少 markers 地标数组');\n          }\n          for (const m of json.markers) {\n            if (!m || !m.name) throw new Error('存在缺少名称的地标');\n          }\n          return json;\n        },\n\n        // 增量模式：解析 patch（{add:{…}, name?}），空 patch 合法\n        parseMapArtPatch(raw) {\n          const json = this.parseJsonLoose(raw, '地图增量');\n          if (!json || typeof json !== 'object' || Array.isArray(json)) {\n            throw new Error('JSON 顶层不是对象');\n          }\n          // 兼容 AI 直接给了裸数组字段（无 add 包裹）或误输出整图\n          let add = json.add && typeof json.add === 'object' && !Array.isArray(json.add) ? json.add : null;\n          if (!add) {\n            const keys = ['markers', 'features', 'terrain', 'roads', 'districts', 'labels', 'bridges', 'houses', 'trees'];\n            if (keys.some((k) => Array.isArray(json[k]))) {\n              add = {};\n              for (const k of keys) if (Array.isArray(json[k])) add[k] = json[k];\n            } else {\n              throw new Error('缺少 add 字段');\n            }\n          }\n          for (const m of add.markers || []) {\n            if (!m || !m.name) throw new Error('新增地标中存在缺少名称的条目');\n          }\n          return { add: add, name: typeof json.name === 'string' ? json.name : null };\n        },\n\n        // 本地合并：纯追加 + 地标按名称去重（旧的胜出），骨架字段不动\n        mergeMapArtPatch(base, patch) {\n          const out = JSON.parse(JSON.stringify(base));\n          const add = (patch && patch.add) || {};\n          const listKeys = ['markers', 'features', 'terrain', 'roads', 'districts', 'labels', 'bridges', 'houses', 'trees'];\n          let added = 0;\n          let dupSkipped = 0;\n          for (const k of listKeys) {\n            const incoming = Array.isArray(add[k]) ? add[k] : [];\n            if (!incoming.length) continue;\n            if (!Array.isArray(out[k])) out[k] = [];\n            if (k === 'markers') {\n              const known = new Set(out[k].map((m) => mmsNormalizeName(m && m.name)).filter(Boolean));\n              for (const m of incoming) {\n                const key = mmsNormalizeName(m && m.name);\n                if (!key || known.has(key)) { dupSkipped++; continue; }\n                known.add(key);\n                out[k].push(m);\n                added++;\n              }\n            } else {\n              out[k] = out[k].concat(incoming);\n              added += incoming.length;\n            }\n          }\n          if (patch && patch.name && String(patch.name).trim()) out.name = String(patch.name).trim();\n          const newMarkers = Array.isArray(add.markers)\n            ? add.markers.filter((m) => m && m.name).map((m) => m.name)\n            : [];\n          return { json: out, added: added, dupSkipped: dupSkipped, newMarkers: newMarkers };\n        },\n\n        sanitizeMapArt(json) {\n          const clamp = (v) =>\n            Math.max(MMS_COORD_MIN, Math.min(MMS_COORD_MAX, Math.round(Number(v) || 50)));\n          const dropped = [];\n          const num = (v) => (typeof v === 'number' ? isFinite(v) : isFinite(Number(v))) ;\n          const isPair = (p) => Array.isArray(p) && p.length >= 2 && num(p[0]) && num(p[1]);\n          const toPair = (p) => [Number(p[0]), Number(p[1])];\n          const isPath = (s) => typeof s === 'string' && /^\\s*[Mm]\\s*-?\\d/.test(s) && s.length < 4000;\n          const cap = (arr, n, label) => {\n            if (!Array.isArray(arr)) return [];\n            if (arr.length > n) dropped.push(label + ' 超量截断 ' + (arr.length - n));\n            return arr.slice(0, n);\n          };\n          const filterValid = (arr, pred, label) => {\n            const before = arr.length;\n            const out = arr.filter(pred);\n            if (out.length < before) dropped.push(label + ' 非法条目 ' + (before - out.length));\n            return out;\n          };\n\n          json.name = String(json.name || '大地图').slice(0, 30);\n          if (json.ground !== 'sea') json.ground = 'field';\n\n          // 地形：ellipse(at+r) / rect(at+size) / path(d)\n          json.terrain = filterValid(\n            cap(json.terrain, 24, 'terrain'),\n            (t) => {\n              if (!t || typeof t !== 'object') return false;\n              if (t.type && MMS_MAPART_TERRAIN_TYPES.indexOf(t.type) === -1) t.type = 'grass';\n              if (t.shape === 'path') return isPath(t.d);\n              if (t.shape === 'rect') return isPair(t.at) && isPair(t.size);\n              t.shape = 'ellipse';\n              return isPair(t.at) && isPair(t.r);\n            },\n            'terrain',\n          );\n          // 路径类：必须是 M 开头的 SVG 路径串\n          json.roads = filterValid(cap(json.roads, 12, 'roads'), isPath, 'roads');\n          json.bays = filterValid(cap(json.bays, 6, 'bays'), isPath, 'bays');\n          if (json.river != null && !isPath(json.river)) {\n            dropped.push('river 非法');\n            delete json.river;\n          }\n          // 轮廓\n          if (json.outline && typeof json.outline === 'object') {\n            const o = json.outline;\n            const ok =\n              o.shape === 'path'\n                ? isPath(o.d)\n                : isPair(o.at) && isPair(o.size);\n            if (!ok) {\n              dropped.push('outline 非法');\n              delete json.outline;\n            } else if (o.shape !== 'path') {\n              o.shape = 'roundRect';\n              o.r = num(o.r) ? Math.max(0, Math.min(200, Number(o.r))) : 30;\n            }\n          } else if (json.outline != null) {\n            delete json.outline;\n          }\n          // 山脉\n          if (json.ridge && typeof json.ridge === 'object') {\n            if (!isPair(json.ridge.from) || !isPair(json.ridge.to)) {\n              dropped.push('ridge 非法');\n              delete json.ridge;\n            } else {\n              json.ridge.peaks = Math.max(2, Math.min(14, Math.round(Number(json.ridge.peaks) || 5)));\n            }\n          } else if (json.ridge != null) {\n            delete json.ridge;\n          }\n          // 桥梁 / 城区\n          json.bridges = filterValid(\n            cap(json.bridges, 8, 'bridges'),\n            (b) => b && typeof b === 'object' && isPair(b.at) && isPair(b.size),\n            'bridges',\n          );\n          json.districts = filterValid(\n            cap(json.districts, 10, 'districts'),\n            (d) => {\n              if (!d || typeof d !== 'object' || !isPair(d.at)) return false;\n              if (d.type && MMS_MAPART_DISTRICT_TYPES.indexOf(d.type) === -1) d.type = 'craft';\n              if (d.shape === 'ellipse') return isPair(d.r);\n              d.shape = 'rect';\n              return isPair(d.size);\n            },\n            'districts',\n          );\n          // 地物：type 必须在渲染器白名单内（否则命中 default 静默空绘）\n          json.features = filterValid(\n            cap(json.features, 90, 'features'),\n            (f) => f && typeof f === 'object' && isPair(f.at) && MMS_MAPART_FEATURE_TYPES.indexOf(f.type) !== -1,\n            'features',\n          );\n          // 坐标对数组\n          json.towers = filterValid(cap(json.towers, 24, 'towers'), isPair, 'towers').map(toPair);\n          json.gates = filterValid(cap(json.gates, 8, 'gates'), isPair, 'gates').map(toPair);\n          json.houses = filterValid(cap(json.houses, 60, 'houses'), isPair, 'houses').map(toPair);\n          json.trees = filterValid(cap(json.trees, 50, 'trees'), isPair, 'trees').map(toPair);\n          // 文字标注\n          json.labels = filterValid(\n            cap(json.labels, 14, 'labels'),\n            (l) => l && typeof l === 'object' && isPair(l.at) && l.text != null && String(l.text).trim(),\n            'labels',\n          ).map((l) => ({ at: toPair(l.at), text: String(l.text).slice(0, 20) }));\n\n          // 地标：清洗 + 按名称去重（旧的/先出现的胜出）\n          const seen = new Set();\n          const marks = [];\n          for (const m of Array.isArray(json.markers) ? json.markers : []) {\n            const name = String((m && m.name) || '').slice(0, 24).trim();\n            if (!name) continue;\n            const key = mmsNormalizeName(name);\n            if (seen.has(key)) { dropped.push('地标重名 ' + name); continue; }\n            seen.add(key);\n            marks.push({\n              emoji: String((m && m.emoji) || '📍').slice(0, 8),\n              name: name,\n              x: clamp(m && m.x),\n              y: clamp(m && m.y),\n              desc: String((m && m.desc) || '').slice(0, 80),\n            });\n            if (marks.length >= 40) { dropped.push('markers 超量截断'); break; }\n          }\n          json.markers = marks;\n\n          if (dropped.length) console.warn('[MMS] 大地图数据清洗：' + dropped.join('；'));\n          return json;\n        },\n\n        // 独立绘图 LLM：mode = 'full'（整图重绘） | 'merge'（增量合并）\n        async generateMapArt(mode = 'full') {\n          if (!this.hasGenApi() || !this.hasVarsApi()) {\n            alert('当前酒馆助手版本缺少 generateRaw 或变量接口，无法生成大地图');\n            return false;\n          }\n          if (this.mapArtBusy) {\n            alert('大地图正在生成中，请稍候');\n            return false;\n          }\n          if (mode === 'merge' && !this.mapArt) mode = 'full';\n\n          const floorId = this.floorId != null ? this.floorId : 0;\n          const cfg = this.loadConfig();\n          const artCfg = this.loadRoster().bigmapArt || {};\n\n          this.mapArtBusy = true;\n          this.refreshBigMapCard(); // 原地显示\"生成中\"状态（不整栏重渲染）\n\n          try {\n            const floorCount = Math.min(10, Math.max(1, Number(cfg.contextFloors) || 2));\n            const { latest, context } = this.collectStorySegments(floorId, floorCount);\n            // 地点行是绘图最关键的输入：固定回溯 10 楼收集（正文直读模式无上下文楼数设置）\n            const locLines = this.collectLocationLines(floorId, 10);\n            const sysPrompt = this.buildMapArtSystemPrompt(mode);\n            // 绘图输出体积远大于状态更新，给足输出余量（仅此次请求生效，不改用户全局设置）\n            const customApi = Object.assign({}, this.buildCustomApi(cfg), {\n              max_tokens: Math.max(Number(cfg.maxTokens) || 4096, 8192),\n            });\n            const baseArt = this.mapArt;\n\n            let lastError = null;\n            let retryHint = null;\n            for (let attempt = 0; attempt < 3; attempt++) {\n              const userPrompt = this.buildMapArtUserPrompt(mode, artCfg, latest, context, locLines, retryHint);\n              try {\n                const config = {\n                  ordered_prompts: [\n                    { role: 'system', content: sysPrompt },\n                    { role: 'user', content: userPrompt },\n                  ],\n                  custom_api: customApi,\n                  should_silence: true,\n                  generation_id: 'mms-mapart-' + floorId + '-' + Date.now(),\n                };\n                const result = await generateRaw(config);\n                const raw = typeof result === 'string' ? result : (result && result.content) || '';\n\n                let json = null;\n                let okMsg = '大地图已更新';\n                if (mode === 'merge' && baseArt) {\n                  // 增量：AI 只输出新增部分，本地追加合并（旧图结构上不可能被破坏）\n                  const patch = this.parseMapArtPatch(raw);\n                  const merged = this.mergeMapArtPatch(baseArt, patch);\n                  if (!merged.added && !patch.name) {\n                    // 空 patch 不算失败：剧情确实没有新地点\n                    this.mapArtBusy = false;\n                    this.refreshBigMapCard();\n                    alert('本轮未发现地图上缺失的新地点');\n                    return true;\n                  }\n                  json = this.sanitizeMapArt(merged.json);\n                  const parts = [];\n                  if (merged.newMarkers.length) parts.push('新增地标：' + merged.newMarkers.join('、'));\n                  if (merged.dupSkipped) parts.push('跳过重复 ' + merged.dupSkipped + ' 个');\n                  okMsg = parts.length ? '地图已更新（' + parts.join('，') + '）' : '地图已更新';\n                } else {\n                  json = this.sanitizeMapArt(this.parseMapArtOutput(raw));\n                  // 退化保护：整图重绘结果地标数骤降时让用户决定是否采用\n                  const oldCount = baseArt && baseArt.markers ? baseArt.markers.length : 0;\n                  if (oldCount >= 4 && json.markers.length < Math.ceil(oldCount * 0.5)) {\n                    const go = window.confirm(\n                      '新生成的地图只有 ' + json.markers.length + ' 个地标，原地图有 ' + oldCount +\n                        ' 个，可能是本次生成质量退化。\\n\\n点「确定」采用新图（旧图仍可用「撤销上次」找回），点「取消」保留原图。',\n                    );\n                    if (!go) {\n                      this.mapArtBusy = false;\n                      this.refreshBigMapCard();\n                      return false;\n                    }\n                  }\n                }\n\n                this.mapArt = json;\n                this.saveMapArt(json, baseArt || null);\n                this.mapArtBusy = false;\n                this.refreshBigMapCard();\n                if (typeof eventEmit === 'function') {\n                  try { eventEmit(MMS_EVENT_MAPART, {}); } catch (e) { /* 忽略 */ }\n                }\n                alert(okMsg);\n                return true;\n              } catch (e) {\n                lastError = e;\n                console.warn('[MMS] 大地图生成失败（第 ' + (attempt + 1) + ' 次）：', e);\n                // 把失败原因回传给下一次尝试，让 AI 知道要修什么\n                retryHint = (e && e.message ? e.message : String(e)).slice(0, 600);\n                if (attempt < 2) await new Promise((r) => setTimeout(r, 1000 * (attempt + 1)));\n              }\n            }\n            throw lastError || new Error('未知错误');\n          } catch (e) {\n            this.mapArtBusy = false;\n            this.refreshBigMapCard();\n            const msg = e && e.message ? e.message : String(e);\n            alert('大地图生成失败：' + msg + '\\n请检查独立绘图 AI 配置（设置 → 独立LLM更新），或稍后重试。');\n            return false;\n          }\n        },\n\n        // ---------- 启动 ----------\n        boot() {\n          this.loadMapArt();\n          // 跨楼层实例同步：其它楼层的 iframe 生成/更新大地图后，本楼卡片即时刷新\n          if (typeof eventOn === 'function') {\n            try {\n              eventOn(MMS_EVENT_MAPART, () => {\n                this.loadMapArt();\n                this.refreshBigMapCard();\n              });\n            } catch (e) { /* 忽略 */ }\n          }\n        },\n      };\n\n      // ==========================================\n      // 战术视觉地图引擎 (多场景 + 海边通透版)\n      // ==========================================\n      class TacticalMapEngine {\n        constructor(containerElement, markersData, mapTypeStr, options) {\n          this.container = containerElement;\n          this.markers = markersData;\n          this.mapTypeStr = mapTypeStr || \"\";\n          this.options = options || {};\n          \n          // 智能推断环境类型\n          this.envType = 'dark-room'; // 默认：昏暗室内\n          if (this.mapTypeStr.includes(\"健身房\") || this.mapTypeStr.includes(\"练功房\") || this.mapTypeStr.includes(\"训练室\") || this.mapTypeStr.includes(\"力量\") || this.mapTypeStr.includes(\"武馆\") || this.mapTypeStr.includes(\"道场\")) {\n              this.envType = 'gym';\n          } else if (this.mapTypeStr.includes(\"教室\") || this.mapTypeStr.includes(\"学堂\") || this.mapTypeStr.includes(\"讲堂\") || this.mapTypeStr.includes(\"书房\") || this.mapTypeStr.includes(\"实验室\")) {\n              this.envType = 'classroom';\n          } else if (this.mapTypeStr.includes(\"操场\") || this.mapTypeStr.includes(\"演武\") || this.mapTypeStr.includes(\"训练场\") || this.mapTypeStr.includes(\"体育馆\") || this.mapTypeStr.includes(\"竞技场\") || this.mapTypeStr.includes(\"比武\")) {\n              this.envType = 'playground';\n          } else if (this.mapTypeStr.includes(\"警局\") || this.mapTypeStr.includes(\"派出所\") || this.mapTypeStr.includes(\"治安\") || this.mapTypeStr.includes(\"纪律\") || this.mapTypeStr.includes(\"执法\") || this.mapTypeStr.includes(\"牢房\")) {\n              this.envType = 'police-station';\n          } else if (this.mapTypeStr.includes(\"夜市\") || this.mapTypeStr.includes(\"黑市\") || this.mapTypeStr.includes(\"集市\") || this.mapTypeStr.includes(\"暗巷\") || this.mapTypeStr.includes(\"庙会\")) {\n              this.envType = 'night-market';\n          } else if (this.mapTypeStr.includes(\"神殿\") || this.mapTypeStr.includes(\"祭坛\") || this.mapTypeStr.includes(\"圣所\")) {\n              this.envType = 'temple';\n          } else if (this.mapTypeStr.includes(\"广场\") || this.mapTypeStr.includes(\"中心\") || this.mapTypeStr.includes(\"公园\") || this.mapTypeStr.includes(\"庭院\")) {\n              this.envType = 'plaza';\n          } else if (this.mapTypeStr.includes(\"明亮\") || this.mapTypeStr.includes(\"白天\") || this.mapTypeStr.includes(\"清晨\")) {\n              this.envType = 'bright-room';\n          } else if (this.mapTypeStr.includes(\"街\") || this.mapTypeStr.includes(\"巷\") || this.mapTypeStr.includes(\"路\") || this.mapTypeStr.includes(\"道\")) {\n              this.envType = 'street';\n          } else if (this.mapTypeStr.includes(\"商场\") || this.mapTypeStr.includes(\"市场\") || this.mapTypeStr.includes(\"大厅\") || this.mapTypeStr.includes(\"超市\")) {\n              this.envType = 'mall';\n          } else if (this.mapTypeStr.includes(\"荒野\") || this.mapTypeStr.includes(\"林\") || this.mapTypeStr.includes(\"郊\") || this.mapTypeStr.includes(\"平原\")) {\n              this.envType = 'wilderness';\n          } else if (this.mapTypeStr.includes(\"洞窟\") || this.mapTypeStr.includes(\"地下\") || this.mapTypeStr.includes(\"遗迹\") || this.mapTypeStr.includes(\"墓\")) {\n              this.envType = 'cave';\n          } else if (this.mapTypeStr.includes(\"海边\") || this.mapTypeStr.includes(\"海滩\") || this.mapTypeStr.includes(\"沙滩\") || this.mapTypeStr.includes(\"岸\") || this.mapTypeStr.includes(\"岛屿\")) {\n              this.envType = 'seaside';\n          } else if (this.mapTypeStr.includes(\"医院\") || this.mapTypeStr.includes(\"诊所\") || this.mapTypeStr.includes(\"病房\")) {\n              this.envType = 'hospital';\n          } else if (this.mapTypeStr.includes(\"沙漠\") || this.mapTypeStr.includes(\"戈壁\") || this.mapTypeStr.includes(\"沙丘\")) {\n              this.envType = 'desert';\n          } else if (this.mapTypeStr.includes(\"火山\") || this.mapTypeStr.includes(\"熔岩\") || this.mapTypeStr.includes(\"炼狱\")) {\n              this.envType = 'volcano';\n          } else if (this.mapTypeStr.includes(\"雪\") || this.mapTypeStr.includes(\"冰\") || this.mapTypeStr.includes(\"寒\") || this.mapTypeStr.includes(\"冬\")) {\n              this.envType = 'snowfield';\n          } else if (this.mapTypeStr.includes(\"酒吧\") || this.mapTypeStr.includes(\"酒馆\") || this.mapTypeStr.includes(\"清吧\") || this.mapTypeStr.includes(\"夜店\") || this.mapTypeStr.includes(\"吧台\")) {\n              this.envType = 'bar';\n          } else if (this.mapTypeStr.includes(\"小店\") || this.mapTypeStr.includes(\"便利店\") || this.mapTypeStr.includes(\"小卖部\") || this.mapTypeStr.includes(\"杂货店\") || this.mapTypeStr.includes(\"面馆\") || this.mapTypeStr.includes(\"路边摊\") || this.mapTypeStr.includes(\"快餐\") || this.mapTypeStr.includes(\"苍蝇馆子\") || this.mapTypeStr.includes(\"大排档\") || this.mapTypeStr.includes(\"小饭馆\")) {\n              this.envType = 'cramped-shop';\n          } else if (this.mapTypeStr.includes(\"洞府\") || this.mapTypeStr.includes(\"闭关\") || this.mapTypeStr.includes(\"静室\")) {\n    this.envType = 'seclusion-cave';\n    } else if (this.mapTypeStr.includes(\"论剑台\") || this.mapTypeStr.includes(\"演武场\") || this.mapTypeStr.includes(\"擂台\")) {\n    this.envType = 'sword-arena';\n    } else if (this.mapTypeStr.includes(\"藏经阁\") || this.mapTypeStr.includes(\"书阁\") || this.mapTypeStr.includes(\"传功塔\")) {\n    this.envType = 'scripture-pavilion';\n    } else if (this.mapTypeStr.includes(\"炼丹\") || this.mapTypeStr.includes(\"丹房\") || this.mapTypeStr.includes(\"地火\")) {\n    this.envType = 'alchemy-room';\n    } else if (this.mapTypeStr.includes(\"灵草\") || this.mapTypeStr.includes(\"药园\") || this.mapTypeStr.includes(\"竹海\") || this.mapTypeStr.includes(\"百草\")) {\n    this.envType = 'herb-garden';\n    } else if (this.mapTypeStr.includes(\"客栈\") || this.mapTypeStr.includes(\"酒楼\") || this.mapTypeStr.includes(\"茶馆\")) {\n    this.envType = 'tavern';\n    } else if (this.mapTypeStr.includes(\"坊市\") || this.mapTypeStr.includes(\"集市\") || this.mapTypeStr.includes(\"黑市\") || this.mapTypeStr.includes(\"夜市\")) {\n    this.envType = 'marketplace';\n        } else if (this.mapTypeStr.includes(\"废墟\") || this.mapTypeStr.includes(\"禁地\") || this.mapTypeStr.includes(\"血色\")) {\n    this.envType = 'blood-ruins';\n          } else if (this.mapTypeStr.includes(\"餐厅\") || this.mapTypeStr.includes(\"客栈\") || this.mapTypeStr.includes(\"旅店\") || this.mapTypeStr.includes(\"饭店\") || this.mapTypeStr.includes(\"食堂\")) {\n              this.envType = 'restaurant';\n          }\n          \n          this.scale = 1; this.translateX = 0; this.translateY = 0;\n          this.isDragging = false; this.lastX = 0; this.lastY = 0;\n          this.initDOM(); this.attachEvents();\n        }\n\n        getSVG() {\n          // 独立大地图：优先使用绘图 AI 生成的底图（本地渲染器产出）\n          if (this.options && this.options.customSVG) return this.options.customSVG;\n          const uid = this.container.id; \n          \n          // === [新增] 底图拦截逻辑 ===\n          let matchedBg = null;\n          if (typeof BACKGROUND_MAP !== 'undefined') {\n              // 遍历字典，如果当前场景名（this.mapTypeStr）包含了字典里的关键字，就使用该图片\n              for (let key in BACKGROUND_MAP) {\n                  if (this.mapTypeStr.includes(key)) {\n                      matchedBg = BACKGROUND_MAP[key];\n                      break;\n                  }\n              }\n          }\n\n          // 如果找到了匹配的底图，直接返回 <img> 标签，铺满底层\n          if (matchedBg) {\n              return `<img src=\"${matchedBg}\" class=\"map-svg-bg\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: center;\" />`;\n          }\n\n          // 如果没找到，就继续执行原来的逻辑，渲染默认的色块地图\n          switch(this.envType) {\n            case 'blood-ruins':\n              return `\n                <svg class=\"map-svg-bg\" viewBox=\"0 0 1000 1000\" preserveAspectRatio=\"xMidYMid slice\">\n                  <defs>\n                    <!-- 深渊背景：从暗红到极黑的绝望与深邃感 -->\n                    <radialGradient id=\"abyss-bg-${uid}\" cx=\"50%\" cy=\"50%\" r=\"75%\">\n                      <stop offset=\"0%\" stop-color=\"#450a0a\" stop-opacity=\"1\"/>    <!-- 深血红 -->\n                      <stop offset=\"40%\" stop-color=\"#1f0404\" stop-opacity=\"0.95\"/> <!-- 极暗红 -->\n                      <stop offset=\"100%\" stop-color=\"#020617\" stop-opacity=\"1\"/>   <!-- 虚空黑 -->\n                    <\/radialGradient>\n\n                    <!-- 血色晶体材质 -->\n                    <linearGradient id=\"blood-crystal-${uid}\" x1=\"0%\" y1=\"0%\" x2=\"0%\" y2=\"100%\">\n                      <stop offset=\"0%\" stop-color=\"#fca5a5\" stop-opacity=\"1\"/>     <!-- 晶体高光 -->\n                      <stop offset=\"30%\" stop-color=\"#ef4444\" stop-opacity=\"0.9\"/>\n                      <stop offset=\"80%\" stop-color=\"#991b1b\" stop-opacity=\"0.95\"/>\n                      <stop offset=\"100%\" stop-color=\"#450a0a\" stop-opacity=\"1\"/>\n                    <\/linearGradient>\n\n                    <!-- 弥漫的血雾光晕 -->\n                    <radialGradient id=\"blood-mist-${uid}\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n                      <stop offset=\"0%\" stop-color=\"#dc2626\" stop-opacity=\"0.3\"/>\n                      <stop offset=\"50%\" stop-color=\"#991b1b\" stop-opacity=\"0.1\"/>\n                      <stop offset=\"100%\" stop-color=\"#000000\" stop-opacity=\"0\"/>\n                    <\/radialGradient>\n                  <\/defs>\n\n                  <!-- ================= 1. 虚空深渊底色 ================= -->\n                  <rect width=\"1000\" height=\"1000\" fill=\"url(#abyss-bg-${uid})\" />\n\n                  <!-- 深渊中流动的暗红雾气 -->\n                  <path d=\"M 0 300 Q 250 150 500 400 T 1000 200\" fill=\"none\" stroke=\"#7f1d1d\" stroke-width=\"80\" opacity=\"0.15\" filter=\"blur(20px)\"/>\n                  <path d=\"M 0 700 Q 300 900 600 600 T 1000 800\" fill=\"none\" stroke=\"#991b1b\" stroke-width=\"120\" opacity=\"0.1\" filter=\"blur(30px)\"/>\n\n                  <!-- ================= 2. 破碎悬浮的外围黑曜石 (废墟感) ================= -->\n                  <g fill=\"#0f0f11\" stroke=\"#27272a\" stroke-width=\"2\" opacity=\"0.8\">\n                    <!-- 左上碎块 -->\n                    <polygon points=\"50,150 200,80 250,250 120,300\" filter=\"drop-shadow(5px 15px 10px rgba(0,0,0,0.8))\"/>\n                    <!-- 右上碎块 -->\n                    <polygon points=\"750,100 950,150 900,300 720,220\" filter=\"drop-shadow(-5px 20px 10px rgba(0,0,0,0.8))\"/>\n                    <!-- 左下碎块 -->\n                    <polygon points=\"100,750 280,700 320,880 150,950\" filter=\"drop-shadow(10px -10px 15px rgba(0,0,0,0.9))\"/>\n                    <!-- 右下碎块 -->\n                    <polygon points=\"780,800 950,700 980,900 820,980\" filter=\"drop-shadow(-10px -5px 10px rgba(0,0,0,0.9))\"/>\n                  <\/g>\n\n                  <!-- ================= 3. 中央破碎的主祭坛 ================= -->\n                  <!-- 祭坛主体 (不规则的残破多边形) -->\n                  <polygon points=\"450,100 700,180 850,450 780,750 550,880 250,800 150,500 280,200\" fill=\"#18181b\" stroke=\"#3f3f46\" stroke-width=\"4\" filter=\"drop-shadow(0px 30px 30px rgba(0,0,0,0.9))\"/>\n                  \n                  <!-- 祭坛地面的暗色几何刻痕 -->\n                  <polygon points=\"450,150 650,220 780,450 720,700 550,800 300,720 220,500 320,250\" fill=\"none\" stroke=\"#27272a\" stroke-width=\"2\"/>\n\n                  <!-- ================= 4. 撕裂祭坛的岩浆/血色裂缝 ================= -->\n                  <!-- 裂缝的光晕层 -->\n                  <path d=\"M 500 500 L 350 300 L 250 200 M 500 500 L 700 400 L 850 350 M 500 500 L 600 700 L 750 850 M 500 500 L 300 650 L 200 800 M 350 300 L 450 150 M 600 700 L 400 900\" stroke=\"#991b1b\" stroke-width=\"15\" fill=\"none\" filter=\"blur(8px)\"/>\n                  <!-- 裂缝的炽热层 -->\n                  <path d=\"M 500 500 L 350 300 L 250 200 M 500 500 L 700 400 L 850 350 M 500 500 L 600 700 L 750 850 M 500 500 L 300 650 L 200 800 M 350 300 L 450 150 M 600 700 L 400 900\" stroke=\"#dc2626\" stroke-width=\"6\" fill=\"none\" filter=\"blur(2px)\"/>\n                  <!-- 裂缝的极高温核心 (撕裂感) -->\n                  <path d=\"M 500 500 L 350 300 L 250 200 M 500 500 L 700 400 L 850 350 M 500 500 L 600 700 L 750 850 M 500 500 L 300 650 L 200 800 M 350 300 L 450 150 M 600 700 L 400 900\" stroke=\"#fca5a5\" stroke-width=\"1.5\" fill=\"none\"/>\n\n                  <!-- ================= 5. 古老且断裂的血色阵纹 (残破的规则) ================= -->\n                  <!-- 断裂的外环阵法 -->\n                  <circle cx=\"500\" cy=\"500\" r=\"320\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"3\" stroke-dasharray=\"40 100 200 80 10 50\" opacity=\"0.6\"/>\n                  <circle cx=\"500\" cy=\"500\" r=\"300\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"1\" stroke-dasharray=\"10 30 50 150 20 60\" opacity=\"0.8\"/>\n                  \n                  <!-- 残缺的六芒星阵 -->\n                  <polygon points=\"500,220 742,640 258,640\" fill=\"none\" stroke=\"#b91c1c\" stroke-width=\"2\" stroke-dasharray=\"100 50 200 80\" opacity=\"0.5\"/>\n                  <polygon points=\"500,780 742,360 258,360\" fill=\"none\" stroke=\"#b91c1c\" stroke-width=\"2\" stroke-dasharray=\"150 30 50 120\" opacity=\"0.5\"/>\n\n                  <!-- 散落在四周的微小血色符文光点 -->\n                  <circle cx=\"300\" cy=\"250\" r=\"2\" fill=\"#f87171\" filter=\"blur(1px)\"/>\n                  <circle cx=\"750\" cy=\"380\" r=\"3\" fill=\"#ef4444\" filter=\"blur(1px)\"/>\n                  <circle cx=\"250\" cy=\"600\" r=\"1.5\" fill=\"#fca5a5\"/>\n                  <circle cx=\"680\" cy=\"750\" r=\"2.5\" fill=\"#f87171\" filter=\"blur(1px)\"/>\n\n                  <!-- ================= 6. 核心：不灭的血色晶体 (生命力与能量的凝结) ================= -->\n                  <!-- 晶体散发出的巨大能量光晕 -->\n                  <circle cx=\"500\" cy=\"500\" r=\"150\" fill=\"url(#blood-mist-${uid})\" />\n                  <circle cx=\"500\" cy=\"500\" r=\"80\" fill=\"#dc2626\" opacity=\"0.2\" filter=\"blur(15px)\"/>\n\n                  <!-- 悬浮晶体向下的深渊投影 -->\n                  <polygon points=\"480,620 550,700 450,700\" fill=\"#000\" opacity=\"0.6\" filter=\"blur(6px)\"/>\n\n                  <!-- 血晶主体 (菱形八面体结构) -->\n                  <g filter=\"drop-shadow(0px 0px 20px rgba(220, 38, 38, 0.8))\">\n                    <!-- 左侧暗面 -->\n                    <polygon points=\"500,350 500,600 450,500\" fill=\"#991b1b\"/>\n                    <!-- 右侧受光面 -->\n                    <polygon points=\"500,350 550,500 500,600\" fill=\"url(#blood-crystal-${uid})\"/>\n                    <!-- 顶部切面反光 -->\n                    <polygon points=\"500,350 520,400 480,400\" fill=\"#fecaca\" opacity=\"0.8\"/>\n                    <!-- 晶体内部的能量核心线 -->\n                    <line x1=\"500\" y1=\"350\" x2=\"500\" y2=\"600\" stroke=\"#fca5a5\" stroke-width=\"2\" opacity=\"0.9\"/>\n                    <line x1=\"450\" y1=\"500\" x2=\"550\" y2=\"500\" stroke=\"#f87171\" stroke-width=\"1.5\" opacity=\"0.7\"/>\n                  <\/g>\n\n                  <!-- 围绕晶体缓缓旋转的碎石和血光 (动态静止感) -->\n                  <circle cx=\"430\" cy=\"450\" r=\"4\" fill=\"#fca5a5\" opacity=\"0.9\"/>\n                  <circle cx=\"570\" cy=\"540\" r=\"3\" fill=\"#ef4444\" opacity=\"0.8\"/>\n                  <circle cx=\"520\" cy=\"320\" r=\"2\" fill=\"#f87171\" opacity=\"0.7\"/>\n                  <polygon points=\"400,520 415,530 405,540\" fill=\"#18181b\" stroke=\"#ef4444\" stroke-width=\"0.5\"/>\n                  <polygon points=\"580,420 590,410 595,425\" fill=\"#18181b\" stroke=\"#ef4444\" stroke-width=\"0.5\"/>\n\n                <\/svg>\n              `;\n\n            case 'marketplace':\n              return `\n                <svg class=\"map-svg-bg\" viewBox=\"0 0 1000 1000\" preserveAspectRatio=\"xMidYMid slice\">\n                  <defs>\n                    <!-- 印象派画风：整个坊市是一张巨大的、被暖光与冷夜交替渲染的画布 -->\n                    \n                    <!-- 底色：深邃的夜空与青石板融合的模糊紫蓝色调 -->\n                    <radialGradient id=\"market-base-${uid}\" cx=\"50%\" cy=\"50%\" r=\"70%\">\n                      <stop offset=\"0%\" stop-color=\"#312e81\" stop-opacity=\"0.8\"/>    <!-- 靛蓝晕染 -->\n                      <stop offset=\"50%\" stop-color=\"#1e1b4b\" stop-opacity=\"0.95\"/>   <!-- 深紫罗兰夜色 -->\n                      <stop offset=\"100%\" stop-color=\"#020617\" stop-opacity=\"1\"/>     <!-- 画布边缘的暗场 -->\n                    <\/radialGradient>\n\n                    <!-- 油画笔触色块：灯笼投射在地面的大片琥珀色光晕 (湿壁画感) -->\n                    <radialGradient id=\"puddle-amber-${uid}\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n                      <stop offset=\"0%\" stop-color=\"#d97706\" stop-opacity=\"0.6\"/>\n                      <stop offset=\"50%\" stop-color=\"#b45309\" stop-opacity=\"0.3\"/>\n                      <stop offset=\"100%\" stop-color=\"#78350f\" stop-opacity=\"0\"/>\n                    <\/radialGradient>\n\n                    <!-- 油画笔触色块：灵物摊位散发的冷青色/紫红色魔幻光晕 -->\n                    <radialGradient id=\"puddle-cyan-${uid}\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n                      <stop offset=\"0%\" stop-color=\"#0d9488\" stop-opacity=\"0.7\"/>\n                      <stop offset=\"60%\" stop-color=\"#115e59\" stop-opacity=\"0.2\"/>\n                      <stop offset=\"100%\" stop-color=\"#0f172a\" stop-opacity=\"0\"/>\n                    <\/radialGradient>\n                    \n                    <radialGradient id=\"puddle-magenta-${uid}\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n                      <stop offset=\"0%\" stop-color=\"#9d174d\" stop-opacity=\"0.6\"/>\n                      <stop offset=\"60%\" stop-color=\"#701a75\" stop-opacity=\"0.2\"/>\n                      <stop offset=\"100%\" stop-color=\"#2e1065\" stop-opacity=\"0\"/>\n                    <\/radialGradient>\n\n                    <!-- 摊位顶棚的渐变色块 (取代线条，用颜色的堆叠表现体积) -->\n                    <linearGradient id=\"tent-warm-${uid}\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n                      <stop offset=\"0%\" stop-color=\"#991b1b\" stop-opacity=\"0.9\"/>\n                      <stop offset=\"100%\" stop-color=\"#450a0a\" stop-opacity=\"0.9\"/>\n                    <\/linearGradient>\n                    \n                    <linearGradient id=\"tent-cool-${uid}\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n                      <stop offset=\"0%\" stop-color=\"#0f766e\" stop-opacity=\"0.9\"/>\n                      <stop offset=\"100%\" stop-color=\"#042f2e\" stop-opacity=\"0.9\"/>\n                    <\/linearGradient>\n                  <\/defs>\n\n                  <!-- 1. 铺底画布：没有边界的夜色 -->\n                  <rect width=\"1000\" height=\"1000\" fill=\"url(#market-base-${uid})\" />\n\n                  <!-- 2. 大面积的光晕底色涂抹 (Sfumato 晕染技法) \n                       在黑夜中抹上大块的暖色和冷色，确立坊市“熙熙攘攘但模糊”的氛围基调 -->\n                  <circle cx=\"300\" cy=\"700\" r=\"350\" fill=\"url(#puddle-amber-${uid})\" filter=\"blur(30px)\"/>\n                  <circle cx=\"700\" cy=\"300\" r=\"400\" fill=\"url(#puddle-cyan-${uid})\" filter=\"blur(40px)\"/>\n                  <circle cx=\"800\" cy=\"800\" r=\"300\" fill=\"url(#puddle-magenta-${uid})\" filter=\"blur(35px)\"/>\n                  <circle cx=\"200\" cy=\"200\" r=\"250\" fill=\"url(#puddle-amber-${uid})\" filter=\"blur(25px)\"/>\n\n                  <!-- 3. 色块堆叠：街道/小径的印象 (用不规则的多边形重叠，模拟凹凸不平的青石板反光) -->\n                  <!-- 没有任何 stroke，全靠相邻色块的明暗对比 -->\n                  <polygon points=\"100,1000 400,600 500,400 800,0 1000,0 800,500 500,800 300,1000\" fill=\"#312e81\" opacity=\"0.3\" filter=\"blur(5px)\"/>\n                  <polygon points=\"150,1000 420,650 520,450 780,0 850,0 750,450 450,750 200,1000\" fill=\"#4338ca\" opacity=\"0.2\" filter=\"blur(2px)\"/>\n                  <polygon points=\"250,1000 480,700 550,500 850,50 900,100 800,550 500,850 350,1000\" fill=\"#d97706\" opacity=\"0.1\" filter=\"blur(8px)\"/>\n\n                  <!-- 4. 色块堆叠：摊位与建筑的几何印象 (Impasto 厚涂感) -->\n                  \n                  <!-- 左下角的红色暖光大摊位 (也许是卖符箓或法器的) -->\n                  <g>\n                    <!-- 摊位的深渊投影 -->\n                    <polygon points=\"0,550 350,450 450,750 0,900\" fill=\"#020617\" opacity=\"0.8\" filter=\"blur(10px)\"/>\n                    <!-- 顶棚色块 (大面积的深红到暗红渐变) -->\n                    <polygon points=\"-50,500 300,400 380,600 -50,750\" fill=\"url(#tent-warm-${uid})\"/>\n                    <!-- 顶棚受光面 (高光色块，制造立体感) -->\n                    <polygon points=\"-50,500 300,400 250,450 -50,550\" fill=\"#b91c1c\" opacity=\"0.7\"/>\n                    <!-- 摊位桌面的反光色块 -->\n                    <polygon points=\"50,700 300,600 350,750 100,850\" fill=\"#78350f\" opacity=\"0.9\"/>\n                    <polygon points=\"100,720 280,630 300,700 120,780\" fill=\"#b45309\" opacity=\"0.6\" filter=\"blur(2px)\"/>\n                  <\/g>\n\n                  <!-- 右上角的青色冷光摊位 (也许是卖灵草或古卷的) -->\n                  <g>\n                    <!-- 阴影底色 -->\n                    <polygon points=\"600,0 1000,0 1000,400 700,450\" fill=\"#020617\" opacity=\"0.8\" filter=\"blur(10px)\"/>\n                    <!-- 顶棚色块 -->\n                    <polygon points=\"650,-50 1050,-50 1050,300 750,350\" fill=\"url(#tent-cool-${uid})\"/>\n                    <!-- 顶棚高光色块 -->\n                    <polygon points=\"650,-50 1050,-50 1000,50 680,50\" fill=\"#0d9488\" opacity=\"0.6\"/>\n                    <!-- 桌面反光 -->\n                    <polygon points=\"700,400 950,250 1000,400 750,550\" fill=\"#134e4a\" opacity=\"0.9\"/>\n                    <!-- 灵草散发的青色光晕 -->\n                    <circle cx=\"850\" cy=\"350\" r=\"60\" fill=\"url(#puddle-cyan-${uid})\"/>\n                    <circle cx=\"850\" cy=\"350\" r=\"15\" fill=\"#5eead4\" filter=\"blur(4px)\"/>\n                  <\/g>\n\n                  <!-- 右下角的紫色神秘摊位 (黑市角落的隐喻) -->\n                  <g>\n                    <!-- 阴影 -->\n                    <polygon points=\"750,650 1050,550 1050,1050 850,1050\" fill=\"#000\" opacity=\"0.9\" filter=\"blur(15px)\"/>\n                    <polygon points=\"800,700 1050,600 1050,900 850,1000\" fill=\"#4a044e\" opacity=\"0.8\"/>\n                    <polygon points=\"800,700 1050,600 1000,650 820,750\" fill=\"#86198f\" opacity=\"0.5\"/>\n                    <circle cx=\"950\" cy=\"800\" r=\"50\" fill=\"url(#puddle-magenta-${uid})\"/>\n                    <circle cx=\"920\" cy=\"820\" r=\"10\" fill=\"#f0abfc\" filter=\"blur(3px)\"/>\n                    <circle cx=\"980\" cy=\"780\" r=\"8\" fill=\"#e879f9\" filter=\"blur(2px)\"/>\n                  <\/g>\n\n                  <!-- 5. 印象派的“人群” (没有清晰的四肢五官，只有被暖光勾勒的色块) -->\n                  <!-- 这里的柱状色块代表着流动的修士，他们是坊市氛围的一部分，但不会打扰你 -->\n                  <g opacity=\"0.7\">\n                    <!-- 街道中央流动的群像印象 -->\n                    <rect x=\"450\" y=\"450\" width=\"40\" height=\"90\" rx=\"20\" fill=\"#1e1b4b\" filter=\"blur(3px)\"/>\n                    <rect x=\"460\" y=\"460\" width=\"15\" height=\"50\" rx=\"7\" fill=\"#f59e0b\" opacity=\"0.4\" filter=\"blur(4px)\"/> <!-- 侧面受光面 -->\n\n                    <rect x=\"520\" y=\"380\" width=\"30\" height=\"70\" rx=\"15\" fill=\"#312e81\" filter=\"blur(4px)\"/>\n                    <rect x=\"525\" y=\"390\" width=\"10\" height=\"30\" rx=\"5\" fill=\"#0d9488\" opacity=\"0.5\" filter=\"blur(3px)\"/>\n\n                    <rect x=\"380\" y=\"600\" width=\"45\" height=\"100\" rx=\"22\" fill=\"#0f172a\" filter=\"blur(5px)\"/>\n                    <rect x=\"390\" y=\"610\" width=\"15\" height=\"60\" rx=\"7\" fill=\"#b91c1c\" opacity=\"0.3\" filter=\"blur(5px)\"/>\n\n                    <rect x=\"600\" y=\"550\" width=\"35\" height=\"85\" rx=\"17\" fill=\"#2e1065\" filter=\"blur(4px)\"/>\n                    <rect x=\"615\" y=\"560\" width=\"15\" height=\"40\" rx=\"7\" fill=\"#d946ef\" opacity=\"0.4\" filter=\"blur(4px)\"/>\n                  <\/g>\n\n                  <!-- 6. 提亮的光源点缀 (代表空中的漂浮法灯、灯笼，油画的高光点) -->\n                  <g>\n                    <!-- 暖黄色高光色点 -->\n                    <circle cx=\"350\" cy=\"400\" r=\"8\" fill=\"#fde047\" filter=\"blur(1px)\"/>\n                    <circle cx=\"350\" cy=\"400\" r=\"25\" fill=\"#eab308\" opacity=\"0.4\" filter=\"blur(8px)\"/>\n                    \n                    <circle cx=\"280\" cy=\"550\" r=\"6\" fill=\"#fcd34d\" filter=\"blur(1px)\"/>\n                    <circle cx=\"280\" cy=\"550\" r=\"20\" fill=\"#d97706\" opacity=\"0.5\" filter=\"blur(6px)\"/>\n\n                    <circle cx=\"680\" cy=\"180\" r=\"10\" fill=\"#fef08a\" filter=\"blur(2px)\"/>\n                    <circle cx=\"680\" cy=\"180\" r=\"30\" fill=\"#ca8a04\" opacity=\"0.3\" filter=\"blur(10px)\"/>\n\n                    <!-- 远处的零星冷色灯火 (增加画面的透视深度) -->\n                    <circle cx=\"650\" cy=\"300\" r=\"3\" fill=\"#67e8f9\" opacity=\"0.8\"/>\n                    <circle cx=\"700\" cy=\"250\" r=\"2\" fill=\"#a78bfa\" opacity=\"0.7\"/>\n                    <circle cx=\"750\" cy=\"320\" r=\"4\" fill=\"#93c5fd\" opacity=\"0.6\"/>\n                  <\/g>\n\n                  <!-- 7. 构图的前景虚化 (Vignette 效果，仿佛你站在一个暗巷的转角往外看，极具安全感) -->\n                  <!-- 左上角遮挡暗块 -->\n                  <polygon points=\"0,0 250,0 0,300\" fill=\"#020617\" opacity=\"0.9\" filter=\"blur(15px)\"/>\n                  <polygon points=\"0,0 150,0 0,200\" fill=\"#000000\" opacity=\"1\" filter=\"blur(5px)\"/>\n                  \n                  <!-- 右下角遮挡暗块 -->\n                  <polygon points=\"1000,1000 650,1000 1000,700\" fill=\"#020617\" opacity=\"0.9\" filter=\"blur(20px)\"/>\n                  <polygon points=\"1000,1000 800,1000 1000,850\" fill=\"#000000\" opacity=\"1\" filter=\"blur(8px)\"/>\n\n                <\/svg>\n              `;\n\n            case 'tavern':\n              return `\n                <svg class=\"map-svg-bg\" viewBox=\"0 0 1000 1000\" preserveAspectRatio=\"xMidYMid slice\">\n                  <defs>\n                    <!-- 客栈温暖的室内底光 (原木暗色到中心暖光) -->\n                    <radialGradient id=\"tavern-ambient-${uid}\" cx=\"50%\" cy=\"50%\" r=\"75%\">\n                      <stop offset=\"0%\" stop-color=\"#3e2723\" stop-opacity=\"1\"/>     <!-- 暖木色 -->\n                      <stop offset=\"60%\" stop-color=\"#2a1a16\" stop-opacity=\"0.95\"/>  <!-- 暗木色 -->\n
