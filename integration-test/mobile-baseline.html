es === 'function' && typeof replaceTavernRegexes === 'function';\n        },\n\n        // ---------- 预设 JSON 文件导入/导出 ----------\n        exportPresetFile(data, filename) {\n          try {\n            const json = JSON.stringify(data, null, 2);\n            const blob = new Blob([json], { type: 'application/json' });\n            const url = URL.createObjectURL(blob);\n            const a = document.createElement('a');\n            a.href = url;\n            a.download = filename;\n            document.body.appendChild(a);\n            a.click();\n            document.body.removeChild(a);\n            setTimeout(() => URL.revokeObjectURL(url), 1000);\n          } catch (e) {\n            alert('导出失败：' + e.message);\n          }\n        },\n\n        importPresetFile(accept, callback) {\n          const input = document.createElement('input');\n          input.type = 'file';\n          input.accept = accept;\n          input.style.display = 'none';\n          input.addEventListener('change', () => {\n            const file = input.files && input.files[0];\n            if (!file) return;\n            const reader = new FileReader();\n            reader.onload = () => {\n              try {\n                callback(JSON.parse(reader.result));\n              } catch (e) {\n                alert('JSON 解析失败：' + e.message);\n              }\n            };\n            reader.readAsText(file);\n            document.body.removeChild(input);\n          });\n          document.body.appendChild(input);\n          input.click();\n        },\n\n        initImageUI() {\n          const base = window.MMS_IMAGE_DATA_BASE || window.MMS_IMAGE_DATA;\n          this.imageBase = base;\n          this.imageData = JSON.parse(JSON.stringify(base));\n\n          const list = document.getElementById('mms-img-list');\n          if (list) {\n            list.addEventListener('change', (e) => this.onImageRowEdit(e));\n            list.addEventListener('click', (e) => {\n              const del = e.target.closest('.mms-img-del');\n              if (del) this.deleteImageKey(del.getAttribute('data-name'));\n            });\n          }\n          const search = document.getElementById('mms-img-search');\n          if (search) {\n            search.addEventListener('input', () => {\n              this.imageSearch = search.value.trim().toLowerCase();\n              this.renderImageList();\n            });\n          }\n          document.querySelectorAll('.mms-img-cat-btn').forEach((btn) => {\n            btn.addEventListener('click', () => {\n              this.imageCat = btn.getAttribute('data-cat') || 'portrait';\n              document.querySelectorAll('.mms-img-cat-btn').forEach((b) => b.classList.toggle('active', b === btn));\n              this.renderImageList();\n            });\n          });\n          const addBtn = document.getElementById('mms-img-add');\n          if (addBtn) addBtn.addEventListener('click', () => this.addImageEntry());\n          const saveBtn = document.getElementById('mms-img-save');\n          if (saveBtn) saveBtn.addEventListener('click', () => this.saveImageDataToSource());\n          const copyBtn = document.getElementById('mms-img-copy');\n          if (copyBtn) copyBtn.addEventListener('click', () => this.copyImageDataCode());\n          const expBtn = document.getElementById('mms-img-export');\n          if (expBtn) expBtn.addEventListener('click', () => this.exportPresetFile(this.imageData, 'mms-images.json'));\n          const impBtn = document.getElementById('mms-img-import');\n          if (impBtn) impBtn.addEventListener('click', () => this.importImageData());\n\n          this.syncImageUI();\n        },\n\n        renderImageList() {\n          const listEl = document.getElementById('mms-img-list');\n          if (!listEl || !this.imageData) return;\n          const data = this.imageData[this.imageCat] || {};\n          const q = this.imageSearch;\n          const names = Object.keys(data).filter(\n            (k) => !q || k.toLowerCase().includes(q) || String(data[k]).toLowerCase().includes(q),\n          );\n          listEl.innerHTML = '';\n          if (!names.length) {\n            listEl.innerHTML =\n              '<p class=\"text-[10px] text-gray-500 py-2 text-center\">' +\n              (q ? '没有匹配「' + q + '」的条目' : '此分类暂无图片，请在下方添加') +\n              '<\/p>';\n            return;\n          }\n          names.forEach((name) => {\n            const url = data[name];\n            const row = document.createElement('div');\n            row.className = 'mms-img-row';\n            row.setAttribute('data-name', name);\n            if (this.validateImageName(name) || this.validateImageUrl(url)) row.classList.add('invalid');\n\n            const thumb = document.createElement('div');\n            thumb.className = 'mms-img-thumb';\n            thumb.title = name;\n            this.fillImageThumb(thumb, url);\n            row.appendChild(thumb);\n\n            const nameInput = document.createElement('input');\n            nameInput.className = 'form-input mms-img-name';\n            nameInput.value = name;\n            nameInput.placeholder = '名称';\n            row.appendChild(nameInput);\n\n            const urlInput = document.createElement('input');\n            urlInput.className = 'form-input mms-img-url';\n            urlInput.value = url;\n            urlInput.placeholder = 'https://…';\n            urlInput.spellcheck = false;\n            row.appendChild(urlInput);\n\n            const del = document.createElement('button');\n            del.className = 'mms-img-del';\n            del.type = 'button';\n            del.title = '删除「' + name + '」';\n            del.setAttribute('data-name', name);\n            del.textContent = '✕';\n            row.appendChild(del);\n\n            listEl.appendChild(row);\n          });\n        },\n\n        fillImageThumb(thumb, url) {\n          thumb.innerHTML = '';\n          if (!url) {\n            thumb.textContent = '🖼';\n            return;\n          }\n          const img = document.createElement('img');\n          img.loading = 'lazy';\n          img.alt = '';\n          img.src = url;\n          img.onerror = () => {\n            thumb.innerHTML = '';\n            thumb.textContent = '⚠';\n          };\n          thumb.appendChild(img);\n        },\n\n        onImageRowEdit(e) {\n          const row = e.target.closest('.mms-img-row');\n          if (!row || !this.imageData) return;\n          const oldName = row.getAttribute('data-name');\n          const cat = this.imageCat;\n          const data = this.imageData[cat];\n          if (!data || !(oldName in data)) return;\n\n          if (e.target.classList.contains('mms-img-name')) {\n            const newName = e.target.value.trim();\n            const err = this.validateImageName(newName);\n            if (err) {\n              alert('名称' + err);\n              e.target.value = oldName;\n              return;\n            }\n            if (newName !== oldName) {\n              if (newName in data) {\n                alert('已存在同名条目：' + newName);\n                e.target.value = oldName;\n                return;\n              }\n              this.renameImageKey(cat, oldName, newName);\n              this.syncImageUI();\n              this.setImageStatus('已重命名为「' + newName + '」');\n            }\n          } else if (e.target.classList.contains('mms-img-url')) {\n            const url = e.target.value.trim();\n            data[oldName] = url;\n            // 就地更新缩略图并同步运行时表\n            this.fillImageThumb(row.querySelector('.mms-img-thumb'), url);\n            row.classList.toggle('invalid', !!(this.validateImageName(oldName) || this.validateImageUrl(url)));\n            this.applyImageEntry(cat, oldName, url);\n            this.updateImageCounts();\n            this.updateImageDirty();\n          }\n        },\n\n        // 单条变更同步到运行时三张表（立即生效）；url 传 null 表示删除\n        applyImageEntry(cat, name, url) {\n          const live = window.MMS_IMAGE_DATA && window.MMS_IMAGE_DATA[cat];\n          if (!live) return;\n          if (url == null) delete live[name];\n          else live[name] = url;\n          if (cat === 'background' && typeof mmsRebuildMapTags === 'function') mmsRebuildMapTags();\n        },\n\n        // 原位替换（保持对象引用，PORTRAIT_MAP/BACKGROUND_MAP/AVATAR_MAP 等别名继续有效）\n        replaceMapInPlace(target, src) {\n          if (!target || !src) return;\n          Object.keys(target).forEach((k) => delete target[k]);\n          Object.keys(src).forEach((k) => {\n            target[k] = src[k];\n          });\n        },\n\n        renameImageKey(cat, oldName, newName) {\n          const reorder = (obj) => {\n            const next = {};\n            Object.keys(obj).forEach((k) => {\n              next[k === oldName ? newName : k] = obj[k];\n            });\n            this.replaceMapInPlace(obj, next);\n          };\n          reorder(this.imageData[cat]);\n          const live = window.MMS_IMAGE_DATA && window.MMS_IMAGE_DATA[cat];\n          if (live && oldName in live) reorder(live);\n          if (cat === 'background' && typeof mmsRebuildMapTags === 'function') mmsRebuildMapTags();\n        },\n\n        deleteImageKey(name) {\n          if (!this.imageData || !(name in this.imageData[this.imageCat])) return;\n          delete this.imageData[this.imageCat][name];\n          this.applyImageEntry(this.imageCat, name, null);\n          this.syncImageUI();\n          this.setImageStatus('已删除「' + name + '」（保存前刷新页面可撤销）');\n        },\n\n        addImageEntry() {\n          if (!this.imageData) return;\n          const nameEl = document.getElementById('mms-img-new-name');\n          const urlEl = document.getElementById('mms-img-new-url');\n          const name = ((nameEl && nameEl.value) || '').trim();\n          const url = ((urlEl && urlEl.value) || '').trim();\n          const err = this.validateImageName(name);\n          if (err) {\n            alert('名称' + err);\n            return;\n          }\n          if (name in this.imageData[this.imageCat]) {\n            alert('已存在同名条目：' + name);\n            return;\n          }\n          const urlErr = this.validateImageUrl(url);\n          if (urlErr) {\n            alert('链接' + urlErr);\n            return;\n          }\n          this.imageData[this.imageCat][name] = url;\n          this.applyImageEntry(this.imageCat, name, url);\n          if (nameEl) nameEl.value = '';\n          if (urlEl) urlEl.value = '';\n          this.syncImageUI();\n          this.setImageStatus('已添加「' + name + '」');\n        },\n\n        validateImageName(name) {\n          if (!name) return '不能为空';\n          if (/[<>\"`]/.test(name)) return '不能包含 < > \" ` 字符';\n          if (/[\\r\\n\\t]/.test(name)) return '不能包含换行或制表符';\n          // 名称作为 JSON 键同样进入正则替换串，$& 等记号会在酒馆套用替换时撕裂注入的 HTML\n          if (/\\$(?:&|`|'|<|\\d|\\$)/.test(name)) return '包含 $&、$1 等 JS 替换特殊记号，会破坏页面注入';\n          return '';\n        },\n\n        validateImageUrl(url) {\n          if (!url) return '不能为空';\n          if (!/^https?:\\/\\/\\S+$/i.test(url)) return '需以 http:// 或 https:// 开头';\n          if (/[\\r\\n\\s\"`]/.test(url)) return '不能包含空格、换行、引号';\n          if (/[<>]/.test(url)) return '不能包含 < > 字符';\n          // $&、$1、$` 等是 JS 替换串特殊记号，会把注入的 HTML 撕裂\n          if (/\\$(?:&|`|'|<|\\d|\\$)/.test(url)) return '包含 $&、$1 等 JS 替换特殊记号，会破坏页面注入';\n          return '';\n        },\n\n        syncImageUI() {\n          this.renderImageList();\n          this.updateImageCounts();\n          this.updateImageDirty();\n        },\n\n        updateImageCounts() {\n          if (!this.imageData) return;\n          this.imageCats.forEach((c) => {\n            const el = document.getElementById('mms-img-count-' + c.key);\n            if (el) el.textContent = String(Object.keys(this.imageData[c.key] || {}).length);\n          });\n        },\n\n        imageDiffCount() {\n          if (!this.imageData || !this.imageBase) return 0;\n          const diff = (a, b) => {\n            let n = 0;\n            new Set([...Object.keys(a), ...Object.keys(b)]).forEach((k) => {\n              if (a[k] !== b[k]) n++;\n            });\n            return n;\n          };\n          let total = 0;\n          this.imageCats.forEach((c) => {\n            total += diff(this.imageData[c.key] || {}, this.imageBase[c.key] || {});\n          });\n          return total;\n        },\n\n        updateImageDirty() {\n          const n = this.imageDiffCount();\n          const badge = document.getElementById('mms-img-dirty');\n          const saveBtn = document.getElementById('mms-img-save');\n          if (badge) {\n            badge.style.display = n ? '' : 'none';\n            badge.textContent = '未保存 ' + n + ' 项';\n          }\n          if (saveBtn) saveBtn.disabled = n === 0;\n        },\n\n        setImageStatus(text) {\n          const el = document.getElementById('mms-img-status');\n          if (!el) return;\n          el.textContent = text || '';\n          el.style.display = text ? '' : 'none';\n          if (text) {\n            clearTimeout(this._imgStatusTimer);\n            this._imgStatusTimer = setTimeout(() => {\n              el.style.display = 'none';\n            }, 4000);\n          }\n        },\n\n        // 把图片数据序列化为带标记的源码块（< 转义为 \\u003c，防止出现 script 闭合标签截断内联脚本）\n        // & 全量转义为 \\u0026（字符串里语义等价）：酒馆管线连无分号旧式实体都解码\n        // （&not→¬、&quot→\"），任何裸 & 都是活弹；且 \\u0026 不含 & 字符，本地\n        // 「复制配置」粘贴回源码再构建时不会被全量 &amp; 转义二次叠加\n        // 注意：标记用拼接构造——若以完整字面量出现在本函数里，源码中会存在第二处可被\n        // MMS_IMG_BLOCK_RE 匹配的文本，导致「保存到源码」的唯一性校验永远失败\n        serializeImageData(data) {\n          const json = JSON.stringify(data, null, 2)\n            .replace(/<\/g, '\\\\u003c')\n            .replace(/&/g, '\\\\u0026');\n          const startMark = '/* ' + '==== MMS_IMAGE_DATA_START ==== */';\n          const endMark = '/* ' + '==== MMS_IMAGE_DATA_END ==== */';\n          return startMark + '\\nwindow.MMS_IMAGE_DATA = ' + json + ';\\n' + endMark;\n        },\n\n        // 定位承载本页面的正则（build_regex.mjs 的固定 UUID 优先，其次标记块，最后脚本名）\n        async findSelfRegex() {\n          const SELF_ID = '1fe27bc2-f26b-4946-a60e-5ad7c1a7766e';\n          const SELF_NAME = '美化状态栏[手机专用]';\n          const options = [{ type: 'global' }, { type: 'character', name: 'current' }];\n          for (const option of options) {\n            let regexes;\n            try {\n              regexes = getTavernRegexes(option);\n              if (regexes && typeof regexes.then === 'function') regexes = await regexes;\n            } catch (e) {\n              continue;\n            }\n            if (!Array.isArray(regexes) || !regexes.length) continue;\n            const hasMarker = (r) => String((r && r.replace_string) || '').includes('MMS_IMAGE_DATA_START');\n            let index = regexes.findIndex((r) => r && r.id === SELF_ID && hasMarker(r));\n            if (index < 0) index = regexes.findIndex((r) => r && r.id === SELF_ID);\n            if (index < 0) index = regexes.findIndex(hasMarker);\n            if (index < 0) index = regexes.findIndex((r) => r && (r.script_name === SELF_NAME || r.scriptName === SELF_NAME));\n            if (index >= 0) return { option, regexes, index };\n          }\n          return null;\n        },\n\n        // 核心流程：校验 → 定位正则 → 精确替换标记块 → replaceTavernRegexes 写回\n        //（写回后酒馆会重载聊天并触发 CHAT_CHANGED，本 iframe 自动以新源码重建）\n        async saveImageDataToSource() {\n          if (!this.imageData) return;\n          // 1. 全量校验，有非法条目则拒绝保存\n          const problems = [];\n          this.imageCats.forEach((c) => {\n            const data = this.imageData[c.key] || {};\n            Object.keys(data).forEach((k) => {\n              const e1 = this.validateImageName(k);\n              const e2 = this.validateImageUrl(data[k]);\n              if (e1) problems.push(c.label + '「' + k + '」名称' + e1);\n              else if (e2) problems.push(c.label + '「' + k + '」链接' + e2);\n            });\n          });\n          if (problems.length) {\n            alert(\n              '以下条目有问题，请先修正：\\n' +\n                problems.slice(0, 10).join('\\n') +\n                (problems.length > 10 ? '\\n…共 ' + problems.length + ' 项' : ''),\n            );\n            this.renderImageList();\n            return;\n          }\n\n          if (!this.hasRegexApi()) {\n            alert('当前环境没有酒馆助手正则 API，无法写回源码。\\n可先「导出」JSON 备份，或「复制配置」后手动粘贴回 MiniMapStatusMobile.html。');\n            return;\n          }\n\n          const btn = document.getElementById('mms-img-save');\n          const restoreBtn = () => {\n            if (btn) {\n              btn.disabled = false;\n              btn.innerHTML = '<i class=\"fa fa-save mr-1\"><\/i>保存到源码';\n            }\n          };\n          if (btn) {\n            btn.disabled = true;\n            btn.innerHTML = '<i class=\"fa fa-spinner fa-spin mr-1\"><\/i>写入中…';\n          }\n\n          try {\n            const found = await this.findSelfRegex();\n            if (!found) {\n              alert('未找到承载本页面的正则脚本（美化状态栏[手机专用]）。\\n请确认该正则未被删除或改名；数据仍在编辑中，可「导出」先备份。');\n              return;\n            }\n            const { option, regexes, index } = found;\n            const src = String((regexes[index] && regexes[index].replace_string) || '');\n            const matches = src.match(MMS_IMG_BLOCK_RE) || [];\n            if (matches.length !== 1) {\n              alert('正则源码中未找到唯一的图片数据标记块（匹配 ' + matches.length + ' 处），为安全起见已取消写入。');\n              return;\n            }\n            const block = this.serializeImageData(this.imageData);\n            regexes[index].replace_string = src.replace(MMS_IMG_BLOCK_RE, () => block);\n            await replaceTavernRegexes(regexes, option);\n            // 走到这里通常页面已被酒馆重载；若未重载则手动对齐基线\n            window.MMS_IMAGE_DATA_BASE = JSON.parse(JSON.stringify(this.imageData));\n            this.imageBase = window.MMS_IMAGE_DATA_BASE;\n            this.updateImageDirty();\n            this.setImageStatus('已写回源码，页面即将自动刷新');\n          } catch (e) {\n            console.error('[MMS] 图片配置写回失败:', e);\n            alert('写回失败：' + (e && e.message ? e.message : e) + '\\n数据未丢失（仍在编辑中），可「导出」先备份。');\n          } finally {\n            restoreBtn();\n          }\n        },\n\n        async copyImageDataCode() {\n          if (!this.imageData) return;\n          const code = this.serializeImageData(this.imageData);\n          let ok = false;\n          try {\n            // 剪贴板 API 可能因权限挂起（iframe/嵌入式环境），超时后走 execCommand 降级\n            const write = navigator.clipboard && navigator.clipboard.writeText\n              ? navigator.clipboard.writeText(code)\n              : Promise.reject(new Error('no clipboard api'));\n            await Promise.race([write, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 1500))]);\n            ok = true;\n          } catch (e) {\n            // 降级：临时 textarea + execCommand\n            try {\n              const ta = document.createElement('textarea');\n              ta.value = code;\n              ta.style.position = 'fixed';\n              ta.style.opacity = '0';\n              document.body.appendChild(ta);\n              ta.select();\n              ok = document.execCommand('copy');\n              document.body.removeChild(ta);\n            } catch (e2) {\n              ok = false;\n            }\n          }\n          if (ok) {\n            this.setImageStatus('已复制：在本地 MiniMapStatusMobile.html 中全选旧标记块（START 到 END 两行含中间内容）后粘贴替换');\n          } else {\n            alert('复制失败，请改用「导出」保存 JSON。');\n          }\n        },\n\n        importImageData() {\n          if (!this.imageData) return;\n          this.importPresetFile('application/json', (data) => {\n            const errMsg = 'JSON 格式不对：应为「导出」产生的 { portrait, background, avatar } 结构';\n            if (!data || typeof data !== 'object' || Array.isArray(data)) {\n              alert(errMsg);\n              return;\n            }\n            const next = {};\n            for (const c of this.imageCats) {\n              const src = data[c.key];\n              if (!src || typeof src !== 'object' || Array.isArray(src)) {\n                alert(errMsg);\n                return;\n              }\n              for (const k of Object.keys(src)) {\n                if (typeof src[k] !== 'string') {\n                  alert(errMsg + '（' + c.label + '「' + k + '」的链接不是字符串）');\n                  return;\n                }\n              }\n              next[c.key] = Object.assign({}, src);\n            }\n            if (!confirm('导入将覆盖当前编辑中的三张图片表（未保存的修改会丢失），继续？')) return;\n            this.imageData = next;\n            for (const c of this.imageCats) {\n              this.replaceMapInPlace(window.MMS_IMAGE_DATA[c.key], next[c.key]);\n            }\n            if (typeof mmsRebuildMapTags === 'function') mmsRebuildMapTags();\n            this.syncImageUI();\n            this.setImageStatus(\n              '导入完成（立绘 ' +\n                Object.keys(next.portrait).length +\n                ' / 底图 ' +\n                Object.keys(next.background).length +\n                ' / 头像 ' +\n                Object.keys(next.avatar).length +\n                ' 项），记得「保存到源码」',\n            );\n          });\n        },\n      };\n\n      // 页签切换钩子（mmsSwitchSettingTab 切到图片管理时刷新列表）\n      function renderImageList() {\n        if (MMS_IMG) MMS_IMG.renderImageList();\n      }\n\n      // ---------- 名称工具（自最新版移植：立绘变体/卡片显示共用） ----------\n      const MMS_EMOJI_SRC =\n        '[\\\\u{1F000}-\\\\u{1FAFF}\\\\u{2190}-\\\\u{21FF}\\\\u{2300}-\\\\u{23FF}\\\\u{2460}-\\\\u{25FF}\\\\u{2600}-\\\\u{27BF}\\\\u{2900}-\\\\u{297F}\\\\u{2B00}-\\\\u{2BFF}\\\\u{FE0F}\\\\u{200D}\\\\u{20E3}]';\n      function mmsStripEmoji(s) {\n        return String(s || '').replace(new RegExp(MMS_EMOJI_SRC, 'gu'), '');\n      }\n      // 轻清洗：仅去emoji与空白（用于展示、正文命中检测）\n      function mmsPlainName(name) {\n        return mmsStripEmoji(name).replace(/[\\s【】]/g, '').trim();\n      }\n      // 名字显示归一：emoji 打头时补前导空格（保留页签/卡片标题的 emoji 图标约定）\n      function mmsNormalizeDisplayName(name) {\n        const s = String(name == null ? '' : name).trim();\n        if (s && /^\\p{Extended_Pictographic}/u.test(s)) return ' ' + s;\n        return s;\n      }\n\n      const triggerQuickReply = text => {\n        if (!text || ['…', '...'].includes(text.trim()) || text.trim().length === 0) return;\n        if (typeof triggerSlash === 'function') {\n          triggerSlash(`/send ${text}|/trigger`);\n        } else {\n          console.log('SillyTavern environment not detected. Would send:', text);\n        }\n      };\n\n      const sendToChatBox = text => {\n        if (!text || ['…', '...'].includes(text.trim()) || text.trim().length === 0) return;\n\n        try {\n          const textarea = parent.document.getElementById('send_textarea') || parent.document.querySelector('#send_textarea');\n          if (!textarea) {\n            console.log('未找到聊天输入框 (#send_textarea)');\n            return;\n          }\n          const currentContent = textarea.value || '';\n          if (currentContent.includes(text.trim())) {\n            console.log('聊天框中已包含该文本，跳过添加');\n            return;\n          }\n          const separator = currentContent.trim() ? '\\n' : '';\n          const newContent = currentContent + separator + text.trim();\n          textarea.value = newContent;\n          textarea.dispatchEvent(new Event('input', { bubbles: true }));\n          console.log('已添加文本到聊天框:', text.trim());\n        } catch (error) {\n          console.error('发送到聊天框时出错:', error);\n          triggerQuickReply(text);\n        }\n      };\n\n      document.addEventListener('DOMContentLoaded', () => {\n        initSettingsPanel();\n        initErrorModal();\n        initThemeToggle();\n        formatMainText();\n        MMS_IMG.initImageUI();\n        MMS.boot();\n        MMS.initApiPresetUI();\n        MMS.initMapsUI();\n\n        const storyRenderer = new StoryRenderer('yaml-data-source');\n        storyRenderer.init();\n\n        console.log('设置为美化状态栏模式...');\n        updateDisplayMode('status-only');\n\n        document.getElementById('options-list').addEventListener('click', event => {\n          if (event.target.tagName === 'LI') {\n            const optionText = event.target.textContent.trim();\n            const cleanedText = optionText.replace(/^\\d+\\.\\s*/, '');\n\n            const actionMode = getActionMode();\n            if (actionMode === 'send-to-chat') {\n              sendToChatBox(cleanedText);\n            } else {\n              triggerQuickReply(cleanedText);\n            }\n\n            const originalBg = event.target.style.backgroundColor;\n            event.target.style.backgroundColor = 'rgba(157, 124, 245, 0.2)';\n            setTimeout(() => {\n              event.target.style.backgroundColor = originalBg;\n            }, 300);\n          }\n        });\n\n        function getActionMode() {\n          const savedMode = localStorage.getItem('actionMode');\n          return savedMode || 'send-to-chat';\n        }\n      });\n\n      function formatMainText(text) {\n        const maintextContainer = document.getElementById('maintext-container');\n        try {\n          if (typeof text === 'undefined' || !text.trim()) {\n            maintextContainer.innerHTML = '<div class=\"loading-state\"><i class=\"fa fa-spinner fa-spin mr-2\"><\/i>加载中...<\/div>';\n            return;\n          }\n\n          const englishDoubleQuoteRegex = /\"([^\"\\\\]*(?:\\\\.[^\"\\\\]*)*)\"/g;\n          text = text.replace(englishDoubleQuoteRegex, (match, content) => {\n            return `<span class=\"double-quoted\">\"<\/span><span class=\"double-quoted\">${content}<\/span><span class=\"double-quoted\">\"<\/span>`;\n          });\n\n          const chineseLeftQuoteRegex = /\"([^\"]*?)\"/g;\n          text = text.replace(chineseLeftQuoteRegex, (match, content) => {\n            return `<span class=\"double-quoted\">\"<\/span><span class=\"double-quoted\">${content}<\/span><span class=\"double-quoted\">\"<\/span>`;\n          });\n\n          const singleQuoteRegex = /'([^'\\\\]*(?:\\\\.[^'\\\\]*)*)'/g;\n          text = text.replace(singleQuoteRegex, (match, content) => {\n            return `<span class=\"single-quoted\">'<\/span><span class=\"single-quoted\">${content}<\/span><span class=\"single-quoted\">'<\/span>`;\n          });\n\n          const asteriskRegex = /\\*([^\\*]+)\\*/g;\n          text = text.replace(asteriskRegex, (match, content) => {\n            return `<span class=\"asterisk-quoted\">${content}<\/span>`;\n          });\n\n          const paragraphs = text\n            .replace(/\\n\\s*\\n/g, '\\n\\n')\n            .split(/\\n\\s*\\n/)\n            .filter(paragraph => paragraph.trim().length > 0);\n\n          const formattedParagraphs = paragraphs.map(paragraph => {\n            return `<p class=\"paragraph\">${paragraph}<\/p>`;\n          });\n\n          maintextContainer.innerHTML = formattedParagraphs.join('');\n        } catch (error) {\n          console.error('正文渲染失败:', error);\n          maintextContainer.innerHTML =\n            '<div class=\"error-state\"><i class=\"fa fa-exclamation-triangle mr-2\"><\/i>渲染正文失败,请检查正文是否被 &lt;maintext&gt;正文&lt;/maintext&gt;包裹.<\/div>';\n        }\n      }\n\n      function initErrorModal() {\n        const errorModal = document.getElementById('error-modal');\n        const errorClose = document.getElementById('error-close');\n        const errorConfirm = document.getElementById('error-confirm');\n\n        const closeErrorModal = () => {\n          errorModal.style.display = 'none';\n          document.body.style.overflow = '';\n        };\n\n        errorClose.addEventListener('click', closeErrorModal);\n        errorConfirm.addEventListener('click', closeErrorModal);\n\n        errorModal.addEventListener('click', e => {\n          if (e.target === errorModal) {\n            closeErrorModal();\n          }\n        });\n\n        document.addEventListener('keydown', e => {\n          if (e.key === 'Escape' && errorModal.style.display === 'flex') {\n            closeErrorModal();\n          }\n        });\n      }\n\n      function showErrorModal(errorMessage) {\n        const errorModal = document.getElementById('error-modal');\n        const errorDetails = document.getElementById('error-details');\n\n        errorDetails.textContent = errorMessage;\n        errorModal.style.display = 'flex';\n        document.body.style.overflow = 'hidden';\n      }\n\n      // ---------- 徽章按字符数折叠 ----------\n      // 不做 DOM 测量（各环境字体/缩放差异大）：按徽章文本累计字符数判定，\n      // 阈值由用户在设置面板调整（每行字符数）。\n\n      // 每个徽章额外占用的近似间隙字符数\n      const MMS_BADGE_GAP_CHARS = 1;\n\n      function getBadgeFoldCharLimit() {\n        const v = parseInt(localStorage.getItem('badgeFoldCharLimit'), 10);\n        return Number.isFinite(v) && v >= 8 && v <= 200 ? v : 40;\n      }\n\n      function badgeCharLen(text) {\n        return String(text || '').length + MMS_BADGE_GAP_CHARS;\n      }\n\n      function createBadgeExpandButton(badgeContainer) {\n        const btn = document.createElement('button');\n        btn.className = 'item-expand-btn';\n        btn.title = '点击展开全部';\n        btn.textContent = '+N';\n        btn.addEventListener('click', (e) => {\n          e.stopPropagation();\n          if (badgeContainer.classList.contains('expanded')) {\n            // 收起：重新按字符数折叠\n            badgeContainer.classList.remove('expanded');\n            foldBadgeContainer(badgeContainer);\n          } else {\n            badgeContainer.classList.add('expanded');\n            badgeContainer.classList.remove('collapsed');\n            badgeContainer.querySelectorAll('.item-badge-folded').forEach((b) => b.classList.remove('item-badge-folded'));\n            btn.textContent = '收起';\n          }\n        });\n        return btn;\n      }\n\n      // 按字符数折叠单个徽章容器：累计字符超过阈值的第一个徽章起全部隐藏\n      function foldBadgeContainer(container) {\n        const wrapper = container.parentElement;\n        if (!wrapper || !wrapper.classList.contains('item-badge-wrapper')) return;\n        if (container.classList.contains('expanded')) return; // 用户已展开，保持展开\n        const badges = Array.from(container.querySelectorAll('.item-badge'));\n        container.classList.remove('collapsed');\n        badges.forEach((b) => b.classList.remove('item-badge-folded'));\n        let btn = wrapper.querySelector('.item-expand-btn');\n        if (badges.length <= 1) {\n          if (btn) btn.style.display = 'none';\n          return;\n        }\n        const limit = getBadgeFoldCharLimit();\n        // 逐徽章累计字符，超限即折叠（至少保留第 1 个）\n        let acc = 0;\n        let foldFrom = badges.length;\n        for (let i = 0; i < badges.length; i++) {\n          acc += badgeCharLen(badges[i].textContent);\n          if (acc > limit && i > 0) {\n            foldFrom = i;\n            break;\n          }\n        }\n        const hiddenCount = badges.length - foldFrom;\n        if (hiddenCount <= 0) {\n          if (btn) btn.style.display = 'none';\n          return;\n        }\n        for (let i = foldFrom; i < badges.length; i++) badges[i].classList.add('item-badge-folded');\n        container.classList.add('collapsed');\n        if (!btn) {\n          btn = createBadgeExpandButton(container);\n          wrapper.appendChild(btn);\n        }\n        btn.style.display = '';\n        btn.textContent = `+${hiddenCount}`;\n        btn.title = '点击展开全部';\n      }\n\n      // 重算全部徽章容器（设置阈值变化时调用）\n      function refreshExistingBadgeContainers() {\n        document.querySelectorAll('.item-badge-container').forEach((container) => {\n          foldBadgeContainer(container);\n        });\n      }\n\n      // 设置视图就地整栏切换（无遮罩模态）\n      // 页签注册表：新增页签只需在此加一行（按钮 id 约定 tab-btn-<key>，内容 id 约定 tab-content-<key>）\n      const MMS_SETTING_TAB_NAMES = {\n        theme: '界面与交互',\n        ai: '独立LLM更新',\n        maps: '地图管理',\n        images: '图片管理',\n      };\n\n      function mmsToggleSettingsView(show) {\n        const mainView = document.getElementById('mms-main-view');\n        const settingsView = document.getElementById('settings-panel');\n        if (!mainView || !settingsView) return;\n        if (show) {\n          mainView.style.display = 'none';\n          settingsView.style.display = 'block';\n          // 面板从隐藏变可见后页签栏才有真实宽度，重算边缘渐隐\n          if (typeof mmsTabScrollerUpdateEdges === 'function') mmsTabScrollerUpdateEdges();\n        } else {\n          settingsView.style.display = 'none';\n          mainView.style.display = 'block';\n        }\n      }\n\n      function mmsSwitchSettingTab(tabKey) {\n        const tabBtns = {};\n        const tabContents = {};\n        Object.keys(MMS_SETTING_TAB_NAMES).forEach((k) => {\n          tabBtns[k] = document.getElementById('tab-btn-' + k);\n          tabContents[k] = document.getElementById('tab-content-' + k);\n        });\n        Object.keys(MMS_SETTING_TAB_NAMES).forEach(k => {\n          if (tabBtns[k]) {\n            tabBtns[k].classList.remove('active', 'text-primary');\n            tabBtns[k].classList.add('hover:text-gray-200');\n          }\n          if (tabContents[k]) tabContents[k].style.display = 'none';\n        });\n        if (tabBtns[tabKey]) {\n          tabBtns[tabKey].classList.add('active', 'text-primary');\n          tabBtns[tabKey].classList.remove('hover:text-gray-200');\n          // 页签栏可横向滚动：把激活按钮滚进可视区\n          // （用即时滚动：个别嵌入式浏览器对 smooth 滚动静默失败）\n          if (typeof tabBtns[tabKey].scrollIntoView === 'function') {\n            const siv = () => tabBtns[tabKey].scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'auto' });\n            siv();\n            // 激活态字重有 0.15s 过渡，按钮/整栏宽度随后才稳定（rAF 在未聚焦 iframe 会被节流，改用定时器）\n            setTimeout(siv, 60);\n            setTimeout(siv, 250);\n          }\n        }\n        if (tabContents[tabKey]) tabContents[tabKey].style.display = 'block';\n        // 页签栏边缘渐隐：切页签后重算（scrollIntoView 未发生滚动时没有 scroll 事件）\n        if (typeof mmsTabScrollerUpdateEdges === 'function') mmsTabScrollerUpdateEdges();\n        // 切到图片管理时按最新数据重渲染列表（保存/导入后可能已变化）\n        if (tabKey === 'images' && typeof renderImageList === 'function') {\n          renderImageList();\n        }\n        const titleSpan = document.getElementById('settings-current-tab-name');\n        if (titleSpan) titleSpan.textContent = MMS_SETTING_TAB_NAMES[tabKey] || '设置';\n      }\n\n      // 页签栏横向滚动：PC 鼠标按住拖动（位移阈值区分点击/拖动），移动端不接管（原生惯性滑动）。\n      // 边缘渐隐（mask）由 .at-start/.at-end 类控制；字体异步加载会改变页签宽度，\n      // 初始计算可能失真，故在字体就绪/延迟后重算，切页签时也主动重算。\n      let mmsTabScrollerUpdateEdges = null;\n\n      function initTabDragScroll() {\n        const scroller = document.querySelector('.mms-tab-scroller');\n        if (!scroller) return;\n        let dragging = false;\n        let moved = false;\n        let startX = 0;\n        let startY = 0;\n        let startScroll = 0;\n\n        const updateEdges = () => {\n          const max = scroller.scrollWidth - scroller.clientWidth;\n          scroller.classList.toggle('at-start', scroller.scrollLeft <= 1);\n          scroller.classList.toggle('at-end', scroller.scrollLeft >= max - 1);\n        };\n        mmsTabScrollerUpdateEdges = updateEdges;\n\n        scroller.addEventListener('scroll', updateEdges, { passive: true });\n        window.addEventListener('resize', updateEdges);\n        if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {\n          document.fonts.ready.then(() => updateEdges());\n        }\n        setTimeout(updateEdges, 500);\n        setTimeout(updateEdges, 1500);\n        // ResizeObserver 兜底：视口变化/页签变宽（字体加载、激活加粗）后按布局完成时机的精确值重算\n        if (typeof ResizeObserver !== 'undefined') {\n          const ro = new ResizeObserver(() => updateEdges());\n          ro.observe(scroller);\n          Array.prototype.forEach.call(scroller.children, (child) => ro.observe(child));\n        }\n        // 兜底的兜底：个别嵌入式浏览器不投递 resize/RO 回调，面板可见期间周期自检（开销可忽略）\n        setInterval(() => {\n          if (scroller.clientWidth > 0) updateEdges();\n        }, 1500);\n\n        scroller.addEventListener('pointerdown', (e) => {\n          if (e.pointerType !== 'mouse' || e.button !== 0) return;\n          dragging = true;\n          moved = false;\n          startX = e.clientX;\n          startY = e.clientY;\n          startScroll = scroller.scrollLeft;\n        });\n\n        scroller.addEventListener('pointermove', (e) => {\n          if (!dragging) return;\n          const dx = e.clientX - startX;\n          const dy = e.clientY - startY;\n          if (!moved && Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)) {\n            moved = true;\n            scroller.classList.add('dragging');\n            try { scroller.setPointerCapture(e.pointerId); } catch (err) { /* 捕获失败不影响拖动 */ }\n          }\n          if (moved) {\n            e.preventDefault();\n            scroller.scrollLeft = startScroll - dx;\n          }\n        });\n\n        const endDrag = () => {\n          if (!dragging) return;\n          dragging = false;\n          if (moved) {\n            scroller.classList.remove('dragging');\n            // 吞掉拖动结束后的这一次 click，避免误触页签切换\n            const swallowClick = (ev) => {\n              ev.stopPropagation();\n              ev.preventDefault();\n            };\n            scroller.addEventListener('click', swallowClick, { capture: true, once: true });\n            setTimeout(() => scroller.removeEventListener('click', swallowClick, { capture: true }), 0);\n          }\n        };\n        scroller.addEventListener('pointerup', endDrag);\n        scroller.addEventListener('pointercancel', endDrag);\n        scroller.addEventListener('pointerleave', endDrag);\n\n        updateEdges();\n      }\n\n      function initSettingsPanel() {\n        const settingsBtn = document.getElementById('settings-btn');\n        const settingsClose = document.getElementById('settings-close');\n        const displayModeRadios = document.querySelectorAll('input[name=\"display-mode\"]');\n        const actionModeRadios = document.querySelectorAll('input[name=\"action-mode\"]');\n\n        if (settingsBtn) {\n          settingsBtn.addEventListener('click', () => mmsToggleSettingsView(true));\n        }\n        if (settingsClose) {\n          settingsClose.addEventListener('click', () => mmsToggleSettingsView(false));\n        }\n        Object.keys(MMS_SETTING_TAB_NAMES).forEach(k => {\n          const btn = document.getElementById('tab-btn-' + k);\n          if (btn) btn.addEventListener('click', () => mmsSwitchSettingTab(k));\n        });\n        // 页签栏横向拖动滚动（PC）；移动端保留原生滑动\n        initTabDragScroll();\n\n        document.addEventListener('keydown', e => {\n          if (e.key === 'Escape') {\n            const settingsView = document.getElementById('settings-panel');\n            if (settingsView && settingsView.style.display === 'block') {\n              mmsToggleSettingsView(false);\n            }\n          }\n        });\n\n        const savedDisplayMode = localStorage.getItem('displayMode') || 'status-only';\n        displayModeRadios.forEach(radio => {\n          if (radio.value === savedDisplayMode) {\n            radio.checked = true;\n          }\n          radio.addEventListener('change', () => {\n            if (radio.checked) {\n              updateDisplayMode(radio.value);\n              localStorage.setItem('displayMode', radio.value);\n            }\n          });\n        });\n\n        updateDisplayMode(savedDisplayMode);\n\n        const savedActionMode = localStorage.getItem('actionMode') || 'send-to-chat';\n        actionModeRadios.forEach(radio => {\n          if (radio.value === savedActionMode) {\n            radio.checked = true;\n          }\n          radio.addEventListener('change', () => {\n            if (radio.checked) {\n              localStorage.setItem('actionMode', radio.value);\n            }\n          });\n        });\n\n        // 徽章折叠字符数设置（+/- 调整后即时重算全部徽章）\n        const foldCharValueEl = document.getElementById('foldchar-value');\n        const foldMinusBtn = document.getElementById('foldchar-minus');\n        const foldPlusBtn = document.getElementById('foldchar-plus');\n        const syncFoldCharUI = () => {\n          const t = getBadgeFoldCharLimit();\n          if (foldCharValueEl) foldCharValueEl.textContent = String(t);\n          if (foldMinusBtn) foldMinusBtn.disabled = t <= 8;\n          if (foldPlusBtn) foldPlusBtn.disabled = t >= 200;\n        };\n        const setFoldCharLimit = (v) => {\n          const t = Math.max(8, Math.min(200, v));\n          localStorage.setItem('badgeFoldCharLimit', String(t));\n          syncFoldCharUI();\n          // 已展开的容器先复位再统一重算\n          document.querySelectorAll('.item-badge-container.expanded').forEach((c) => c.classList.remove('expanded'));\n          refreshExistingBadgeContainers();\n        };\n        if (foldMinusBtn) foldMinusBtn.addEventListener('click', () => setFoldCharLimit(getBadgeFoldCharLimit() - 2));\n        if (foldPlusBtn) foldPlusBtn.addEventListener('click', () => setFoldCharLimit(getBadgeFoldCharLimit() + 2));\n        syncFoldCharUI();\n      }\n\n      function updateDisplayMode(mode) {\n        const bodyElement = document.body;\n        bodyElement.classList.remove('status-only-mode');\n\n        if (mode === 'status-only') {\n          bodyElement.classList.add('status-only-mode');\n        }\n      }\n\n      // 主题圆点选择器（替换原主题网格）\n      const MMS_THEME_LABELS = {\n        romantic: '修仙风格',\n        day: '白天模式',\n        jade: '血色模式',\n        classic: '古典模式',\n        night: '黑夜模式',\n        fresh: '小清新风格',\n      };\n\n      function initThemeToggle() {\n        const themeDots = document.querySelectorAll('.theme-dot-btn');\n        const bodyElement = document.body;\n\n        const savedTheme = localStorage.getItem('storyTheme') || 'romantic';\n        switchToTheme(savedTheme);\n\n        themeDots.forEach(dot => {\n          dot.addEventListener('click', () => {\n            const theme = dot.getAttribute('data-theme');\n            switchToTheme(theme);\n            localStorage.setItem('storyTheme', theme);\n          });\n        });\n\n        function switchToTheme(theme) {\n          bodyElement.classList.remove(\n            'night-mode',\n            'day-mode',\n            'jade-mode',\n            'classic-mode',\n            'romantic-mode',\n            'fresh-mode',\n          );\n\n          bodyElement.classList.add(`${theme}-mode`);\n\n          themeDots.forEach(dot => {\n            if (dot.getAttribute('data-theme') === theme) {\n              dot.classList.add('active');\n            } else {\n              dot.classList.remove('active');\n            }\n          });\n          const nameEl = document.getElementById('mms-theme-name');\n          if (nameEl) nameEl.textContent = '当前：' + (MMS_THEME_LABELS[theme] || theme);\n        }\n      }\n\n      \n      // ==========================================\n      // 独立大地图：语义 JSON 渲染器（绘图 LLM 只输出地理+地标 JSON，视觉全部由本渲染器固定）\n      // ==========================================\n\n      // 当前楼层的大地图渲染状态（由 MMS.injectBigMapArt 在每次渲染前写入，createAttributeItem 读取）\n      let MMS_BIGMAP_ART_STATE = { enabled: false };\n\n      const MMS_MAPART_STYLES = {\n        flat: {\n          ground: { field: '#ece4c9', sea: '#9cc4dc' },\n          grass: '#d3e0ae', snow: '#edf2f5', forest: '#b6cc97', desert: '#ecd9a4',\n          fieldCrop: '#e6d49a', lake: '#a9d2e8', river: '#a9d2e8', riverEdge: '#82b3cf',\n          road: '#faf5e6', roadEdge: '#d9cba6', landStroke: '#bfb086', wall: '#a08e66',\n          wallInner: '#c9b992', tower: '#b3a179', towerEdge: '#8f7d5c',\n          stone: '#c6a97e', stoneEdge: '#a68c60', wood: '#c9a97a', woodEdge: '#8a6a42',\n          roof: '#a2705a', plaster: '#f4efe2', plasterEdge: '#b0a687',\n          houseFill: '#e3d5b2', houseEdge: '#c8b790', tree: '#a8c489', treeEdge: '#8ba76e',\n          crop: '#c9a852', water: '#a9d2e8', waterEdge: '#82b3cf', boat: '#b05a4a', boatEdge: '#8a4238',\n          label: '#8a7a58', font: \"'PingFang SC','Microsoft YaHei',sans-serif\",\n          strokeW: { road: 8, roadEdge: 20, river: 40, wall: 15, thin: 2 },\n        },\n        parchment: {\n          ground: { field: '#ecd9ae', sea: '#a8c4d4' },\n          grass: '#c6d3a0', snow: '#eef2f4', forest: '#9db07a', desert: '#e4cf9a',\n          fieldCrop: '#dfc98e', lake: '#a9c9dd', river: '#8fb5c9', riverEdge: '#6e93a6',\n          road: '#5f4a30', roadEdge: null, landStroke: '#3f3020', wall: '#6b533a',\n          wallInner: '#3f3020', tower: '#d8c298', towerEdge: '#4a3826',\n          stone: '#d9c294', stoneEdge: '#3f3020', wood: '#cfae7d', woodEdge: '#5f4630',\n          roof: '#a2705a', plaster: '#f2ead2', plasterEdge: '#4a3826',\n          houseFill: '#e2cda0', houseEdge: '#4a3826', tree: '#9db07a', treeEdge: '#5f7a4a',\n          crop: '#c9a852', water: '#a9c9dd', waterEdge: '#5f7a88', boat: '#8a4238', boatEdge: '#3f3020',\n          label: '#6b4326', font: \"'KaiTi','STKaiti','PingFang SC',serif\",\n          strokeW: { road: 1.6, roadEdge: 0, river: 36, wall: 5, thin: 2 },\n          roadDash: '11 9',\n        },\n      };\n\n      function mmsMapArtRoundRect(x, y, w, h, r) {\n        return (\n          'M ' + (x + r) + ' ' + y + ' h ' + (w - 2 * r) +\n          ' a ' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r +\n          ' v ' + (h - 2 * r) + ' a ' + r + ' ' + r + ' 0 0 1 ' + -r + ' ' + r +\n          ' h ' + -(w - 2 * r) + ' a ' + r + ' ' + r + ' 0 0 1 ' + -r + ' ' + -r +\n          ' v ' + -(h - 2 * r) + ' a ' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + -r + ' Z'\n        );\n      }\n\n      // 渲染器支持的地物类型白名单（同时用于提示词与 sanitize 校验，避免 LLM 编造类型导致静默空绘）\n      const MMS_MAPART_FEATURE_TYPES = [\n        'castle', 'church', 'opera', 'house', 'boathouse', 'boat', 'fountain', 'stall',\n        'farm', 'pavilion', 'city', 'fortress', 'gate', 'port', 'volcano',\n      ];\n      const MMS_MAPART_TERRAIN_TYPES = ['grass', 'snow', 'forest', 'desert', 'field', 'lake'];\n      const MMS_MAPART_DISTRICT_TYPES = ['royal', 'craft', 'garden', 'plaza', 'harbor'];\n\n      function mmsMapArtFeature(f, S, style) {\n        const x = f.at[0], y = f.at[1];\n        const w = f.size ? f.size[0] : 0, h = f.size ? f.size[1] : 0;\n        switch (f.type) {\n          case 'castle': {\n            const st = style === 'parchment' ? { fill: '#d9c294', edge: '#3f3020', sw: 2.5 } : { fill: '#c6a97e', edge: '#a68c60', sw: 2 };\n            let g = '';\n            g += '<polygon points=\"' + (x - 64) + ',' + (y - 68) + ' ' + (x - 51) + ',' + (y - 92) + ' ' + (x - 38) + ',' + (y - 68) + '\" fill=\"' + S.roof + '\" stroke=\"' + st.edge + '\" stroke-width=\"2\"/>';\n            g += '<polygon points=\"' + (x + 38) + ',' + (y - 68) + ' ' + (x + 51) + ',' + (y - 92) + ' ' + (x + 64) + ',' + (y - 68) + '\" fill=\"' + S.roof + '\" stroke=\"' + st.edge + '\" stroke-width=\"2\"/>';\n            g += '<polygon points=\"' + (x - 18) + ',' + (y - 82) + ' ' + x + ',' + (y - 110) + ' ' + (x + 18) + ',' + (y - 82) + '\" fill=\"' + S.roof + '\" stroke=\"' + st.edge + '\" stroke-width=\"2\"/>';\n            g += '<rect x=\"' + (x - 64) + '\" y=\"' + (y - 70) + '\" width=\"26\" height=\"66\" fill=\"' + st.fill + '\" stroke=\"' + st.edge + '\" stroke-width=\"' + st.sw + '\"/>';\n            g += '<rect x=\"' + (x + 38) + '\" y=\"' + (y - 70) + '\" width=\"26\" height=\"66\" fill=\"' + st.fill + '\" stroke=\"' + st.edge + '\" stroke-width=\"' + st.sw + '\"/>';\n            g += '<rect x=\"' + (x - 18) + '\" y=\"' + (y - 86) + '\" width=\"36\" height=\"46\" fill=\"' + st.fill + '\" stroke=\"' + st.edge + '\" stroke-width=\"' + st.sw + '\"/>';\n            g += '<polygon points=\"' + (x - 45) + ',' + (y - 43) + ' ' + (x + 45) + ',' + (y - 43) + ' ' + (x + 58) + ',' + (y + 30) + ' ' + (x - 58) + ',' + (y + 30) + '\" fill=\"' + st.fill + '\" stroke=\"' + st.edge + '\" stroke-width=\"' + st.sw + '\"/>';\n            return g;\n          }\n          case 'church': {\n            const edge = style === 'parchment' ? '#4a3826' : '#b0a687';\n            let g = '';\n            if (style === 'parchment') g += '<circle cx=\"' + x + '\" cy=\"' + y + '\" r=\"58\" fill=\"#eee0b8\" stroke=\"#5f4a30\" stroke-width=\"1.8\"/>';\n            else g += '<circle cx=\"' + x + '\" cy=\"' + y + '\" r=\"58\" fill=\"#f2ead3\" stroke=\"#d8c8a4\" stroke-width=\"2\"/>';\n            g += '<rect x=\"' + (x - 16) + '\" y=\"' + (y - 33) + '\" width=\"32\" height=\"66\" fill=\"' + S.plaster + '\" stroke=\"' + edge + '\" stroke-width=\"2\"/>';\n            g += '<rect x=\"' + (x - 32) + '\" y=\"' + (y - 17) + '\" width=\"64\" height=\"26\" fill=\"' + S.plaster + '\" stroke=\"' + edge + '\" stroke-width=\"2\"/>';\n            g += '<polygon points=\"' + (x - 16) + ',' + (y - 33) + ' ' + x + ',' + (y - 63) + ' ' + (x + 16) + ',' + (y - 33) + '\" fill=\"#d9c9a4\" stroke=\"' + edge + '\" stroke-width=\"2\"/>';\n            g += '<path d=\"M ' + x + ' ' + (y - 57) + ' v-12 M ' + (x - 5) + ' ' + (y - 64) + ' h10\" stroke=\"' + edge + '\" stroke-width=\"2\"/>';\n            return g;\n          }\n          case 'opera': {\n            const edge = style === 'parchment' ? '#4a3826' : '#8a90a0';\n            let g = '';\n            const shells = [[-30, 1.0], [0, 1.25], [30, 1.0]];\n            for (const s of shells) {\n              const dx = s[0], sc = s[1];\n              g += '<path d=\"M ' + (x + dx - 16) + ' ' + (y + 18) + ' C ' + (x + dx - 14) + ' ' + (y - 6 * sc) + ', ' + (x + dx - 4) + ' ' + (y - 20 * sc) + ', ' + (x + dx + 10) + ' ' + (y - 26 * sc) + ' C ' + (x + dx + 16) + ' ' + (y - 12 * sc) + ', ' + (x + dx + 18) + ' ' + (y + 4) + ', ' + (x + dx + 16) + ' ' + (y + 18) + ' Z\" fill=\"#f2f3f0\" stroke=\"' + edge + '\" stroke-width=\"2\"/>';\n            }\n            g += '<rect x=\"' + (x - 44) + '\" y=\"' + (y + 16) + '\" width=\"88\" height=\"10\" fill=\"' + (style === 'parchment' ? '#c9a06a' : '#b28a58') + '\" stroke=\"' + edge + '\" stroke-width=\"1.6\"/>';\n            return g;\n          }\n          case 'house':\n            return '<rect x=\"' + x + '\" y=\"' + y + '\" width=\"' + (w || 40) + '\" height=\"' + (h || 28) + '\" rx=\"3\" fill=\"' + (style === 'parchment' ? '#e2cda0' : '#d9c6a4') + '\" stroke=\"' + (style === 'parchment' ? '#4a3826' : '#bfa87e') + '\" stroke-width=\"2\"/>' +\n              '<rect x=\"' + (x + (w || 40) / 2 - 3) + '\" y=\"' + (y - 14) + '\" width=\"6\" height=\"16\" fill=\"' + (style === 'parchment' ? '#4a3826' : '#bfa87e') + '\"/>';\n          case 'boathouse':\n            return '<rect x=\"' + x + '\" y=\"' + y + '\" width=\"' + (w || 52) + '\" height=\"' + (h || 34) + '\" rx=\"3\" fill=\"' + S.wood + '\" stroke=\"' + S.woodEdge + '\" stroke-width=\"2\"/>';\n          case 'boat': {\n            const rx = f.small ? 15 : 22, ry = f.small ? 6 : 9;\n            return '<ellipse cx=\"' + x + '\" cy=\"' + y + '\" rx=\"' + rx + '\" ry=\"' + ry + '\" fill=\"' + S.boat + '\" stroke=\"' + S.boatEdge + '\" stroke-width=\"1.5\"/>';\n          }\n          case 'fountain':\n            return '<circle cx=\"' + x + '\" cy=\"' + y + '\" r=\"15\" fill=\"' + S.water + '\" stroke=\"' + S.waterEdge + '\" stroke-width=\"2\"/>' +\n              '<path d=\"M ' + (x - 12) + ' ' + y + ' h24 M ' + x + ' ' + (y - 12) + ' v24\" stroke=\"' + S.waterEdge + '\" stroke-width=\"1.4\"/>';\n          case 'stall':\n            return '<rect x=\"' + x + '\" y=\"' + y + '\" width=\"20\" height=\"12\" rx=\"2\" fill=\"' + S.wood + '\" stroke=\"' + S.woodEdge + '\" stroke-width=\"1.6\"/>';\n          case 'farm': {\n            const rows = f.rows || 1;\n            const cw = w || 80, ch = h || 32;\n            let g = '<rect x=\"' + x + '\" y=\"' + y + '\" width=\"' + cw + '\" height=\"' + ch + '\" fill=\"' + (style === 'parchment' ? '#dfc98e' : '#d9c98f') + '\" stroke=\"' + (style === 'parchment' ? '#a8865a' : '#b8a86f') + '\" stroke-width=\"1.4\"/>';\n            const n = Math.floor(cw / 14);\n            for (let i = 0; i < n; i++) {\n              for (let r = 0; r < rows; r++) {\n                g += '<path d=\"M ' + (x + 8 + i * 14) + ' ' + (y + 4 + r * 22) + ' v10\" stroke=\"' + S.crop + '\" stroke-width=\"2\" stroke-linecap=\"round\"/>';\n              }\n            }\n            return g;\n          }\n          case 'pavilion':\n            return '<polygon points=\"' + (x - 12) + ',' + (y + 14) + ' ' + x + ',' + (y - 10) + ' ' + (x + 12) + ',' + (y + 14) + '\" fill=\"#e3d5b2\" stroke=\"#b0a687\" stroke-width=\"1.6\"/>';\n          case 'city': {\n            const edge = '#8f7d5c';\n            let g = '<circle cx=\"' + x + '\" cy=\"' + y + '\" r=\"34\" fill=\"#d8c8a0\" stroke=\"' + edge + '\" stroke-width=\"3\"/>';\n            g += '<rect x=\"' + (x - 14) + '\" y=\"' + (y - 14) + '\" width=\"28\" height=\"28\" fill=\"#c9b287\" stroke=\"' + edge + '\" stroke-width=\"2\"/>';\n            g += '<rect x=\"' + (x - 38) + '\" y=\"' + (y + 16) + '\" width=\"16\" height=\"12\" fill=\"#d2b78d\" stroke=\"' + edge + '\"/>';\n            g += '<rect x=\"' + (x + 20) + '\" y=\"' + (y + 16) + '\" width=\"16\" height=\"12\" fill=\"#d2b78d\" stroke=\"' + edge + '\"/>';\n            g += '<rect x=\"' + (x - 10) + '\" y=\"' + (y + 30) + '\" width=\"16\" height=\"12\" fill=\"#d2b78d\" stroke=\"' + edge + '\"/>';\n            return g;\n          }\n          case 'fortress': {\n            const edge = '#6b5a3e';\n            let g = '<rect x=\"' + (x - 18) + '\" y=\"' + (y - 18) + '\" width=\"36\" height=\"36\" fill=\"#cbb68c\" stroke=\"' + edge + '\" stroke-width=\"3\"/>';\n            const corners = [[-18, -18], [18, -18], [-18, 18], [18, 18]];\n            for (const c of corners) g += '<circle cx=\"' + (x + c[0]) + '\" cy=\"' + (y + c[1]) + '\" r=\"4.5\" fill=\"' + edge + '\"/>';\n            g += '<path d=\"M ' + x + ' ' + (y - 18) + ' v-14 h12\" fill=\"none\" stroke=\"' + edge + '\" stroke-width=\"2.4\"/>';\n            return g;\n          }\n          case 'gate':\n            return '<rect x=\"' + (x - 22) + '\" y=\"' + (y - 9) + '\" width=\"14\" height=\"32\" fill=\"#c9b68c\" stroke=\"#8a7a58\" stroke-width=\"2\"/>' +\n              '<rect x=\"' + (x + 8) + '\" y=\"' + (y - 9) + '\" width=\"14\" height=\"32\" fill=\"#c9b68c\" stroke=\"#8a7a58\" stroke-width=\"2\"/>';\n          case 'port': {\n            let g = '<rect x=\"' + (x - 8) + '\" y=\"' + (y - 20) + '\" width=\"16\" height=\"40\" fill=\"#c9a97a\" stroke=\"#8a6a42\" stroke-width=\"2\" transform=\"rotate(-14 ' + x + ' ' + y + ')\"/>';\n            g += '<rect x=\"' + (x - 16) + '\" y=\"' + (y - 44) + '\" width=\"20\" height=\"14\" fill=\"' + S.wood + '\" stroke=\"' + S.woodEdge + '\" stroke-width=\"2\"/>';\n            g += '<rect x=\"' + (x + 8) + '\" y=\"' + (y - 48) + '\" width=\"20\" height=\"14\" fill=\"' + S.wood + '\" stroke=\"' + S.woodEdge + '\" stroke-width=\"2\"/>';\n            return g;\n          }\n          case 'volcano': {\n            let g = '<polygon points=\"' + (x - 32) + ',' + (y + 85) + ' ' + x + ',' + (y - 2) + ' ' + (x + 32) + ',' + (y + 85) + '\" fill=\"#c07a5a\" stroke=\"#9a5a40\" stroke-width=\"2\"/>';\n            g += '<ellipse cx=\"' + x + '\" cy=\"' + (y - 2) + '\" rx=\"17\" ry=\"6\" fill=\"#6e3a28\"/>';\n            g += '<path d=\"M ' + (x - 4) + ' ' + (y + 12) + ' L ' + (x + 2) + ' ' + (y + 42) + ' L ' + (x - 6) + ' ' + (y + 70) + '\" fill=\"none\" stroke=\"#a34a30\" stroke-width=\"3\" stroke-linecap=\"round\"/>';\n            return g;\n          }\n          default:\n            return '';\n        }\n      }\n\n      function mmsMapArtCompass(S, style) {\n        if (style === 'parchment') {\n          return '<g transform=\"translate(858,146)\">' +\n            '<circle r=\"24\" fill=\"#f2e6c4\" stroke=\"#6b4f30\" stroke-width=\"2\"/>' +\n            '<polygon points=\"0,-18 6,4 0,0 -6,4\" fill=\"#8a3a2a\"/>' +\n            '<polygon points=\"0,18 6,-4 0,0 -6,-4\" fill=\"#6b4f30\"/>' +\n            '<text y=\"-28\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b3a24\" font-family=\"' + S.font + '\">N<\/text><\/g>';\n        }\n        return '<g><circle cx=\"912\" cy=\"112\" r=\"26\" fill=\"#f4f7f9\" stroke=\"#7a8ea0\" stroke-width=\"2\"/>' +\n          '<polygon points=\"912,90 918,112 906,112\" fill=\"#b05a4a\"/>' +\n          '<polygon points=\"912,134 918,112 906,112\" fill=\"#7a8ea0\"/>' +\n          '<text x=\"912\" y=\"84\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5d788c\" font-family=\"' + S.font + '\">N<\/text><\/g>';\n      }\n\n      function mmsMapArtScaleBar(S, style) {\n        if (style !== 'parchment') return '';\n        return '<g stroke=\"#5b3a24\" stroke-width=\"2\">' +\n          '<path d=\"M 110 942 h150 M 110 936 v12 M 185 938 v8 M 260 936 v12\"/>' +\n          '<text x=\"110\" y=\"930\" font-size=\"13\" fill=\"#5b3a24\" stroke=\"none\" font-family=\"' + S.font + '\">0<\/text>' +\n          '<text x=\"248\" y=\"930\" font-size=\"13\" fill=\"#5b3a24\" stroke=\"none\" font-family=\"' + S.font + '\">500步<\/text><\/g>';\n      }\n\n      // 语义 JSON → SVG 字符串（flat=简约平面 / parchment=手绘羊皮纸）\n      function mmsRenderMapArt(json, styleName) {\n        const S = MMS_MAPART_STYLES[styleName] || MMS_MAPART_STYLES.flat;\n        const style = styleName === 'parchment' ? 'parchment' : 'flat';\n        const parts = [];\n        const P = (s) => parts.push(s);\n\n        let defs = '';\n        if (style === 'parchment') {\n          defs = '<defs>' +\n            '<filter id=\"mms-map-pn\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.8\" numOctaves=\"2\" seed=\"7\" result=\"n\"/>' +\n            '<feColorMatrix in=\"n\" type=\"matrix\" values=\"0 0 0 0 0.38  0 0 0 0 0.27  0 0 0 0 0.13  0 0 0 0.55 0\"/>' +\n            '<feComposite operator=\"in\" in2=\"SourceGraphic\"/><\/filter>' +\n            '<radialGradient id=\"mms-map-vig\" cx=\"50%\" cy=\"50%\" r=\"74%\"><stop offset=\"58%\" stop-color=\"rgba(0,0,0,0)\"/><stop offset=\"100%\" stop-color=\"rgba(90,60,30,0.32)\"/><\/r          const edge = style === 'parchment' ? '#5f4a30' : (d.type === 'plaza' ? '#d8c8a4' : null);\n          const sw = style === 'parchment' ? 1.8 : 2;\n          if (d.shape === 'ellipse' && d.at && d.r) {\n            P('<ellipse cx=\"' + d.at[0] + '\" cy=\"' + d.at[1] + '\" rx=\"' + d.r[0] + '\" ry=\"' + d.r[1] + '\" fill=\"' + fill + '\"' + (d.type === 'royal' && style !== 'parchment' ? ' opacity=\"0.75\"' : '') + (edge ? ' stroke=\"' + edge + '\" stroke-width=\"' + sw + '\"' : '') + '/>');\n          } else if (d.at) {\n            P('<rect x=\"' + d.at[0] + '\" y=\"' + d.at[1] + '\" width=\"' + (d.size ? d.size[0] : 100) + '\" height=\"' + (d.size ? d.size[1] : 70) + '\" rx=\"' + (d.r || 0) + '\" fill=\"' + fill + '\"' + (edge ? ' stroke=\"' + edge + '\" stroke-width=\"' + sw + '\"' : '') + '/>');\n          }\n        }\n\n        // 河流\n        if (json.river) {\n          const w = S.strokeW.river;\n          if (style === 'parchment') {\n            P('<path d=\"' + json.river + '\" fill=\"none\" stroke=\"' + S.river + '\" stroke-width=\"' + w + '\" opacity=\"0.85\" stroke-linecap=\"round\"/>');\n            P('<path d=\"' + json.river + '\" fill=\"none\" stroke=\"' + S.riverEdge + '\" stroke-width=\"2\" stroke-dasharray=\"18 14\"/>');\n          } else {\n            P('<path d=\"' + json.river + '\" fill=\"none\" stroke=\"' + S.riverEdge + '\" stroke-width=\"' + (w + 10) + '\" stroke-linecap=\"round\"/>');\n            P('<path d=\"' + json.river + '\" fill=\"none\" stroke=\"' + S.river + '\" stroke-width=\"' + w + '\" stroke-linecap=\"round\"/>');\n          }\n        }\n\n        // 道路\n        if ((json.roads || []).length) {\n          if (style === 'parchment') {\n            P('<g fill=\"none\" stroke=\"' + S.road + '\" stroke-width=\"1.6\" stroke-dasharray=\"' + (S.roadDash || '11 9') + '\">' +\n              json.roads.map((d) => '<path d=\"' + d + '\"/>').join('') + '<\/g>');\n          } else {\n            P('<g fill=\"none\" stroke=\"' + S.roadEdge + '\" stroke-width=\"' + S.strokeW.roadEdge + '\" stroke-linecap=\"round\">' +\n              json.roads.map((d) => '<path d=\"' + d + '\"/>').join('') + '<\/g>');\n            P('<g fill=\"none\" stroke=\"' + S.road + '\" stroke-width=\"' + S.strokeW.road + '\" stroke-linecap=\"round\">' +\n              json.roads.map((d) => '<path d=\"' + d + '\"/>').join('') + '<\/g>');\n          }\n        }\n\n        // 桥梁\n        for (const b of json.bridges || []) {\n          if (!b.at) continue;\n          const bw = b.size ? b.size[0] : 50, bh = b.size ? b.size[1] : 26;\n          P('<rect x=\"' + b.at[0] + '\" y=\"' + b.at[1] + '\" width=\"' + bw + '\" height=\"' + bh + '\" rx=\"4\" fill=\"' + (style === 'parchment' ? '#c9a06a' : '#b28a58') + '\" stroke=\"' + (style === 'parchment' ? '#5f4630' : '#8a6a42') + '\" stroke-width=\"2\"/>');\n          P('<path d=\"' + [0, 1, 2].map((i) => 'M ' + (b.at[0] + 12 + i * 12) + ' ' + (b.at[1] + 1) + ' v' + (bh - 2)).join(' ') + '\" stroke=\"' + (style === 'parchment' ? '#5f4630' : '#8a6a42') + '\" stroke-width=\"1.4\"/>');\n        }\n\n        // 山脉\n        if (json.ridge && json.ridge.from && json.ridge.to) {\n          const x0 = json.ridge.from[0], y0 = json.ridge.from[1], x1 = json.ridge.to[0], y1 = json.ridge.to[1];\n          const n = json.ridge.peaks || 5;\n          let g = '';\n          for (let i = 0; i < n; i++) {\n            const t = n === 1 ? 0 : i / (n - 1);\n            const cx = x0 + (x1 - x0) * t, cy = y0 + (y1 - y0) * t;\n            const s = 60 - t * 18;\n            g += '<polygon points=\"' + (cx - 30) + ',' + (cy + s * 0.55) + ' ' + cx + ',' + (cy - s * 0.55) + ' ' + (cx + 30) + ',' + (cy + s * 0.55) + '\" fill=\"' + (style === 'parchment' ? '#c4b494' : '#bfae8e') + '\" stroke=\"' + (style === 'parchment' ? '#6b5a3e' : '#99875f') + '\" stroke-width=\"2\"/>';\n            g += '<polygon points=\"' + (cx - 8) + ',' + (cy - s * 0.18) + ' ' + cx + ',' + (cy - s * 0.55) + ' ' + (cx + 8) + ',' + (cy - s * 0.18) + '\" fill=\"#f6f6f0\"/>';\n          }\n          P(g);\n        }\n\n        // 城墙 / 大陆轮廓\n        const o = json.outline;\n        if (o) {\n          let dAttr;\n          if (o.shape === 'roundRect' && o.at && o.size) dAttr = mmsMapArtRoundRect(o.at[0], o.at[1], o.size[0], o.size[1], o.r || 30);\n          else dAttr = o.d;\n          if (dAttr) {\n            if (o.land) {\n              P('<path d=\"' + dAttr + '\" fill=\"' + (json.ground === 'sea' ? '#ddd0a9' : 'none') + '\" stroke=\"' + S.landStroke + '\" stroke-width=\"4\"/>');\n            } else {\n              P('<path d=\"' + dAttr + '\" fill=\"none\" stroke=\"' + S.wall + '\" stroke-width=\"' + S.strokeW.wall + '\"/>');\n              if (style !== 'parchment' && o.shape === 'roundRect') {\n                P('<path d=\"' + mmsMapArtRoundRect(o.at[0] + 13, o.at[1] + 13, o.size[0] - 26, o.size[1] - 26, Math.max(4, (o.r || 30) - 8)) + '\" fill=\"none\" stroke=\"' + S.wallInner + '\" stroke-width=\"3\"/>');\n              }\n            }\n          }\n        }\n        for (const b of json.bays || []) {\n          P('<path d=\"' + b + '\" fill=\"' + S.ground.sea + '\"/>');\n          P('<path d=\"' + b + '\" fill=\"none\" stroke=\"' + S.landStroke + '\" stroke-width=\"3\"/>');\n        }\n\n        // 塔楼 / 城门\n        for (const t of json.towers || []) {\n          P('<circle cx=\"' + t[0] + '\" cy=\"' + t[1] + '\" r=\"12\" fill=\"' + S.tower + '\" stroke=\"' + S.towerEdge + '\" stroke-width=\"2\"/>');\n        }\n        for (const g of json.gates || []) {\n          const x = g[0], y = g[1];\n          P('<rect x=\"' + (x - 22) + '\" y=\"' + (y - 12) + '\" width=\"44\" height=\"36\" fill=\"#f0e8d0\"/>');\n          P('<rect x=\"' + (x - 40) + '\" y=\"' + (y - 18) + '\" width=\"16\" height=\"34\" rx=\"3\" fill=\"' + S.towerEdge + '\"/>');\n          P('<rect x=\"' + (x + 24) + '\" y=\"' + (y - 18) + '\" width=\"16\" height=\"34\" rx=\"3\" fill=\"' + S.towerEdge + '\"/>');\n          P('<path d=\"M ' + (x - 16) + ' ' + (y + 20) + ' Q ' + x + ' ' + (y - 2) + ' ' + (x + 16) + ' ' + (y + 20) + '\" fill=\"none\" stroke=\"' + (style === 'parchment' ? '#3f3020' : '#6b5a3e') + '\" stroke-width=\"3\"/>');\n        }\n\n        // 批量民居 / 树木\n        if ((json.houses || []).length) {\n          P('<g fill=\"' + S.houseFill + '\" stroke=\"' + S.houseEdge + '\" stroke-width=\"1.5\">' +\n            json.houses.map((hh) => '<rect x=\"' + hh[0] + '\" y=\"' + hh[1] + '\" width=\"26\" height=\"18\" rx=\"2\"/>').join('') + '<\/g>');\n        }\n        if ((json.trees || []).length) {\n          P('<g fill=\"' + S.tree + '\" stroke=\"' + S.treeEdge + '\" stroke-width=\"1.5\">' +\n            json.trees.map((tt) => '<circle cx=\"' + tt[0] + '\" cy=\"' + tt[1] + '\" r=\"' + (style === 'parchment' ? 10 : 13) + '\"/>').join('') + '<\/g>');\n        }\n\n        // 特色建筑\n        for (const f of json.features || []) {\n          if (f && f.at) P(mmsMapArtFeature(f, S, style));\n        }\n\n        // 文字标签\n        if ((json.labels || []).length) {\n          P('<g fill=\"' + S.label + '\" font-size=\"17\" opacity=\"0.85\" text-anchor=\"middle\" font-family=\"' + S.font + '\">' +\n            json.labels.map((l) => '<text x=\"' + l.at[0] + '\" y=\"' + l.at[1] + '\">' + l.text + '<\/text>').join('') + '<\/g>');\n        }\n\n        // 装饰（罗盘/比例尺）\n        P(mmsMapArtCompass(S, style));\n        P(mmsMapArtScaleBar(S, style));\n\n        return '<svg viewBox=\"0 0 1000 1000\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid slice\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block\" font-family=\"' + S.font + '\">' + defs + '\\n' + parts.join('\\n') + '\\n<\/svg>';\n      }\n\n      // ==========================================\n      // MMS 移动版模块：地图管理 + 独立大地图（AI 绘制）+ 绘图 API 配置\n      // （自最新版移植；状态数据仍从正文 Status_block 直读，不移植独立更新引擎）\n      // ==========================================\n      const MMS_EVENT_MAPART = 'mms:map-art-updated';\n      const MMS_COORD_MIN = 10;\n      const MMS_COORD_MAX = 90;\n\n      // 强清洗：去emoji、空白、标点、转小写（用于键匹配；大地图地标去重依赖）\n      function mmsNormalizeName(name) {\n        return mmsPlainName(name)\n          .replace(/[\\[\\]()（）{}<>《》·•\\-—―:：,，.。!！?？'\"'\"]/g, '')\n          .toLowerCase();\n      }\n\n      // ---------- 地图标签池（SVG 场景 + BACKGROUND_MAP 外链图片，互斥三栏：pool/mini/big） ----------\n      // 全部可用地图标签：type=svg（TacticalMapEngine 环境识别）为固定清单；\n      // type=image 的标签由 BACKGROUND_MAP 的键动态派生——图片管理页签增删底图后标签池自动同步\n      const MMS_SVG_MAP_TAGS = [\n        { name: '昏暗室内', type: 'svg' },\n        { name: '明亮室内', type: 'svg' },\n        { name: '警局', type: 'svg' },\n        { name: '街道', type: 'svg' },\n        { name: '商场', type: 'svg' },\n        { name: '健身房', type: 'svg' },\n        { name: '废墟', type: 'svg' },\n        { name: '荒野', type: 'svg' },\n        { name: '地下', type: 'svg' },\n        { name: '海边', type: 'svg' },\n        { name: '雪地', type: 'svg' },\n        { name: '沙漠', type: 'svg' },\n        { name: '火山', type: 'svg' },\n        { name: '餐厅', type: 'svg' },\n        { name: '酒吧', type: 'svg' },\n        { name: '茶馆', type: 'svg' },\n        { name: '神殿', type: 'svg' },\n        { name: '夜市', type: 'svg' },\n        { name: '广场', type: 'svg' },\n        { name: '操场', type: 'svg' },\n        { name: '教室', type: 'svg' },\n        { name: '医院', type: 'svg' },\n        { name: '洞窟', type: 'svg' },\n        { name: '坊市', type: 'svg' },\n        { name: '小店', type: 'svg' },\n        { name: '客栈', type: 'svg' },\n        { name: '藏经阁', type: 'svg' },\n        { name: '丹房', type: 'svg' },\n        { name: '药园', type: 'svg' },\n        { name: '洞府', type: 'svg' },\n        { name: '论剑台', type: 'svg' },\n      ];\n      const MMS_ALL_MAP_TAGS = MMS_SVG_MAP_TAGS.concat(\n        Object.keys(BACKGROUND_MAP).map((n) => ({ name: n, type: 'image' }))\n      );\n      // 图片管理页签增删底图后重建标签池（原位修改数组，保持既有引用有效）\n      function mmsRebuildMapTags() {\n        MMS_ALL_MAP_TAGS.length = 0;\n        MMS_SVG_MAP_TAGS.forEach((t) => MMS_ALL_MAP_TAGS.push(t));\n        Object.keys(BACKGROUND_MAP).forEach((n) => {\n          if (!MMS_ALL_MAP_TAGS.some((t) => t.name === n)) MMS_ALL_MAP_TAGS.push({ name: n, type: 'image' });\n        });\n        MMS_ALL_TAG_NAMES.length = 0;\n        MMS_ALL_MAP_TAGS.forEach((t) => MMS_ALL_TAG_NAMES.push(t.name));\n        if (window.MMS && window.MMS.renderMapTags) window.MMS.renderMapTags();\n      }\n      // 小地图默认标签（与桌面版默认白名单一致）\n      const MMS_MINI_DEFAULT_TAGS = MMS_ALL_MAP_TAGS.slice(0, 18).map((t) => t.name);\n      const MMS_ALL_TAG_NAMES = MMS_ALL_MAP_TAGS.map((t) => t.name);\n\n      function mmsGetMapTags(roster) {\n        const mt = roster && roster.mapTags;\n        const raw = mt && typeof mt === 'object' ? mt : { mini: MMS_MINI_DEFAULT_TAGS.slice(), big: [], pool: [] };\n        const norm = (arr) => (Array.isArray(arr) ? arr.filter((n) => MMS_ALL_TAG_NAMES.includes(n)) : []);\n        const mini = norm(raw.mini);\n        const big = norm(raw.big).filter((n) => !mini.includes(n));\n        const used = new Set([...mini, ...big]);\n        const pool = norm(raw.pool).filter((n) => !used.has(n));\n        // 全量兜底：任何未归档标签进池\n        for (const n of MMS_ALL_TAG_NAMES) {\n          if (!used.has(n) && !pool.includes(n)) pool.push(n);\n        }\n        return { pool, mini, big };\n      }\n\n      // 剪贴板写入（iframe/嵌入式环境剪贴板 API 可能因权限挂起，超时走 execCommand 降级）\n      async function mmsCopyText(text) {\n        try {\n          const write = navigator.clipboard && navigator.clipboard.writeText\n            ? navigator.clipboard.writeText(text)\n            : Promise.reject(new Error('no clipboard api'));\n          await Promise.race([write, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 1500))]);\n          return true;\n        } catch (e) {\n          try {\n            const ta = document.createElement('textarea');\n            ta.value = text;\n            ta.style.position = 'fixed';\n            ta.style.opacity = '0';\n            document.body.appendChild(ta);\n            ta.select();\n            const ok = document.execCommand('copy');\n            document.body.removeChild(ta);\n            return ok;\n          } catch (e2) {\n            return false;\n          }\n        }\n      }\n\n      window.MMS = {\n        floorId: null,\n        messageText: '',\n        mapArt: null,\n        mapArtPrev: null,\n        mapArtBusy: false,\n        lastState: null,\n        mapTagsSelection: new Set(),\n\n        hasVarsApi() {\n          return typeof getVariables === 'function' && typeof insertOrAssignVariables === 'function';\n        },\n        hasGenApi() {\n          return typeof generateRaw === 'function';\n        },\n\n        // ---------- 精简名册存储（$mms_roster 仅读写 maps/mapTags/bigmapArt 三组键，\n        // 保留桌面版可能写入的其它键，两版共用同一聊天不互相覆盖） ----------\n        loadRoster() {\n          const fallback = {\n            maps: { minimap: true, bigmap: false },\n            mapTags: { pool: [], mini: MMS_MINI_DEFAULT_TAGS.slice(), big: [] },\n            bigmapArt: { enabled: false, note: '', style: 'flat' },\n          };\n          try {\n            if (!this.hasVarsApi()) return fallback;\n            const chatVars = getVariables({ type: 'chat' }) || {};\n            const r = chatVars && chatVars.$mms_roster;\n            if (!r || typeof r !== 'object') return fallback;\n            const maps =\n              r.maps && typeof r.maps === 'object'\n                ? { minimap: r.maps.minimap !== false, bigmap: !!r.maps.bigmap }\n                : fallback.maps;\n            const bigmapArt =\n              r.bigmapArt && typeof r.bigmapArt === 'object'\n                ? {\n                    enabled: !!r.bigmapArt.enabled,\n                    note: String(r.bigmapArt.note || ''),\n                    style: r.bigmapArt.style === 'parchment' ? 'parchment' : 'flat',\n                  }\n                : fallback.bigmapArt;\n            return { maps: maps, mapTags: mmsGetMapTags(r), bigmapArt: bigmapArt };\n          } catch (e) {\n            console.warn('[MMS] 读取地图配置失败:', e);\n            return fallback;\n          }\n        },\n\n        saveRoster(roster) {\n          try {\n            if (!this.hasVarsApi()) return;\n            const chatVars = getVariables({ type: 'chat' }) || {};\n            const prev = chatVars && chatVars.$mms_roster && typeof chatVars.$mms_roster === 'object' ? chatVars.$mms_roster : {};\n            const next = Object.assign({}, prev, {\n              maps: roster.maps || { minimap: true, bigmap: false },\n              mapTags: roster.mapTags || { pool: [], mini: MMS_MINI_DEFAULT_TAGS.slice(), big: [] },\n              bigmapArt: roster.bigmapArt || { enabled: false, note: '', style: 'flat' },\n            });\n            if (typeof replaceVariables === 'function') {\n              replaceVariables(Object.assign({}, chatVars, { $mms_roster: next }), { type: 'chat' });\n            } else {\n              insertOrAssignVariables({ $mms_roster: next }, { type: 'chat' });\n            }\n          } catch (e) {\n            console.warn('[MMS] 保存地图配置失败:', e);\n          }\n        },\n\n        // ---------- 绘图 API 配置 ----------\n        // 读取仅合并本模块关心的 API 字段；写入走 syncActiveApiToConfig（原位保留 $mms_config 其它键）\n        loadConfig() {\n          const defaults = {\n            apiUrl: '',\n            apiKey: '',\n            model: '',\n            source: 'custom',\n            preset: '',\n            contextFloors: 2,\n            temperature: 0.3,\n            maxTokens: 4096,\n            topP: '',\n          };\n          try {\n            if (!this.hasVarsApi()) return defaults;\n            const g = getVariables({ type: 'global' }) || {};\n            const cfg = g && typeof g.$mms_config === 'object' ? g.$mms_config : {};\n            return Object.assign({}, defaults, cfg);\n          } catch (e) {\n            return defaults;\n          }\n        },\n\n        // ---------- API 预设（下拉栏，含锁定的默认连接） ----------\n        loadApiPresets() {\n          const fallback = {\n            active: 'default',\n            presets: [\n              {\n                id: 'default',\n                name: '默认（当前酒馆连接）',\n                config: {},\n                locked: true,\n              },\n            ],\n          };\n          try {\n            if (!this.hasVarsApi()) return fallback;\n            const g = getVariables({ type: 'global' }) || {};\n            const p = g && g.$mms_api_presets;\n            if (!p || typeof p !== 'object' || !Array.isArray(p.presets)) return fallback;\n            const presets = p.presets.filter(Boolean);\n            if (!presets.some((x) => x.id === 'default')) {\n              presets.unshift({ id: 'default', name: '默认（当前酒馆连接）', config: {}, locked: true });\n            }\n            return { active: p.active || 'default', presets };\n          } catch (e) {\n            return fallback;\n          }\n        },\n\n        saveApiPresets(data) {\n          try {\n            if (!this.hasVarsApi()) return;\n            insertOrAssignVariables({ $mms_api_presets: data }, { type: 'global' });\n          } catch (e) {\n            console.error('[MMS] 保存API预设失败:', e);\n          }\n        },\n\n        // 当前预设配置同步到 $mms_config（原位保留其它键，只覆盖 API 字段）\n        syncActiveApiToConfig(data) {\n          const preset = data.presets.find((p) => p.id === data.active) || data.presets[0];\n          if (!preset) return;\n          try {\n            if (!this.hasVarsApi()) return;\n            const g = getVariables({ type: 'global' }) || {};\n            const cur = g && typeof g.$mms_config === 'object' ? g.$mms_config : {};\n            insertOrAssignVariables(\n              { $mms_config: Object.assign({}, cur, preset.config || {}) },\n              { type: 'global' },\n            );\n          } catch (e) { /* 静默降级 */ }\n        },\n\n        buildCustomApi(cfg) {\n          const api = {};\n          if (cfg.preset && cfg.preset.trim()) api.proxy_preset = cfg.preset.trim();\n          if (cfg.apiUrl && cfg.apiUrl.trim()) {\n            api.apiurl = cfg.apiUrl.trim();\n            if (cfg.apiKey) api.key = cfg.apiKey;\n            api.source = cfg.source || 'custom';\n          }\n          if (cfg.model && cfg.model.trim()) api.model = cfg.model.trim();\n          api.temperature = typeof cfg.temperature === 'number' ? cfg.temperature : 0.3;\n          api.max_tokens = cfg.maxTokens || 4096;\n          if (typeof cfg.topP === 'number' && cfg.topP > 0 && cfg.topP <= 1) api.top_p = cfg.topP;\n          return api;\n        },\n\n        // 拉取模型列表：走酒馆服务端代理 /api/backends/chat-completions/status（同源免 CORS，\n        // 请求头由酒馆注入 CSRF）。结果填入真实 <select>（datalist 在手机 WebView 下不可靠）\n        async fetchModels() {\n          const urlEl = document.getElementById('mms-api-url');\n          const keyEl = document.getElementById('mms-api-key');\n          const btn = document.getElementById('mms-fetch-models');\n          const modelEl = document.getElementById('mms-api-model');\n          const selectEl = document.getElementById('mms-model-select');\n          if (!urlEl || !keyEl || !btn || !modelEl || !selectEl) return;\n          const url = (urlEl.value || '').trim();\n          const key = (keyEl.value || '').trim();\n          if (!url) {\n            alert('请先填写 API 地址（留空使用当前酒馆连接时，模型由酒馆管理，无法拉取列表）');\n            return;\n          }\n          let headers = null;\n          try {\n            const pw = typeof window.parent !== 'undefined' ? window.parent : null;\n            const ST = pw && pw.SillyTavern;\n            const ctx = ST && typeof ST.getContext === 'function' ? ST.getContext() : null;\n            if (ctx && typeof ctx.getRequestHeaders === 'function') {\n              headers = Object.assign({ 'Content-Type': 'application/json' }, ctx.getRequestHeaders());\n            }\n          } catch (e) { /* 直通通道不可用，走下方报错 */ }\n          if (!headers) {\n            alert('无法获取酒馆请求头（当前环境不支持直通 SillyTavern），拉取失败');\n            return;\n          }\n          const original = btn.innerHTML;\n          btn.disabled = true;\n          btn.innerHTML = '<i class=\"fa fa-spinner fa-spin\"><\/i>';\n          try {\n            const resp = await fetch('/api/backends/chat-completions/status', {\n              method: 'POST',\n              headers,\n              body: JSON.stringify({\n                reverse_proxy: url,\n                proxy_password: '',\n                chat_completion_source: 'custom',\n                custom_url: url,\n                custom_include_headers: key ? 'Authorization: Bearer ' + key : '',\n              }),\n            });\n            if (!resp.ok) throw new Error('HTTP ' + resp.status);\n            const data = await resp.json();\n            // 兼容三种返回：酒馆 status 端点 {models:[...]} / OpenAI 规范 {data:[{id}]} / 裸数组\n            const raw = data && data.models ? data.models : data && data.data ? data.data : Array.isArray(data) ? data : [];\n            const models = raw\n              .map((m) => (typeof m === 'string' ? m : m && m.id ? m.id : null))\n              .filter((m) => typeof m === 'string' && m.trim());\n            if (!models.length) throw new Error('未能解析模型数据');\n            const current = (modelEl.value || '').trim();\n            selectEl.innerHTML = '';\n            const placeholder = document.createElement('option');\n            placeholder.value = '';\n            placeholder.textContent = '已拉取 ' + models.length + ' 个模型，点击选择…';\n            selectEl.appendChild(placeholder);\n            let hit = false;\n            for (const m of models) {\n              const opt = document.createElement('option');\n              opt.value = m;\n              opt.textContent = m;\n              if (m === current) hit = true;\n              selectEl.appendChild(opt);\n            }\n            selectEl.value = hit ? current : '';\n            selectEl.style.display = 'block';\n            alert
