roof + '\" stroke=\"' + st.edge + '\" stroke-width=\"2\"/>';\n            g += '<polygon points=\"' + (x - 18) + ',' + (y - 82) + ' ' + x + ',' + (y - 110) + ' ' + (x + 18) + ',' + (y - 82) + '\" fill=\"' + S.roof + '\" stroke=\"' + st.edge + '\" stroke-width=\"2\"/>';\n            g += '<rect x=\"' + (x - 64) + '\" y=\"' + (y - 70) + '\" width=\"26\" height=\"66\" fill=\"' + st.fill + '\" stroke=\"' + st.edge + '\" stroke-width=\"' + st.sw + '\"/>';\n            g += '<rect x=\"' + (x + 38) + '\" y=\"' + (y - 70) + '\" width=\"26\" height=\"66\" fill=\"' + st.fill + '\" stroke=\"' + st.edge + '\" stroke-width=\"' + st.sw + '\"/>';\n            g += '<rect x=\"' + (x - 18) + '\" y=\"' + (y - 86) + '\" width=\"36\" height=\"46\" fill=\"' + st.fill + '\" stroke=\"' + st.edge + '\" stroke-width=\"' + st.sw + '\"/>';\n            g += '<polygon points=\"' + (x - 45) + ',' + (y - 43) + ' ' + (x + 45) + ',' + (y - 43) + ' ' + (x + 58) + ',' + (y + 30) + ' ' + (x - 58) + ',' + (y + 30) + '\" fill=\"' + st.fill + '\" stroke=\"' + st.edge + '\" stroke-width=\"' + st.sw + '\"/>';\n            return g;\n          }\n          case 'church': {\n            const edge = style === 'parchment' ? '#4a3826' : '#b0a687';\n            let g = '';\n            if (style === 'parchment') g += '<circle cx=\"' + x + '\" cy=\"' + y + '\" r=\"58\" fill=\"#eee0b8\" stroke=\"#5f4a30\" stroke-width=\"1.8\"/>';\n            else g += '<circle cx=\"' + x + '\" cy=\"' + y + '\" r=\"58\" fill=\"#f2ead3\" stroke=\"#d8c8a4\" stroke-width=\"2\"/>';\n            g += '<rect x=\"' + (x - 16) + '\" y=\"' + (y - 33) + '\" width=\"32\" height=\"66\" fill=\"' + S.plaster + '\" stroke=\"' + edge + '\" stroke-width=\"2\"/>';\n            g += '<rect x=\"' + (x - 32) + '\" y=\"' + (y - 17) + '\" width=\"64\" height=\"26\" fill=\"' + S.plaster + '\" stroke=\"' + edge + '\" stroke-width=\"2\"/>';\n            g += '<polygon points=\"' + (x - 16) + ',' + (y - 33) + ' ' + x + ',' + (y - 63) + ' ' + (x + 16) + ',' + (y - 33) + '\" fill=\"#d9c9a4\" stroke=\"' + edge + '\" stroke-width=\"2\"/>';\n            g += '<path d=\"M ' + x + ' ' + (y - 57) + ' v-12 M ' + (x - 5) + ' ' + (y - 64) + ' h10\" stroke=\"' + edge + '\" stroke-width=\"2\"/>';\n            return g;\n          }\n          case 'opera': {\n            const edge = style === 'parchment' ? '#4a3826' : '#8a90a0';\n            let g = '';\n            const shells = [[-30, 1.0], [0, 1.25], [30, 1.0]];\n            for (const s of shells) {\n              const dx = s[0], sc = s[1];\n              g += '<path d=\"M ' + (x + dx - 16) + ' ' + (y + 18) + ' C ' + (x + dx - 14) + ' ' + (y - 6 * sc) + ', ' + (x + dx - 4) + ' ' + (y - 20 * sc) + ', ' + (x + dx + 10) + ' ' + (y - 26 * sc) + ' C ' + (x + dx + 16) + ' ' + (y - 12 * sc) + ', ' + (x + dx + 18) + ' ' + (y + 4) + ', ' + (x + dx + 16) + ' ' + (y + 18) + ' Z\" fill=\"#f2f3f0\" stroke=\"' + edge + '\" stroke-width=\"2\"/>';\n            }\n            g += '<rect x=\"' + (x - 44) + '\" y=\"' + (y + 16) + '\" width=\"88\" height=\"10\" fill=\"' + (style === 'parchment' ? '#c9a06a' : '#b28a58') + '\" stroke=\"' + edge + '\" stroke-width=\"1.6\"/>';\n            return g;\n          }\n          case 'house':\n            return '<rect x=\"' + x + '\" y=\"' + y + '\" width=\"' + (w || 40) + '\" height=\"' + (h || 28) + '\" rx=\"3\" fill=\"' + (style === 'parchment' ? '#e2cda0' : '#d9c6a4') + '\" stroke=\"' + (style === 'parchment' ? '#4a3826' : '#bfa87e') + '\" stroke-width=\"2\"/>' +\n              '<rect x=\"' + (x + (w || 40) / 2 - 3) + '\" y=\"' + (y - 14) + '\" width=\"6\" height=\"16\" fill=\"' + (style === 'parchment' ? '#4a3826' : '#bfa87e') + '\"/>';\n          case 'boathouse':\n            return '<rect x=\"' + x + '\" y=\"' + y + '\" width=\"' + (w || 52) + '\" height=\"' + (h || 34) + '\" rx=\"3\" fill=\"' + S.wood + '\" stroke=\"' + S.woodEdge + '\" stroke-width=\"2\"/>';\n          case 'boat': {\n            const rx = f.small ? 15 : 22, ry = f.small ? 6 : 9;\n            return '<ellipse cx=\"' + x + '\" cy=\"' + y + '\" rx=\"' + rx + '\" ry=\"' + ry + '\" fill=\"' + S.boat + '\" stroke=\"' + S.boatEdge + '\" stroke-width=\"1.5\"/>';\n          }\n          case 'fountain':\n            return '<circle cx=\"' + x + '\" cy=\"' + y + '\" r=\"15\" fill=\"' + S.water + '\" stroke=\"' + S.waterEdge + '\" stroke-width=\"2\"/>' +\n              '<path d=\"M ' + (x - 12) + ' ' + y + ' h24 M ' + x + ' ' + (y - 12) + ' v24\" stroke=\"' + S.waterEdge + '\" stroke-width=\"1.4\"/>';\n          case 'stall':\n            return '<rect x=\"' + x + '\" y=\"' + y + '\" width=\"20\" height=\"12\" rx=\"2\" fill=\"' + S.wood + '\" stroke=\"' + S.woodEdge + '\" stroke-width=\"1.6\"/>';\n          case 'farm': {\n            const rows = f.rows || 1;\n            const cw = w || 80, ch = h || 32;\n            let g = '<rect x=\"' + x + '\" y=\"' + y + '\" width=\"' + cw + '\" height=\"' + ch + '\" fill=\"' + (style === 'parchment' ? '#dfc98e' : '#d9c98f') + '\" stroke=\"' + (style === 'parchment' ? '#a8865a' : '#b8a86f') + '\" stroke-width=\"1.4\"/>';\n            const n = Math.floor(cw / 14);\n            for (let i = 0; i < n; i++) {\n              for (let r = 0; r < rows; r++) {\n                g += '<path d=\"M ' + (x + 8 + i * 14) + ' ' + (y + 4 + r * 22) + ' v10\" stroke=\"' + S.crop + '\" stroke-width=\"2\" stroke-linecap=\"round\"/>';\n              }\n            }\n            return g;\n          }\n          case 'pavilion':\n            return '<polygon points=\"' + (x - 12) + ',' + (y + 14) + ' ' + x + ',' + (y - 10) + ' ' + (x + 12) + ',' + (y + 14) + '\" fill=\"#e3d5b2\" stroke=\"#b0a687\" stroke-width=\"1.6\"/>';\n          case 'city': {\n            const edge = '#8f7d5c';\n            let g = '<circle cx=\"' + x + '\" cy=\"' + y + '\" r=\"34\" fill=\"#d8c8a0\" stroke=\"' + edge + '\" stroke-width=\"3\"/>';\n            g += '<rect x=\"' + (x - 14) + '\" y=\"' + (y - 14) + '\" width=\"28\" height=\"28\" fill=\"#c9b287\" stroke=\"' + edge + '\" stroke-width=\"2\"/>';\n            g += '<rect x=\"' + (x - 38) + '\" y=\"' + (y + 16) + '\" width=\"16\" height=\"12\" fill=\"#d2b78d\" stroke=\"' + edge + '\"/>';\n            g += '<rect x=\"' + (x + 20) + '\" y=\"' + (y + 16) + '\" width=\"16\" height=\"12\" fill=\"#d2b78d\" stroke=\"' + edge + '\"/>';\n            g += '<rect x=\"' + (x - 10) + '\" y=\"' + (y + 30) + '\" width=\"16\" height=\"12\" fill=\"#d2b78d\" stroke=\"' + edge + '\"/>';\n            return g;\n          }\n          case 'fortress': {\n            const edge = '#6b5a3e';\n            let g = '<rect x=\"' + (x - 18) + '\" y=\"' + (y - 18) + '\" width=\"36\" height=\"36\" fill=\"#cbb68c\" stroke=\"' + edge + '\" stroke-width=\"3\"/>';\n            const corners = [[-18, -18], [18, -18], [-18, 18], [18, 18]];\n            for (const c of corners) g += '<circle cx=\"' + (x + c[0]) + '\" cy=\"' + (y + c[1]) + '\" r=\"4.5\" fill=\"' + edge + '\"/>';\n            g += '<path d=\"M ' + x + ' ' + (y - 18) + ' v-14 h12\" fill=\"none\" stroke=\"' + edge + '\" stroke-width=\"2.4\"/>';\n            return g;\n          }\n          case 'gate':\n            return '<rect x=\"' + (x - 22) + '\" y=\"' + (y - 9) + '\" width=\"14\" height=\"32\" fill=\"#c9b68c\" stroke=\"#8a7a58\" stroke-width=\"2\"/>' +\n              '<rect x=\"' + (x + 8) + '\" y=\"' + (y - 9) + '\" width=\"14\" height=\"32\" fill=\"#c9b68c\" stroke=\"#8a7a58\" stroke-width=\"2\"/>';\n          case 'port': {\n            let g = '<rect x=\"' + (x - 8) + '\" y=\"' + (y - 20) + '\" width=\"16\" height=\"40\" fill=\"#c9a97a\" stroke=\"#8a6a42\" stroke-width=\"2\" transform=\"rotate(-14 ' + x + ' ' + y + ')\"/>';\n            g += '<rect x=\"' + (x - 16) + '\" y=\"' + (y - 44) + '\" width=\"20\" height=\"14\" fill=\"' + S.wood + '\" stroke=\"' + S.woodEdge + '\" stroke-width=\"2\"/>';\n            g += '<rect x=\"' + (x + 8) + '\" y=\"' + (y - 48) + '\" width=\"20\" height=\"14\" fill=\"' + S.wood + '\" stroke=\"' + S.woodEdge + '\" stroke-width=\"2\"/>';\n            return g;\n          }\n          case 'volcano': {\n            let g = '<polygon points=\"' + (x - 32) + ',' + (y + 85) + ' ' + x + ',' + (y - 2) + ' ' + (x + 32) + ',' + (y + 85) + '\" fill=\"#c07a5a\" stroke=\"#9a5a40\" stroke-width=\"2\"/>';\n            g += '<ellipse cx=\"' + x + '\" cy=\"' + (y - 2) + '\" rx=\"17\" ry=\"6\" fill=\"#6e3a28\"/>';\n            g += '<path d=\"M ' + (x - 4) + ' ' + (y + 12) + ' L ' + (x + 2) + ' ' + (y + 42) + ' L ' + (x - 6) + ' ' + (y + 70) + '\" fill=\"none\" stroke=\"#a34a30\" stroke-width=\"3\" stroke-linecap=\"round\"/>';\n            return g;\n          }\n          default:\n            return '';\n        }\n      }\n\n      function mmsMapArtCompass(S, style) {\n        if (style === 'parchment') {\n          return '<g transform=\"translate(858,146)\">' +\n            '<circle r=\"24\" fill=\"#f2e6c4\" stroke=\"#6b4f30\" stroke-width=\"2\"/>' +\n            '<polygon points=\"0,-18 6,4 0,0 -6,4\" fill=\"#8a3a2a\"/>' +\n            '<polygon points=\"0,18 6,-4 0,0 -6,-4\" fill=\"#6b4f30\"/>' +\n            '<text y=\"-28\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b3a24\" font-family=\"' + S.font + '\">N<\/text><\/g>';\n        }\n        return '<g><circle cx=\"912\" cy=\"112\" r=\"26\" fill=\"#f4f7f9\" stroke=\"#7a8ea0\" stroke-width=\"2\"/>' +\n          '<polygon points=\"912,90 918,112 906,112\" fill=\"#b05a4a\"/>' +\n          '<polygon points=\"912,134 918,112 906,112\" fill=\"#7a8ea0\"/>' +\n          '<text x=\"912\" y=\"84\" text-anchor=\"middle\" font-size=\"15\" fill=\"#5d788c\" font-family=\"' + S.font + '\">N<\/text><\/g>';\n      }\n\n      function mmsMapArtScaleBar(S, style) {\n        if (style !== 'parchment') return '';\n        return '<g stroke=\"#5b3a24\" stroke-width=\"2\">' +\n          '<path d=\"M 110 942 h150 M 110 936 v12 M 185 938 v8 M 260 936 v12\"/>' +\n          '<text x=\"110\" y=\"930\" font-size=\"13\" fill=\"#5b3a24\" stroke=\"none\" font-family=\"' + S.font + '\">0<\/text>' +\n          '<text x=\"248\" y=\"930\" font-size=\"13\" fill=\"#5b3a24\" stroke=\"none\" font-family=\"' + S.font + '\">500步<\/text><\/g>';\n      }\n\n      // 语义 JSON → SVG 字符串（flat=简约平面 / parchment=手绘羊皮纸）\n      function mmsRenderMapArt(json, styleName) {\n        const S = MMS_MAPART_STYLES[styleName] || MMS_MAPART_STYLES.flat;\n        const style = styleName === 'parchment' ? 'parchment' : 'flat';\n        const parts = [];\n        const P = (s) => parts.push(s);\n\n        let defs = '';\n        if (style === 'parchment') {\n          defs = '<defs>' +\n            '<filter id=\"mms-map-pn\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.8\" numOctaves=\"2\" seed=\"7\" result=\"n\"/>' +\n            '<feColorMatrix in=\"n\" type=\"matrix\" values=\"0 0 0 0 0.38  0 0 0 0 0.27  0 0 0 0 0.13  0 0 0 0.55 0\"/>' +\n            '<feComposite operator=\"in\" in2=\"SourceGraphic\"/><\/filter>' +\n            '<radialGradient id=\"mms-map-vig\" cx=\"50%\" cy=\"50%\" r=\"74%\"><stop offset=\"58%\" stop-color=\"rgba(0,0,0,0)\"/><stop offset=\"100%\" stop-color=\"rgba(90,60,30,0.32)\"/><\/radialGradient>' +\n            '<pattern id=\"mms-map-hatch\" width=\"9\" height=\"9\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"9\" height=\"9\" fill=\"#e8d5ab\"/><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"9\" stroke=\"#c9ae7c\" stroke-width=\"1.1\"/><\/pattern>' +\n            '<pattern id=\"mms-map-grn\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(-30)\"><rect width=\"10\" height=\"10\" fill=\"#c6d3a0\"/><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"10\" stroke=\"#93a878\" stroke-width=\"1.2\"/><\/pattern>' +\n            '<\/defs>';\n        } else {\n          defs = '<defs><pattern id=\"mms-map-grid\" width=\"50\" height=\"50\" patternUnits=\"userSpaceOnUse\">' +\n            '<path d=\"M50 0H0V50\" fill=\"none\" stroke=\"#8a7a58\" stroke-opacity=\"0.10\"/><\/pattern><\/defs>';\n        }\n\n        // 底色 + 装饰\n        const groundFill = S.ground[json.ground === 'sea' ? 'sea' : 'field'] || S.ground.field;\n        P('<rect width=\"1000\" height=\"1000\" fill=\"' + groundFill + '\"/>');\n        if (style === 'parchment') {\n          P('<rect width=\"1000\" height=\"1000\" fill=\"' + groundFill + '\" filter=\"url(#mms-map-pn)\" opacity=\"0.5\"/>');\n          P('<rect width=\"1000\" height=\"1000\" fill=\"url(#mms-map-vig)\"/>');\n          P('<rect x=\"28\" y=\"28\" width=\"944\" height=\"944\" fill=\"none\" stroke=\"#6b4f30\" stroke-width=\"4\"/>');\n          P('<rect x=\"42\" y=\"42\" width=\"916\" height=\"916\" fill=\"none\" stroke=\"#6b4f30\" stroke-width=\"1.5\"/>');\n          if (json.name) P('<text x=\"500\" y=\"104\" text-anchor=\"middle\" font-size=\"46\" fill=\"#5b3a24\" letter-spacing=\"14\" font-family=\"' + S.font + '\">' + json.name + '<\/text>');\n          P('<path d=\"M 380 122 C 440 132, 560 132, 620 122\" stroke=\"#8a6a42\" stroke-width=\"2\" fill=\"none\"/>');\n        } else {\n          P('<rect width=\"1000\" height=\"1000\" fill=\"url(#mms-map-grid)\"/>');\n          if (json.ground === 'sea') {\n            const waves = [[90, 180], [850, 900], [80, 780], [905, 430], [880, 760], [60, 420]];\n            P('<g fill=\"none\" stroke=\"#cfe4ef\" stroke-width=\"3\" opacity=\"0.8\" stroke-linecap=\"round\">' +\n              waves.map((w) => '<path d=\"M ' + w[0] + ' ' + w[1] + ' q 18 -10 36 0 q 18 10 36 0\"/>').join('') + '<\/g>');\n          }\n        }\n\n        // 地形色块\n        for (const t of json.terrain || []) {\n          const fill = t.type === 'forest' && style === 'parchment' ? 'url(#mms-map-grn)'\n            : t.type === 'field' && style === 'parchment' ? 'url(#mms-map-hatch)'\n            : S[t.type] || S.grass;\n          const edge = t.type === 'lake' ? S.waterEdge : (t.type === 'snow' ? '#d3dde2' : (style === 'parchment' ? '#5f4a30' : null));\n          const sw = style === 'parchment' ? 1.8 : 2;\n          if (t.shape === 'ellipse' && t.at && t.r) {\n            P('<ellipse cx=\"' + t.at[0] + '\" cy=\"' + t.at[1] + '\" rx=\"' + t.r[0] + '\" ry=\"' + t.r[1] + '\" fill=\"' + fill + '\"' + (edge ? ' stroke=\"' + edge + '\" stroke-width=\"' + sw + '\"' : '') + '/>');\n          } else if (t.shape === 'path' && t.d) {\n            P('<path d=\"' + t.d + '\" fill=\"' + fill + '\"' + (edge ? ' stroke=\"' + edge + '\" stroke-width=\"' + sw + '\"' : '') + '/>');\n          } else if (t.shape === 'rect' && t.at && t.size) {\n            P('<rect x=\"' + t.at[0] + '\" y=\"' + t.at[1] + '\" width=\"' + t.size[0] + '\" height=\"' + t.size[1] + '\" fill=\"' + fill + '\"' + (edge ? ' stroke=\"' + edge + '\" stroke-width=\"' + sw + '\"' : '') + '/>');\n          }\n        }\n\n        // 城区\n        for (const d of json.districts || []) {\n          let fill;\n          if (style === 'parchment') fill = d.type === 'garden' || d.type === 'royal' ? 'url(#mms-map-grn)' : 'url(#mms-map-hatch)';\n          else fill = { royal: '#cfe0ae', craft: '#e0cfa8', garden: '#b9d09c', plaza: '#f2ead3', harbor: '#cfae7d' }[d.type] || '#e0cfa8';\n          const edge = style === 'parchment' ? '#5f4a30' : (d.type === 'plaza' ? '#d8c8a4' : null);\n          const sw = style === 'parchment' ? 1.8 : 2;\n          if (d.shape === 'ellipse' && d.at && d.r) {\n            P('<ellipse cx=\"' + d.at[0] + '\" cy=\"' + d.at[1] + '\" rx=\"' + d.r[0] + '\" ry=\"' + d.r[1] + '\" fill=\"' + fill + '\"' + (d.type === 'royal' && style !== 'parchment' ? ' opacity=\"0.75\"' : '') + (edge ? ' stroke=\"' + edge + '\" stroke-width=\"' + sw + '\"' : '') + '/>');\n          } else if (d.at) {\n            P('<rect x=\"' + d.at[0] + '\" y=\"' + d.at[1] + '\" width=\"' + (d.size ? d.size[0] : 100) + '\" height=\"' + (d.size ? d.size[1] : 70) + '\" rx=\"' + (d.r || 0) + '\" fill=\"' + fill + '\"' + (edge ? ' stroke=\"' + edge + '\" stroke-width=\"' + sw + '\"' : '') + '/>');\n          }\n        }\n\n        // 河流\n        if (json.river) {\n          const w = S.strokeW.river;\n          if (style === 'parchment') {\n            P('<path d=\"' + json.river + '\" fill=\"none\" stroke=\"' + S.river + '\" stroke-width=\"' + w + '\" opacity=\"0.85\" stroke-linecap=\"round\"/>');\n            P('<path d=\"' + json.river + '\" fill=\"none\" stroke=\"' + S.riverEdge + '\" stroke-width=\"2\" stroke-dasharray=\"18 14\"/>');\n          } else {\n            P('<path d=\"' + json.river + '\" fill=\"none\" stroke=\"' + S.riverEdge + '\" stroke-width=\"' + (w + 10) + '\" stroke-linecap=\"round\"/>');\n            P('<path d=\"' + json.river + '\" fill=\"none\" stroke=\"' + S.river + '\" stroke-width=\"' + w + '\" stroke-linecap=\"round\"/>');\n          }\n        }\n\n        // 道路\n        if ((json.roads || []).length) {\n          if (style === 'parchment') {\n            P('<g fill=\"none\" stroke=\"' + S.road + '\" stroke-width=\"1.6\" stroke-dasharray=\"' + (S.roadDash || '11 9') + '\">' +\n              json.roads.map((d) => '<path d=\"' + d + '\"/>').join('') + '<\/g>');\n          } else {\n            P('<g fill=\"none\" stroke=\"' + S.roadEdge + '\" stroke-width=\"' + S.strokeW.roadEdge + '\" stroke-linecap=\"round\">' +\n              json.roads.map((d) => '<path d=\"' + d + '\"/>').join('') + '<\/g>');\n            P('<g fill=\"none\" stroke=\"' + S.road + '\" stroke-width=\"' + S.strokeW.road + '\" stroke-linecap=\"round\">' +\n              json.roads.map((d) => '<path d=\"' + d + '\"/>').join('') + '<\/g>');\n          }\n        }\n\n        // 桥梁\n        for (const b of json.bridges || []) {\n          if (!b.at) continue;\n          const bw = b.size ? b.size[0] : 50, bh = b.size ? b.size[1] : 26;\n          P('<rect x=\"' + b.at[0] + '\" y=\"' + b.at[1] + '\" width=\"' + bw + '\" height=\"' + bh + '\" rx=\"4\" fill=\"' + (style === 'parchment' ? '#c9a06a' : '#b28a58') + '\" stroke=\"' + (style === 'parchment' ? '#5f4630' : '#8a6a42') + '\" stroke-width=\"2\"/>');\n          P('<path d=\"' + [0, 1, 2].map((i) => 'M ' + (b.at[0] + 12 + i * 12) + ' ' + (b.at[1] + 1) + ' v' + (bh - 2)).join(' ') + '\" stroke=\"' + (style === 'parchment' ? '#5f4630' : '#8a6a42') + '\" stroke-width=\"1.4\"/>');\n        }\n\n        // 山脉\n        if (json.ridge && json.ridge.from && json.ridge.to) {\n          const x0 = json.ridge.from[0], y0 = json.ridge.from[1], x1 = json.ridge.to[0], y1 = json.ridge.to[1];\n          const n = json.ridge.peaks || 5;\n          let g = '';\n          for (let i = 0; i < n; i++) {\n            const t = n === 1 ? 0 : i / (n - 1);\n            const cx = x0 + (x1 - x0) * t, cy = y0 + (y1 - y0) * t;\n            const s = 60 - t * 18;\n            g += '<polygon points=\"' + (cx - 30) + ',' + (cy + s * 0.55) + ' ' + cx + ',' + (cy - s * 0.55) + ' ' + (cx + 30) + ',' + (cy + s * 0.55) + '\" fill=\"' + (style === 'parchment' ? '#c4b494' : '#bfae8e') + '\" stroke=\"' + (style === 'parchment' ? '#6b5a3e' : '#99875f') + '\" stroke-width=\"2\"/>';\n            g += '<polygon points=\"' + (cx - 8) + ',' + (cy - s * 0.18) + ' ' + cx + ',' + (cy - s * 0.55) + ' ' + (cx + 8) + ',' + (cy - s * 0.18) + '\" fill=\"#f6f6f0\"/>';\n          }\n          P(g);\n        }\n\n        // 城墙 / 大陆轮廓\n        const o = json.outline;\n        if (o) {\n          let dAttr;\n          if (o.shape === 'roundRect' && o.at && o.size) dAttr = mmsMapArtRoundRect(o.at[0], o.at[1], o.size[0], o.size[1], o.r || 30);\n          else dAttr = o.d;\n          if (dAttr) {\n            if (o.land) {\n              P('<path d=\"' + dAttr + '\" fill=\"' + (json.ground === 'sea' ? '#ddd0a9' : 'none') + '\" stroke=\"' + S.landStroke + '\" stroke-width=\"4\"/>');\n            } else {\n              P('<path d=\"' + dAttr + '\" fill=\"none\" stroke=\"' + S.wall + '\" stroke-width=\"' + S.strokeW.wall + '\"/>');\n              if (style !== 'parchment' && o.shape === 'roundRect') {\n                P('<path d=\"' + mmsMapArtRoundRect(o.at[0] + 13, o.at[1] + 13, o.size[0] - 26, o.size[1] - 26, Math.max(4, (o.r || 30) - 8)) + '\" fill=\"none\" stroke=\"' + S.wallInner + '\" stroke-width=\"3\"/>');\n              }\n            }\n          }\n        }\n        for (const b of json.bays || []) {\n          P('<path d=\"' + b + '\" fill=\"' + S.ground.sea + '\"/>');\n          P('<path d=\"' + b + '\" fill=\"none\" stroke=\"' + S.landStroke + '\" stroke-width=\"3\"/>');\n        }\n\n        // 塔楼 / 城门\n        for (const t of json.towers || []) {\n          P('<circle cx=\"' + t[0] + '\" cy=\"' + t[1] + '\" r=\"12\" fill=\"' + S.tower + '\" stroke=\"' + S.towerEdge + '\" stroke-width=\"2\"/>');\n        }\n        for (const g of json.gates || []) {\n          const x = g[0], y = g[1];\n          P('<rect x=\"' + (x - 22) + '\" y=\"' + (y - 12) + '\" width=\"44\" height=\"36\" fill=\"#f0e8d0\"/>');\n          P('<rect x=\"' + (x - 40) + '\" y=\"' + (y - 18) + '\" width=\"16\" height=\"34\" rx=\"3\" fill=\"' + S.towerEdge + '\"/>');\n          P('<rect x=\"' + (x + 24) + '\" y=\"' + (y - 18) + '\" width=\"16\" height=\"34\" rx=\"3\" fill=\"' + S.towerEdge + '\"/>');\n          P('<path d=\"M ' + (x - 16) + ' ' + (y + 20) + ' Q ' + x + ' ' + (y - 2) + ' ' + (x + 16) + ' ' + (y + 20) + '\" fill=\"none\" stroke=\"' + (style === 'parchment' ? '#3f3020' : '#6b5a3e') + '\" stroke-width=\"3\"/>');\n        }\n\n        // 批量民居 / 树木\n        if ((json.houses || []).length) {\n          P('<g fill=\"' + S.houseFill + '\" stroke=\"' + S.houseEdge + '\" stroke-width=\"1.5\">' +\n            json.houses.map((hh) => '<rect x=\"' + hh[0] + '\" y=\"' + hh[1] + '\" width=\"26\" height=\"18\" rx=\"2\"/>').join('') + '<\/g>');\n        }\n        if ((json.trees || []).length) {\n          P('<g fill=\"' + S.tree + '\" stroke=\"' + S.treeEdge + '\" stroke-width=\"1.5\">' +\n            json.trees.map((tt) => '<circle cx=\"' + tt[0] + '\" cy=\"' + tt[1] + '\" r=\"' + (style === 'parchment' ? 10 : 13) + '\"/>').join('') + '<\/g>');\n        }\n\n        // 特色建筑\n        for (const f of json.features || []) {\n          if (f && f.at) P(mmsMapArtFeature(f, S, style));\n        }\n\n        // 文字标签\n        if ((json.labels || []).length) {\n          P('<g fill=\"' + S.label + '\" font-size=\"17\" opacity=\"0.85\" text-anchor=\"middle\" font-family=\"' + S.font + '\">' +\n            json.labels.map((l) => '<text x=\"' + l.at[0] + '\" y=\"' + l.at[1] + '\">' + l.text + '<\/text>').join('') + '<\/g>');\n        }\n\n        // 装饰（罗盘/比例尺）\n        P(mmsMapArtCompass(S, style));\n        P(mmsMapArtScaleBar(S, style));\n\n        return '<svg viewBox=\"0 0 1000 1000\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid slice\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block\" font-family=\"' + S.font + '\">' + defs + '\\n' + parts.join('\\n') + '\\n<\/svg>';\n      }\n\n      // ==========================================\n      // MMS 移动版模块：地图管理 + 独立大地图（AI 绘制）+ 绘图 API 配置\n      // （自最新版移植；状态数据仍从正文 Status_block 直读，不移植独立更新引擎）\n      // ==========================================\n      const MMS_EVENT_MAPART = 'mms:map-art-updated';\n      const MMS_COORD_MIN = 10;\n      const MMS_COORD_MAX = 90;\n\n      // 强清洗：去emoji、空白、标点、转小写（用于键匹配；大地图地标去重依赖）\n      function mmsNormalizeName(name) {\n        return mmsPlainName(name)\n          .replace(/[\\[\\]()（）{}<>《》·•\\-—―:：,，.。!！?？'\"'\"]/g, '')\n          .toLowerCase();\n      }\n\n\nwindow.MMS = {\n        floorId: null,\n        messageText: '',\n        // 双地图状态（mini=小地图 big=大地图）：json 当前图 / prev 撤销备份 / busy 生成中\n        art: {\n          mini: { json: null, prev: null, busy: false },\n          big: { json: null, prev: null, busy: false },\n        },\n        lastState: null,\n\n        hasVarsApi() {\n          return typeof getVariables === 'function' && typeof insertOrAssignVariables === 'function';\n        },\n        hasGenApi() {\n          return typeof generateRaw === 'function';\n        },\n\n        // ---------- 精简名册存储（$mms_roster 仅读写 maps/miniArt/bigArt 三组键，\n        // 保留桌面版可能写入的其它键，两版共用同一聊天不互相覆盖） ----------\n        loadRoster() {\n          const fallback = {\n            maps: { minimap: true, bigmap: true },\n            miniArt: { note: '', style: 'flat' },\n            bigArt: { note: '', style: 'flat' },\n          };\n          try {\n            if (!this.hasVarsApi()) return fallback;\n            const chatVars = getVariables({ type: 'chat' }) || {};\n            const r = chatVars && chatVars.$mms_roster;\n            if (!r || typeof r !== 'object') return fallback;\n            const normArt = (a) =>\n              a && typeof a === 'object'\n                ? { note: String(a.note || ''), style: a.style === 'parchment' ? 'parchment' : 'flat' }\n                : null;\n            const maps =\n              r.maps && typeof r.maps === 'object'\n                ? { minimap: r.maps.minimap !== false, bigmap: r.maps.bigmap !== false }\n                : fallback.maps;\n            return {\n              maps: maps,\n              miniArt: normArt(r.miniArt) || fallback.miniArt,\n              bigArt: normArt(r.bigArt) || fallback.bigArt,\n            };\n          } catch (e) {\n            console.warn('[MMS] 读取地图配置失败:', e);\n            return fallback;\n          }\n        },\n\n        saveRoster(roster) {\n          try {\n            if (!this.hasVarsApi()) return;\n            const chatVars = getVariables({ type: 'chat' }) || {};\n            const prev = chatVars && chatVars.$mms_roster && typeof chatVars.$mms_roster === 'object' ? chatVars.$mms_roster : {};\n            const next = Object.assign({}, prev, {\n              maps: roster.maps || { minimap: true, bigmap: true },\n              miniArt: roster.miniArt || { note: '', style: 'flat' },\n              bigArt: roster.bigArt || { note: '', style: 'flat' },\n            });\n            if (typeof replaceVariables === 'function') {\n              replaceVariables(Object.assign({}, chatVars, { $mms_roster: next }), { type: 'chat' });\n            } else {\n              insertOrAssignVariables({ $mms_roster: next }, { type: 'chat' });\n            }\n          } catch (e) {\n            console.warn('[MMS] 保存地图配置失败:', e);\n          }\n        },\n\n        // ---------- 绘图 API 配置 ----------\n        // 读取仅合并本模块关心的 API 字段；写入走 syncActiveApiToConfig（原位保留 $mms_config 其它键）\n        loadConfig() {\n          const defaults = {\n            apiUrl: '',\n            apiKey: '',\n            model: '',\n            source: 'custom',\n            preset: '',\n            contextFloors: 2,\n            temperature: 0.3,\n            maxTokens: 4096,\n            topP: '',\n          };\n          try {\n            if (!this.hasVarsApi()) return defaults;\n            const g = getVariables({ type: 'global' }) || {};\n            const cfg = g && typeof g.$mms_config === 'object' ? g.$mms_config : {};\n            return Object.assign({}, defaults, cfg);\n          } catch (e) {\n            return defaults;\n          }\n        },\n\n        // ---------- API 预设（下拉栏，含锁定的默认连接） ----------\n        loadApiPresets() {\n          const fallback = {\n            active: 'default',\n            presets: [\n              {\n                id: 'default',\n                name: '默认（当前酒馆连接）',\n                config: {},\n                locked: true,\n              },\n            ],\n          };\n          try {\n            if (!this.hasVarsApi()) return fallback;\n            const g = getVariables({ type: 'global' }) || {};\n            const p = g && g.$mms_api_presets;\n            if (!p || typeof p !== 'object' || !Array.isArray(p.presets)) return fallback;\n            const presets = p.presets.filter(Boolean);\n            if (!presets.some((x) => x.id === 'default')) {\n              presets.unshift({ id: 'default', name: '默认（当前酒馆连接）', config: {}, locked: true });\n            }\n            return { active: p.active || 'default', presets };\n          } catch (e) {\n            return fallback;\n          }\n        },\n\n        saveApiPresets(data) {\n          try {\n            if (!this.hasVarsApi()) return;\n            insertOrAssignVariables({ $mms_api_presets: data }, { type: 'global' });\n          } catch (e) {\n            console.error('[MMS] 保存API预设失败:', e);\n          }\n        },\n\n        // 当前预设配置同步到 $mms_config（原位保留其它键，只覆盖 API 字段）\n        syncActiveApiToConfig(data) {\n          const preset = data.presets.find((p) => p.id === data.active) || data.presets[0];\n          if (!preset) return;\n          try {\n            if (!this.hasVarsApi()) return;\n            const g = getVariables({ type: 'global' }) || {};\n            const cur = g && typeof g.$mms_config === 'object' ? g.$mms_config : {};\n            insertOrAssignVariables(\n              { $mms_config: Object.assign({}, cur, preset.config || {}) },\n              { type: 'global' },\n            );\n          } catch (e) { /* 静默降级 */ }\n        },\n\n        buildCustomApi(cfg) {\n          const api = {};\n          if (cfg.preset && cfg.preset.trim()) api.proxy_preset = cfg.preset.trim();\n          if (cfg.apiUrl && cfg.apiUrl.trim()) {\n            api.apiurl = cfg.apiUrl.trim();\n            if (cfg.apiKey) api.key = cfg.apiKey;\n            api.source = cfg.source || 'custom';\n          }\n          if (cfg.model && cfg.model.trim()) api.model = cfg.model.trim();\n          api.temperature = typeof cfg.temperature === 'number' ? cfg.temperature : 0.3;\n          api.max_tokens = cfg.maxTokens || 4096;\n          if (typeof cfg.topP === 'number' && cfg.topP > 0 && cfg.topP <= 1) api.top_p = cfg.topP;\n          return api;\n        },\n\n        // 拉取模型列表：走酒馆服务端代理 /api/backends/chat-completions/status（同源免 CORS，\n        // 请求头由酒馆注入 CSRF）。结果填入真实 <select>（datalist 在手机 WebView 下不可靠）\n        async fetchModels() {\n          const urlEl = document.getElementById('mms-api-url');\n          const keyEl = document.getElementById('mms-api-key');\n          const btn = document.getElementById('mms-fetch-models');\n          const modelEl = document.getElementById('mms-api-model');\n          const selectEl = document.getElementById('mms-model-select');\n          if (!urlEl || !keyEl || !btn || !modelEl || !selectEl) return;\n          const url = (urlEl.value || '').trim();\n          const key = (keyEl.value || '').trim();\n          if (!url) {\n            alert('请先填写 API 地址（留空使用当前酒馆连接时，模型由酒馆管理，无法拉取列表）');\n            return;\n          }\n          let headers = null;\n          try {\n            const pw = typeof window.parent !== 'undefined' ? window.parent : null;\n            const ST = pw && pw.SillyTavern;\n            const ctx = ST && typeof ST.getContext === 'function' ? ST.getContext() : null;\n            if (ctx && typeof ctx.getRequestHeaders === 'function') {\n              headers = Object.assign({ 'Content-Type': 'application/json' }, ctx.getRequestHeaders());\n            }\n          } catch (e) { /* 直通通道不可用，走下方报错 */ }\n          if (!headers) {\n            alert('无法获取酒馆请求头（当前环境不支持直通 SillyTavern），拉取失败');\n            return;\n          }\n          const original = btn.innerHTML;\n          btn.disabled = true;\n          btn.innerHTML = '<i class=\"fa fa-spinner fa-spin\"><\/i>';\n          try {\n            const resp = await fetch('/api/backends/chat-completions/status', {\n              method: 'POST',\n              headers,\n              body: JSON.stringify({\n                reverse_proxy: url,\n                proxy_password: '',\n                chat_completion_source: 'custom',\n                custom_url: url,\n                custom_include_headers: key ? 'Authorization: Bearer ' + key : '',\n              }),\n            });\n            if (!resp.ok) throw new Error('HTTP ' + resp.status);\n            const data = await resp.json();\n            // 兼容三种返回：酒馆 status 端点 {models:[...]} / OpenAI 规范 {data:[{id}]} / 裸数组\n            const raw = data && data.models ? data.models : data && data.data ? data.data : Array.isArray(data) ? data : [];\n            const models = raw\n              .map((m) => (typeof m === 'string' ? m : m && m.id ? m.id : null))\n              .filter((m) => typeof m === 'string' && m.trim());\n            if (!models.length) throw new Error('未能解析模型数据');\n            const current = (modelEl.value || '').trim();\n            selectEl.innerHTML = '';\n            const placeholder = document.createElement('option');\n            placeholder.value = '';\n            placeholder.textContent = '已拉取 ' + models.length + ' 个模型，点击选择…';\n            selectEl.appendChild(placeholder);\n            let hit = false;\n            for (const m of models) {\n              const opt = document.createElement('option');\n              opt.value = m;\n              opt.textContent = m;\n              if (m === current) hit = true;\n              selectEl.appendChild(opt);\n            }\n            selectEl.value = hit ? current : '';\n            selectEl.style.display = 'block';\n            alert('已拉取 ' + models.length + ' 个模型，请在下拉列表中选择');\n          } catch (e) {\n            alert('拉取模型列表失败：' + (e && e.message ? e.message : e));\n          } finally {\n            btn.disabled = false;\n            btn.innerHTML = original;\n          }\n        },\n\n        // ---------- API 预设 UI ----------\n        initApiPresetUI() {\n          this.renderApiPresetUI();\n          const select = document.getElementById('mms-api-preset-select');\n          if (select) {\n            select.addEventListener('change', () => {\n              const data = this.loadApiPresets();\n              data.active = select.value;\n              this.saveApiPresets(data);\n              this.syncActiveApiToConfig(data);\n              this.renderApiPresetUI();\n            });\n          }\n          const addBtn = document.getElementById('mms-api-add');\n          if (addBtn) addBtn.addEventListener('click', () => this.addApiPreset());\n          const delBtn = document.getElementById('mms-api-delete');\n          if (delBtn) delBtn.addEventListener('click', () => this.deleteApiPreset());\n          const renameBtn = document.getElementById('mms-api-rename');\n          if (renameBtn) renameBtn.addEventListener('click', () => this.renameApiPreset());\n          const importBtn = document.getElementById('mms-api-import');\n          if (importBtn) {\n            importBtn.addEventListener('click', () => {\n              MMS_IMG.importPresetFile('.json', (data) => this.importApiPresetFile(data));\n            });\n          }\n          const exportBtn = document.getElementById('mms-api-export');\n          if (exportBtn) exportBtn.addEventListener('click', () => this.exportApiPresetFile());\n\n          const bindApiField = (id, key, transform) => {\n            const el = document.getElementById(id);\n            if (!el) return;\n            const handler = () => {\n              const data = this.loadApiPresets();\n              const preset = data.presets.find((p) => p.id === data.active);\n              if (!preset) return;\n              preset.config[key] = transform ? transform(el.value) : el.value;\n              this.saveApiPresets(data);\n              this.syncActiveApiToConfig(data);\n            };\n            el.addEventListener('change', handler);\n          };\n          bindApiField('mms-api-url', 'apiUrl');\n          bindApiField('mms-api-key', 'apiKey');\n          bindApiField('mms-api-model', 'model');\n          const fetchModelsBtn = document.getElementById('mms-fetch-models');\n          if (fetchModelsBtn) fetchModelsBtn.addEventListener('click', () => this.fetchModels());\n          // 拉取到的模型下拉：选中即写回模型输入框，并派发 change 走预设保存链路\n          const modelSelectEl = document.getElementById('mms-model-select');\n          if (modelSelectEl) {\n            modelSelectEl.addEventListener('change', () => {\n              if (!modelSelectEl.value) return;\n              const input = document.getElementById('mms-api-model');\n              if (!input) return;\n              input.value = modelSelectEl.value;\n              input.dispatchEvent(new Event('change'));\n            });\n          }\n          bindApiField('mms-api-preset', 'preset');\n          bindApiField('mms-api-temperature', 'temperature', (v) => {\n            const t = parseFloat(v);\n            return isNaN(t) ? 0.3 : Math.min(2, Math.max(0, t));\n          });\n          bindApiField('mms-api-max-tokens', 'maxTokens', (v) => {\n            const t = parseInt(v, 10);\n            return isNaN(t) ? 4096 : Math.min(32000, Math.max(256, t));\n          });\n          bindApiField('mms-api-top-p', 'topP', (v) => {\n            const t = parseFloat(v);\n            return isNaN(t) || t <= 0 ? '' : Math.min(1, Math.max(0, t));\n          });\n          const sourceSel = document.getElementById('mms-api-source');\n          if (sourceSel) {\n            sourceSel.addEventListener('change', () => {\n              const data = this.loadApiPresets();\n              const preset = data.presets.find((p) => p.id === data.active);\n              if (!preset) return;\n              preset.config.source = sourceSel.value;\n              this.saveApiPresets(data);\n              this.syncActiveApiToConfig(data);\n            });\n          }\n        },\n\n        renderApiPresetUI() {\n          const select = document.getElementById('mms-api-preset-select');\n          if (!select) return;\n          const data = this.loadApiPresets();\n          select.innerHTML = '';\n          data.presets.forEach((p) => {\n            const opt = document.createElement('option');\n            opt.value = p.id;\n            opt.textContent = p.name + (p.locked ? ' 🔒' : '');\n            select.appendChild(opt);\n          });\n          select.value = data.active;\n          // 表单回填当前预设\n          const preset = data.presets.find((p) => p.id === data.active) || data.presets[0];\n          const c = (preset && preset.config) || {};\n          const set = (id, v) => {\n            const el = document.getElementById(id);\n            if (el) el.value = v == null ? '' : String(v);\n          };\n          set('mms-api-url', c.apiUrl);\n          set('mms-api-key', c.apiKey);\n          set('mms-api-model', c.model);\n          set('mms-api-preset', c.preset);\n          set('mms-api-temperature', c.temperature != null ? c.temperature : 0.3);\n          set('mms-api-max-tokens', c.maxTokens != null ? c.maxTokens : 4096);\n          set('mms-api-top-p', c.topP != null ? c.topP : '');\n          const sourceSel = document.getElementById('mms-api-source');\n          if (sourceSel) sourceSel.value = c.source || 'custom';\n          const delBtn = document.getElementById('mms-api-delete');\n          if (delBtn) delBtn.disabled = !!(preset && preset.locked);\n        },\n\n        addApiPreset() {\n          const data = this.loadApiPresets();\n          const name = prompt('新 API 预设名称：', '');\n          if (!name) return;\n          const id = 'api_' + Date.now();\n          const cur = data.presets.find((p) => p.id === data.active);\n          data.presets.push({\n            id,\n            name,\n            config: cur && !cur.locked ? JSON.parse(JSON.stringify(cur.config || {})) : {},\n            locked: false,\n          });\n          data.active = id;\n          this.saveApiPresets(data);\n          this.syncActiveApiToConfig(data);\n          this.renderApiPresetUI();\n        },\n\n        deleteApiPreset() {\n          const data = this.loadApiPresets();\n          const preset = data.presets.find((p) => p.id === data.active);\n          if (!preset) return;\n          if (preset.locked) {\n            alert('默认预设不可删除');\n            return;\n          }\n          if (!confirm('确定删除 API 预设「' + preset.name + '」？')) return;\n          data.presets = data.presets.filter((p) => p.id !== data.active);\n          data.active = 'default';\n          this.saveApiPresets(data);\n          this.syncActiveApiToConfig(data);\n          this.renderApiPresetUI();\n        },\n\n        renameApiPreset() {\n          const data = this.loadApiPresets();\n          const preset = data.presets.find((p) => p.id === data.active);\n          if (!preset) return;\n          if (preset.locked) {\n            alert('默认预设不可重命名');\n            return;\n          }\n          const name = prompt('重命名 API 预设：', preset.name);\n          if (!name) return;\n          preset.name = name;\n          this.saveApiPresets(data);\n          this.renderApiPresetUI();\n        },\n\n        exportApiPresetFile() {\n          const data = this.loadApiPresets();\n          const preset = data.presets.find((p) => p.id === data.active);\n          if (!preset) return;\n          MMS_IMG.exportPresetFile(\n            { type: 'mms-api-config', v: 2, name: preset.name, config: preset.config },\n            'mms-api-preset.json',\n          );\n        },\n\n        importApiPresetFile(data) {\n          if (!data || data.type !== 'mms-api-config') {\n            alert('这不是 API 预设文件（type 应为 mms-api-config）');\n            return;\n          }\n          const ps = this.loadApiPresets();\n          // 兼容 v1（扁平字段）与 v2（嵌套 config）\n          const config = data.config || {\n            source: data.source,\n            apiUrl: data.apiUrl,\n            apiKey: data.apiKey,\n            model: data.model,\n            preset: data.preset,\n            contextFloors: data.contextFloors,\n          };\n          ps.presets.push({\n            id: 'api_' + Date.now(),\n            name: data.name || '导入的API预设',\n            config,\n            locked: false,\n          });\n          ps.active = ps.presets[ps.presets.length - 1].id;\n          this.saveApiPresets(ps);\n          this.syncActiveApiToConfig(ps);\n          this.renderApiPresetUI();\n        },\n\n        // ---------- 地图设置 UI（LLM地图页签：双开关 + 每图风格与备注） ----------\n        initMapArtUI() {\n          // 地图开关（渲染层控制：关闭后对应地图回退普通列表，正文数据不丢失）\n          const bindMapToggle = (id, key) => {\n            const el = document.getElementById(id);\n            if (!el) return;\n            el.addEventListener('change', () => {\n              const rr = this.loadRoster();\n              rr.maps[key] = el.checked;\n              this.saveRoster(rr);\n              reRenderStatusBar();\n            });\n          };\n          const roster = this.loadRoster();\n          const miniEl = document.getElementById('mms-map-minimap');\n          if (miniEl) miniEl.checked = roster.maps.minimap !== false;\n          const bigEl = document.getElementById('mms-map-bigmap');\n          if (bigEl) bigEl.checked = roster.maps.bigmap !== false;\n          bindMapToggle('mms-map-minimap', 'minimap');\n          bindMapToggle('mms-map-bigmap', 'bigmap');\n\n          // 每图风格 + 设定备注（两图同构表单）\n          for (const kind of Object.keys(MMS_MAP_KINDS)) {\n            const K = MMS_MAP_KINDS[kind];\n            const art = roster[K.cfgKey];\n            const styleEl = document.getElementById(kind === 'mini' ? 'mms-miniart-style' : 'mms-bigart-style');\n            const noteEl = document.getElementById(kind === 'mini' ? 'mms-miniart-note' : 'mms-bigart-note');\n            if (styleEl) {\n              styleEl.value = art.style;\n              styleEl.addEventListener('change', () => {\n                const rr = this.loadRoster();\n                rr[K.cfgKey].style = styleEl.value === 'parchment' ? 'parchment' : 'flat';\n                this.saveRoster(rr);\n                this.refreshMapCard(kind);\n              });\n            }\n            if (noteEl) {\n              if (noteEl.value !== art.note) noteEl.value = art.note;\n              noteEl.addEventListener('change', () => {\n                const rr = this.loadRoster();\n                rr[K.cfgKey].note = noteEl.value.trim();\n                this.saveRoster(rr);\n              });\n            }\n          }\n        },\n\n        // ---------- 剧情收集（供绘图提示词组装） ----------\n        readFloorMaintext(floorId) {\n          try {\n            if (typeof getChatMessages !== 'function') return '';\n            const arr = getChatMessages(floorId);\n            const m = Array.isArray(arr) && arr.length > 0 ? arr[0] : arr;\n            if (!m || typeof m.message !== 'string') return '';\n            let text = extractLastBlock(m.message, 'maintext');\n            if (!text) {\n              text = m.message.replace(/<Status_block>[\\s\\S]*?<\\/Status_block>/gi, '');\n            }\n            text = text.replace(/\\[IMG_GEN\\][\\s\\S]*?\\[\\/IMG_GEN\\]/gi, '');\n            return text.trim();\n          } catch (e) {\n            return '';\n          }\n        },\n\n        readFloorUserInput(m) {\n          return String((m && m.message) || '')\n            .replace(/\\[IMG_GEN\\][\\s\\S]*?\\[\\/IMG_GEN\\]/gi, '')\n            .trim();\n        },\n\n        // 收集最近 N 层剧情：latest = 目标AI楼正文 + 紧邻用户输入；context = 更早楼层（n>=3 才有）\n        collectStorySegments(targetFloorId, n = 2) {\n          const aiText = this.readFloorMaintext(targetFloorId);\n          const latestParts = [];\n          let pairedUserId = null;\n          try {\n            if (typeof getChatMessages === 'function') {\n              // 向前找紧邻的用户楼（跳过连续的AI楼/空楼）\n              let id = targetFloorId - 1;\n              while (id >= 0 && id >= targetFloorId - 5) {\n                const arr = getChatMessages(id);\n                const m = Array.isArray(arr) && arr.length > 0 ? arr[0] : arr;\n                if (m) {\n                  const isUser = m.role === 'user' || m.is_user;\n                  if (isUser) {\n                    const raw = this.readFloorUserInput(m);\n                    if (raw) {\n                      latestParts.push('【用户输入】' + raw);\n                      pairedUserId = id;\n                    }\n                    break;\n                  }\n                }\n                id--;\n              }\n            }\n          } catch (e) {\n            /* 取不到用户楼时只喂AI正文 */\n          }\n          if (aiText) latestParts.push('【AI回复】' + aiText);\n          const latest = latestParts.join('\\n\\n') || aiText;\n\n          let context = '';\n          try {\n            if (typeof getLastMessageId !== 'function' || n < 3) return { latest, context };\n            const parts = [];\n            let id = (pairedUserId != null ? pairedUserId : targetFloorId) - 1;\n            let collected = 0;\n            const maxCollect = n - 2;\n            while (id >= 0 && collected < maxCollect) {\n              const arr = getChatMessages(id);\n              const m = Array.isArray(arr) && arr.length > 0 ? arr[0] : arr;\n              if (!m) {\n                id--;\n                continue;\n              }\n              const isUser = m.role === 'user' || m.is_user;\n              if (isUser) {\n                const raw = this.readFloorUserInput(m);\n                if (raw) {\n                  parts.unshift('【用户输入】' + raw);\n                  collected++;\n                }\n              } else {\n                const t = this.readFloorMaintext(id);\n                if (t) {\n                  parts.unshift('【AI回复】' + t);\n                  collected++;\n                }\n              }\n              id--;\n            }\n            context = parts.join('\\n\\n');\n          } catch (e) {\n            context = '';\n          }\n          return { latest, context };\n        },\n\n        collectLocationLines(floorId, count) {\n          const lines = [];\n          try {\n            if (typeof getChatMessages !== 'function') return lines;\n            const start = Math.max(0, floorId - count + 1);\n            for (let id = floorId; id >= start; id--) {\n              const t = this.readFloorMaintext(id);\n              if (!t) continue;\n              const re = /【[^】]*📍[^】]*】/g;\n              let m;\n              while ((m = re.exec(t)) !== null) lines.push(m[0]);\n            }\n          } catch (e) { /* 忽略 */ }\n          return lines;\n        },\n\n        // ---------- 双地图（AI 绘制：语义 JSON + 本地渲染器） ----------\n        // 聊天变量 {mini:'$mms_map_mini_art', big:'$mms_map_art'} = { json, prev, ts }：每聊天各一张演化中的地图，缓存后零 LLM 开销\n        loadMapArt(kind) {\n          const st = this.art[kind];\n          st.json = null;\n          st.prev = null;\n          try {\n            if (!this.hasVarsApi()) return;\n            const chatVars = getVariables({ type: 'chat' }) || {};\n            const a = chatVars && chatVars[MMS_MAP_KINDS[kind].varName];\n            const valid = (j) => j && typeof j === 'object' && Array.isArray(j.markers) && j.markers.length;\n            if (a && typeof a === 'object' && valid(a.json)) {\n              st.json = this.sanitizeMapArt(a.json);\n              if (valid(a.prev)) st.prev = this.sanitizeMapArt(a.prev);\n            }\n          } catch (e) {\n            st.json = null;\n            st.prev = null;\n          }\n        },\n\n        loadAllMapArt() {\n          Object.keys(MMS_MAP_KINDS).forEach((k) => this.loadMapArt(k));\n        },\n\n        // keepPrev=false 时把当前 json 存为备份（正常保存）；true 时沿用传入的 prev（撤销场景）\n        saveMapArt(kind, json, prevOverride) {\n          try {\n            if (!this.hasVarsApi()) return;\n            const st = this.art[kind];\n            const prev = prevOverride !== undefined ? prevOverride : st.json || null;\n            const payload = { json: json, ts: Date.now() };\n            if (prev && prev !== json) payload.prev = prev;\n            insertOrAssignVariables({ [MMS_MAP_KINDS[kind].varName]: payload }, { type: 'chat' });\n            st.prev = payload.prev || null;\n          } catch (e) {\n            console.error('[MMS] 保存' + MMS_MAP_KINDS[kind].label + '失败:', e);\n          }\n        },\n\n        // 撤销上一次地图更新：与备份互换（可再次点击回到新版，形成单步来回）\n        undoMapArt(kind) {\n          const st = this.art[kind];\n          if (!st.prev) {\n            alert('没有可撤销的上一版' + MMS_MAP_KINDS[kind].label);\n            return false;\n          }\n          const cur = st.json;\n          const prev = st.prev;\n          st.json = prev;\n          this.saveMapArt(kind, prev, cur || null);\n          this.refreshMapCard(kind);\n          if (typeof eventEmit === 'function') {\n            try { eventEmit(MMS_EVENT_MAPART, {}); } catch (e) { /* 忽略 */ }\n          }\n          return true;\n        },\n\n        // 解析正文地点行（形如【📍悉尼·澳大利亚酒店-总督套房】），取候选地名与地标匹配\n        matchHereMarker(art) {\n          try {\n            const text = this.messageText || '';\n            const main = extractMaintext(text) || text;\n            const matches = [];\n            const re = /📍\\s*([^】\\n]{1,40})/g;\n            let m;\n            while ((m = re.exec(main)) !== null) matches.push(m[1]);\n            if (!matches.length) return null;\n            const last = matches[matches.length - 1];\n            // 从最细到最粗（\"悉尼·澳大利亚酒店-总督套房\" → 总督套房/澳大利亚酒店/悉尼），优先精确楼层\n            const cands = last.split(/[·\\-—–]/).map((s) => s.trim()).filter(Boolean).reverse();\n            for (const c of cands) {\n              const hit = (art.markers || []).find(\n                (mk) => mk && mk.name && (c.includes(mk.name) || mk.name.includes(c)),\n              );\n              if (hit) return hit;\n            }\n          } catch (e) { /* 忽略 */ }\n          return null;\n        },\n\n        // 渲染前注入：把两张 AI 地图合成进显示数据副本，并更新全局渲染状态 MMS_MAP_ART_STATE\n        injectMapArt(rootData) {\n          const display = JSON.parse(JSON.stringify(rootData || {}));\n          this.lastState = rootData;\n          let roster = null;\n          try {\n            roster = this.loadRoster();\n          } catch (e) {\n            roster = null;\n          }\n          for (const kind of Object.keys(MMS_MAP_KINDS)) {\n            const K = MMS_MAP_KINDS[kind];\n            const st = this.art[kind];\n            const enabled = !!(roster && roster.maps && roster.maps[K.toggleKey] !== false);\n            if (!display || typeof display !== 'object' || !enabled) {\n              MMS_MAP_ART_STATE[kind] = { enabled: false };\n              continue;\n            }\n            const artCfg = roster[K.cfgKey];\n            const style = artCfg.style === 'parchment' ? 'parchment' : 'flat';\n            const art = st.json;\n            if (art && Array.isArray(art.markers) && art.markers.length) {\n              const name = art.name || K.label;\n              const here = this.matchHereMarker(art);\n              display[K.dataKey] = {};\n              display[K.dataKey][name] = art.markers.map(\n                (mk) => (mk.emoji || '📍') + '【' + mk.name + '】(' + mk.x + ', ' + mk.y + ') ' + (mk.desc || ''),\n              );\n              MMS_MAP_ART_STATE[kind] = {\n                enabled: true,\n                key: name,\n                name: name,\n                svg: mmsRenderMapArt(art, style),\n                style: style,\n                hereName: here ? here.name : null,\n                hereMatched: !!here,\n                empty: false,\n                generating: !!st.busy,\n                canUndo: !!st.prev,\n              };\n            } else {\n              display[K.dataKey] = {};\n              display[K.dataKey]['AI' + K.label] = [\n                '🗺️【' + K.label + '尚未生成】(50, 50) 点击下方按钮，由绘图 AI 依据剧情生成',\n              ];\n              MMS_MAP_ART_STATE[kind] = {\n                enabled: true,\n                key: 'AI' + K.label,\n                name: 'AI' + K.label,\n                svg: null,\n                style: style,\n                hereName: null,\n                hereMatched: false,\n                empty: true,\n                generating: !!st.busy,\n                canUndo: !!st.prev,\n              };\n            }\n          }\n          return display;\n        },\n\n        // 地图卡片原地刷新：只重建该地图的卡片节点，不整栏重渲染（不切标签页、不丢滚动位置）。\n        // 找不到现有卡片（状态栏尚未渲染过该地图）时回退整栏重渲染。\n        refreshMapCard(kind) {\n          if (!this.lastState) return;\n          try {\n            this.injectMapArt(this.lastState); // 同步 MMS_MAP_ART_STATE\n            const bma = MMS_MAP_ART_STATE[kind];\n            const oldLi = document.querySelector(\n              '.character-panel li[data-mms-map-kind=\"' + kind + '\"]',\n            );\n            if (bma && bma.enabled && oldLi) {\n              const st = this.art[kind];\n              const markersData = bma.empty\n                ? [{ emoji: '🗺️', name: MMS_MAP_KINDS[kind].label + '尚未生成', x: 50, y: 50, desc: '' }]\n                : (st.json && st.json.markers ? st.json.markers : []).map((m) => ({\n                    emoji: m.emoji,\n                    name: m.name,\n                    x: m.x,\n                    y: m.y,\n                    desc: m.desc,\n                  }));\n              const sr = new StoryRenderer('yaml-data-source');\n              oldLi.replaceWith(sr.createMapArtItem(kind, bma.key, markersData, bma));\n              return;\n            }\n          } catch (e) {\n            console.warn('[MMS] ' + MMS_MAP_KINDS[kind].label + '卡片原地刷新失败，回退整栏渲染:', e);\n          }\n          reRenderStatusBar();\n        },\n\n        // 风格切换：同一份 JSON 本地重绘，零 AI 开销\n        switchMapArtStyle(kind) {\n          const K = MMS_MAP_KINDS[kind];\n          const rr = this.loadRoster();\n          rr[K.cfgKey].style = rr[K.cfgKey].style === 'parchment' ? 'flat' : 'parchment';\n          this.saveRoster(rr);\n          const sel = document.getElementById(kind === 'mini' ? 'mms-miniart-style' : 'mms-bigart-style');\n          if (sel) sel.value = rr[K.cfgKey].style;\n          this.refreshMapCard(kind);\n        },\n\n        buildMapArtSystemPrompt(mode, kind) {\n          const isPatch = mode === 'merge';\n          const isMini = kind === 'mini';\n          const lines = [];\n          lines.push(isMini\n            ? '你是跑团小地图绘制师。根据剧情信息绘制「当前场景」的局部平面图（建筑内部、院落、街区一层），输出「语义 JSON」——本地渲染器会把它绘制成图，你只负责空间布局与地标，不要输出 SVG，不要解释。'\n            : '你是跑团大地图绘制师。根据剧情信息规划区域大地图（城市/大陆尺度），输出「语义 JSON」——本地渲染器会把它绘制成图，你只负责地理布局与地标，不要输出 SVG，不要解释。');\n          lines.push('');\n          lines.push('## 输出格式硬性要求');\n          lines.push('- 只输出一个 JSON 对象，前后不得有任何文字，不要 markdown 围栏。');\n          lines.push('- 必须是严格合法 JSON：禁止 // 与 /* */ 注释、禁止尾随逗号、数组与对象的元素之间必须有英文逗号、标点一律英文半角。');\n          lines.push('- 输出紧凑单行 JSON（不缩进、不换行）。');\n          lines.push('');\n          if (isPatch) {\n            lines.push('## 增量模式：只输出新增内容');\n            lines.push('用户会给出「当前地图 JSON」，其中的内容已经画好了，绝对不要重复输出它们。你的输出结构：');\n            lines.push('{\"add\":{\"markers\":[…],\"features\":[…],\"houses\":[…],\"trees\":[…],\"terrain\":[…],\"roads\":[…],\"districts\":[…],\"labels\":[…],\"bridges\":[…]},\"name\":\"可选的新图名\"}');\n            lines.push('- add 里只放本次新出现地点所需的新元素，各数组均可省略；旧元素一律不要重复。');\n            lines.push('- 不要输出 outline/towers/gates/river/ridge/ground/bays——这些是已定型的地图骨架，增量模式不可改动。');\n            lines.push('- name 仅在图名确实需要更新时给出，否则省略。');\n            lines.push('- 若剧情中没有出现地图上尚不存在的地点，输出 {\"add\":{}} 即可。');\n            lines.push('');\n            lines.push('## 各数组的元素结构');\n            lines.push('- markers: {\"emoji\":\"🏰\",\"name\":\"地标名\",\"x\":50,\"y\":25,\"desc\":\"一句话描述\"}');\n            lines.push('- features: {\"type\":\"castle\",\"at\":[500,258]}');\n            lines.push('- terrain: {\"type\":\"grass\",\"shape\":\"ellipse\",\"at\":[150,850],\"r\":[110,90]}');\n            lines.push('- districts: {\"type\":\"royal\",\"shape\":\"ellipse\",\"at\":[500,258],\"r\":[118,80],\"label\":\"区名\"}');\n            lines.push('- labels: {\"at\":[500,345],\"text\":\"地名\"}');\n            lines.push('- bridges: {\"at\":[578,418],\"size\":[52,26]}');\n            lines.push('- roads: \"M 500 940 C 496 820, 490 640, 487 575\"（SVG 路径字符串）');\n            lines.push('- houses / trees: [x,y] 坐标对');\n          } else {\n            lines.push('## 完整 JSON 结构');\n            lines.push('{');\n            lines.push('  \"name\": \"地图名\",');\n            lines.push('  \"ground\": \"field\",');\n            lines.push('  \"terrain\": [ {\"type\":\"grass\",\"shape\":\"ellipse\",\"at\":[150,850],\"r\":[110,90]} ],');\n            lines.push('  \"outline\": {\"shape\":\"roundRect\",\"at\":[120,160],\"size\":[760,780],\"r\":36,\"wall\":true},');\n            lines.push('  \"bays\": [\"M 355 900 C 330 820, 305 780, 312 738 Z\"],');\n            lines.push('  \"towers\": [[150,190],[850,190]],');\n            lines.push('  \"gates\": [[500,930]],');\n            lines.push('  \"river\": \"M 645 150 C 615 300, 598 390, 608 480\",');\n            lines.push('  \"bridges\": [ {\"at\":[578,418],\"size\":[52,26]} ],');\n            lines.push('  \"roads\": [\"M 500 940 C 496 820, 490 640, 487 575\"],');\n            lines.push('  \"districts\": [ {\"type\":\"royal\",\"shape\":\"ellipse\",\"at\":[500,258],\"r\":[118,80],\"label\":\"王城区\"} ],');\n            lines.push('  \"ridge\": {\"from\":[400,620],\"to\":[700,500],\"peaks\":7},');\n            lines.push('  \"features\": [ {\"type\":\"castle\",\"at\":[500,258]} ],');\n            lines.push('  \"houses\": [[200,230],[240,225]],');\n            lines.push('  \"trees\": [[70,240],[105,335]],');\n            lines.push('  \"labels\": [ {\"at\":[500,345],\"text\":\"王城区\"} ],');\n            lines.push('  \"markers\": [ {\"emoji\":\"🏰\",\"name\":\"领主城堡\",\"x\":50,\"y\":25,\"desc\":\"一句话描述\"} ]');\n            lines.push('}');\n          }\n          lines.push('');\n          lines.push('## 字段说明');\n          lines.push('- ground：陆地底色，城市与内陆图用 \"field\"，海岛与大陆图用 \"sea\"。');\n          lines.push('- terrain：地形色块，type 取 grass|snow|forest|desert|field|lake；shape 取 ellipse（配 at+r）、rect（配 at+size）或 path（配 d，SVG 路径字符串）。');\n          lines.push('- outline：城市围墙用 {\"shape\":\"roundRect\",\"at\":[x,y],\"size\":[w,h],\"r\":36,\"wall\":true}；大陆海岸线用 {\"shape\":\"path\",\"d\":\"M…Z\",\"land\":true}。');\n          lines.push('- bays：海湾，SVG 闭合路径字符串数组，把大陆轮廓内的区域挖成水面（仅大陆图需要）。');\n          lines.push('- river：单条 SVG 路径字符串；跨河处用 bridges 架桥。');\n          lines.push('- districts：城区色块，type 取 royal|craft|garden|plaza|harbor。');\n          lines.push('- ridge：山脉，自动在 from 与 to 之间排布 peaks 个山峰。');\n          lines.push('- features：特色地物，type 只能取 ' + MMS_MAPART_FEATURE_TYPES.join('|') + '。');\n          lines.push('- houses / trees：批量民居与树木的坐标对数组。');\n          lines.push('- labels：图上的文字地名标注。');\n          lines.push('- markers：玩家可见的交互地标（emoji + 名称 + 描述）。');\n          lines.push('');\n          lines.push('## 布局规则');\n          lines.push('1. 画布 1000×1000：terrain/outline/bays/river/roads/bridges/districts/ridge/features/houses/trees/labels 用 0~1000 画布坐标；markers 的 x/y 用 ' + MMS_COORD_MIN + '~' + MMS_COORD_MAX + ' 的整数（百分比）。');\n          lines.push('2. 每个 marker 必须在对应位置有 features 地物：marker(x,y) 对应画布坐标 (x*10, y*10)，确保 emoji 落在地物上；河流与道路不得压住地标落点。');\n          lines.push('3. 城市图：outline(wall)+towers+gates 组成城墙，districts 分区，roads 主干道，river 可穿城并配 bridges，houses 15~40 个民居，trees 郊野点缀。');\n          lines.push('4. 大陆图：ground=\"sea\"，outline 用 path+land:true 画海岸线，terrain 拼雪原/森林/沙漠/农田/湖泊，ridge 表达山脉，roads 连接主要地标。');\n          lines.push('5. 布局紧凑饱满、疏密有致；地标之间保持距离，不要都挤在中心或边缘。');\n          if (!isPatch) {\n            lines.push(isMini\n              ? '6. markers 控制在 3~8 个，覆盖当前场景内部与近旁的重要位置（房间、设施、出口等）。'\n              : '6. markers 控制在 5~12 个，覆盖剧情中已出现或提及的重要地点。');\n          }\n          return lines.join('\\n');\n        },\n\n        buildMapArtUserPrompt(mode, kind, artCfg, latest, context, locLines, retryHint) {\n          const K = MMS_MAP_KINDS[kind];\n          let p = '';\n          if (artCfg && artCfg.note) {\n            p += '<地图设定备注（优先遵循）>\\n' + artCfg.note + '\\n<\/地图设定备注>\\n\\n';\n          }\n          if (locLines && locLines.length) {\n            p += '<剧情出现过的地点行（按时间顺序，最新在最后）>\\n' + locLines.join('\\n') + '\\n<\/地点行>\\n\\n';\n          }\n          if (context) {\n            p += '<前情提要>\\n' + context + '\\n<\/前情提要>\\n\\n';\n          }\n          if (latest) {\n            p += '<最新剧情>\\n' + latest + '\\n<\/最新剧情>\\n\\n';\n          }\n          const cur = this.art[kind].json;\n          if (mode === 'merge' && cur) {\n            // 增量模式：旧图作为输入（让 AI 知道哪些位置已占），输出只要新增部分\n            p +=\n              '<当前地图 JSON（已经画好，仅供你判断哪些地点已存在、哪些坐标已被占用；不要重复输出其中任何内容）>\\n' +\n              JSON.stringify(cur) +\n              '\\n<\/当前地图>\\n\\n' +\n              '已有地标：' +\n              (cur.markers || []).map((m) => m.name).join('、') +\n              '\\n请找出剧情中出现、但当前地图上还没有的地点，只输出新增部分：{\"add\":{…}}。' +\n              '新地标要避开已占坐标，并在 (x*10, y*10) 处补上对应 features 地物。若没有新地点，输出 {\"add\":{}}。\\n';\n          } else if (kind === 'mini') {\n            p += '请依据以上剧情信息绘制当前场景的小地图（局部平面图）并输出完整 JSON。以最新的地点行为中心，覆盖当前场所的内部布局与近旁重要位置，并为每个位置配置 markers 与对应地物。\\n';\n          } else {\n            p += '请依据以上剧情信息规划一张' + K.label + '并输出完整 JSON。地图必须覆盖剧情中已出现或提及的所有重要地点，并为每个地点配置 markers 与对应地物。\\n';\n          }\n          if (retryHint) {\n            p +=\n              '\\n<上次输出失败原因（务必避免同类错误）>\\n' +\n              retryHint +\n              '\\n<\/上次输出失败原因>\\n请重新输出：严格合法、无注释、无尾随逗号、紧凑单行的 JSON。\\n';\n          }\n          return p;\n        },\n\n        // 字符串感知的 JSON 修复：只在字符串外做结构性修补，字符串内的中文/斜杠/引号一律不动\n        repairJsonText(text) {\n          const src = String(text || '');\n          let out = '';\n          let inStr = false;\n          let esc = false;\n          const notes = [];\n          for (let i = 0; i < src.length; i++) {\n            const c = src[i];\n            if (inStr) {\n              out += c;\n              if (esc) esc = false;\n              else if (c === '\\\\') esc = true;\n              else if (c === '\"') inStr = false;\n              continue;\n            }\n            // 字符串外\n            if (c === '\"') {\n              // 缺失逗号：前一个有效 token 结束后紧跟新字符串\n              const prev = out.replace(/\\s+$/, '').slice(-1);\n              if (prev === '}' || prev === ']' || prev === '\"' || /[0-9a-zA-Z]/.test(prev)) {\n                out += ',';\n                notes.push('补逗号');\n              }\n              out += c;\n              inStr = true;\n              continue;\n            }\n            if (c === '/' && (src[i + 1] === '/' || src[i + 1] === '*')) {\n              // 剥注释\n              if (src[i + 1] === '/') {\n                while (i < src.length && src[i] !== '\\n') i++;\n              } else {\n                i += 2;\n                while (i < src.length && !(src[i] === '*' && src[i + 1] === '/')) i++;\n                i++; // 跳过 '/'\n              }\n              notes.push('剥注释');\n              continue;\n            }\n            if (c === '，' || c === '、') { out += ','; notes.push('全角逗号'); continue; }\n            if (c === '：') { out += ':'; notes.push('全角冒号'); continue; }\n            if (c === '“' || c === '”') {\n              out += '\"';\n              inStr = !inStr;\n              notes.push('全角引号');\n              continue;\n            }\n            if (c === '{' || c === '[') {\n              const prev = out.replace(/\\s+$/, '').slice(-1);\n              if (prev === '}' || prev === ']' || prev === '\"' || /[0-9]/.test(prev)) {\n                out += ',';\n                notes.push('补逗号');\n              }\n              out += c;\n              continue;\n            }\n            if (c === '}' || c === ']') {\n              // 删尾随逗号\n              const trimmed = out.replace(/\\s+$/, '');\n              if (trimmed.slice(-1) === ',') {\n                out = trimmed.slice(0, -1);\n                notes.push('删尾随逗号');\n              }\n              out += c;\n              continue;\n            }\n            out += c;\n          }\n          return { text: out, notes: notes };\n        },\n\n        // 宽松解析：原样 parse 失败则修复后重试一次；失败信息保留 position/line 便于回传给 AI\n        parseJsonLoose(raw, label) {\n          let text = String(raw || '').trim();\n          // \\u0060 = 反引号：字面量三反引号会破坏源文件围栏纪律（首尾自围栏仅 2 处）\n          text = text.replace(/^\\u0060\\u0060\\u0060[a-zA-Z]*\\s*\\n?/, '').replace(/\\n?\\u0060\\u0060\\u0060\\s*$/, '');\n          const first = text.indexOf('{');\n          const last = text.lastIndexOf('}');\n          if (first === -1 || last === -1 || last <= first) {\n            throw new Error('AI 输出中未找到 JSON 对象（可能被截断或返回了纯文本）');\n          }\n          const sliced = text.slice(first, last + 1);\n          try {\n            return JSON.parse(sliced);\n          } catch (e1) {\n            const fixed = this.repairJsonText(sliced);\n            try {\n              const json = JSON.parse(fixed.text);\n              const kinds = [...new Set(fixed.notes)].join('/');\n              console.info('[MMS] ' + (label || '地图') + ' JSON 已自动修复（' + (kinds || '未知') + '）');\n              return json;\n            } catch (e2) {\n              const msg = e1 && e1.message ? e1.message : String(e1);\n              const lineNo = Number((msg.match(/line (\\d+)/) || [])[1]);\n              let excerpt = '';\n              if (lineNo) {\n                const srcLine = sliced.split('\\n')[lineNo - 1];\n                if (srcLine) excerpt = '\\n出错行内容：' + srcLine.slice(0, 200);\n              }\n              throw new Error(msg + excerpt);\n            }\n          }\n        },\n\n        // 整图模式：解析完整地图 JSON\n        parseMapArtOutput(raw) {\n          const json = this.parseJsonLoose(raw, '大地图');\n          if (!json || typeof json !== 'object' || Array.isArray(json)) {\n            throw new Error('JSON 顶层不是对象');\n          }\n          if (!Array.isArray(json.markers) || json.markers.length === 0) {\n            throw new Error('缺少 markers 地标数组');\n          }\n          for (const m of json.markers) {\n            if (!m || !m.name) throw new Error('存在缺少名称的地标');\n          }\n          return json;\n        },\n\n        // 增量模式：解析 patch（{add:{…}, name?}），空 patch 合法\n        parseMapArtPatch(raw) {\n          const json = this.parseJsonLoose(raw, '地图增量');\n          if (!json || typeof json !== 'object' || Array.isArray(json)) {\n            throw new Error('JSON 顶层不是对象');\n          }\n          // 兼容 AI 直接给了裸数组字段（无 add 包裹）或误输出整图\n          let add = json.add && typeof json.add === 'object' && !Array.isArray(json.add) ? json.add : null;\n          if (!add) {\n            const keys = ['markers', 'features', 'terrain', 'roads', 'districts', 'labels', 'bridges', 'houses', 'trees'];\n            if (keys.some((k) => Array.isArray(json[k]))) {\n              add = {};\n              for (const k of keys) if (Array.isArray(json[k])) add[k] = json[k];\n            } else {\n              throw new Error('缺少 add 字段');\n            }\n          }\n          for (const m of add.markers || []) {\n            if (!m || !m.name) throw new Error('新增地标中存在缺少名称的条目');\n          }\n          return { add: add, name: typeof json.name === 'string' ? json.name : null };\n        },\n\n        // 本地合并：纯追加 + 地标按名称去重（旧的胜出），骨架字段不动\n        mergeMapArtPatch(base, patch) {\n          const out = JSON.parse(JSON.stringify(base));\n          const add = (patch && patch.add) || {};\n          const listKeys = ['markers', 'features', 'terrain', 'roads', 'districts', 'labels', 'bridges', 'houses', 'trees'];\n          let added = 0;\n          let dupSkipped = 0;\n          for (const k of listKeys) {\n            const incoming = Array.isArray(add[k]) ? add[k] : [];\n            if (!incoming.length) continue;\n            if (!Array.isArray(out[k])) out[k] = [];\n            if (k === 'markers') {\n              const known = new Set(out[k].map((m) => mmsNormalizeName(m && m.name)).filter(Boolean));\n              for (const m of incoming) {\n                const key = mmsNormalizeName(m && m.name);\n                if (!key || known.has(key)) { dupSkipped++; continue; }\n                known.add(key);\n                out[k].push(m);\n                added++;\n              }\n            } else {\n              out[k] = out[k].concat(incoming);\n              added += incoming.length;\n            }\n          }\n          if (patch && patch.name && String(patch.name).trim()) out.name = String(patch.name).trim();\n          const newMarkers = Array.isArray(add.markers)\n            ? add.markers.filter((m) => m && m.name).map((m) => m.name)\n            : [];\n          return { json: out, added: added, dupSkipped: dupSkipped, newMarkers: newMarkers };\n        },\n\n        sanitizeMapArt(json) {\n          const clamp = (v) =>\n            Math.max(MMS_COORD_MIN, Math.min(MMS_COORD_MAX, Math.round(Number(v) || 50)));\n          const dropped = [];\n          const num = (v) => (typeof v === 'number' ? isFinite(v) : isFinite(Number(v))) ;\n          const isPair = (p) => Array.isArray(p) && p.length >= 2 && num(p[0]) && num(p[1]);\n          const toPair = (p) => [Number(p[0]), Number(p[1])];\n          const isPath = (s) => typeof s === 'string' && /^\\s*[Mm]\\s*-?\\d/.test(s) && s.length < 4000;\n          const cap = (arr, n, label) => {\n            if (!Array.isArray(arr)) return [];\n            if (arr.length > n) dropped.push(label + ' 超量截断 ' + (arr.length - n));\n            return arr.slice(0, n);\n          };\n          const filterValid = (arr, pred, label) => {\n            const before = arr.length;\n            const out = arr.filter(pred);\n            if (out.length < before) dropped.push(label + ' 非法条目 ' + (before - out.length));\n            return out;\n          };\n\n          json.name = String(json.name || '大地图').slice(0, 30);\n          if (json.ground !== 'sea') json.ground = 'field';\n\n          // 地形：ellipse(at+r) / rect(at+size) / path(d)\n          json.terrain = filterValid(\n            cap(json.terrain, 24, 'terrain'),\n            (t) => {\n              if (!t || typeof t !== 'object') return false;\n              if (t.type && MMS_MAPART_TERRAIN_TYPES.indexOf(t.type) === -1) t.type = 'grass';\n              if (t.shape === 'path') return isPath(t.d);\n              if (t.shape === 'rect') return isPair(t.at) && isPair(t.size);\n              t.shape = 'ellipse';\n              return isPair(t.at) && isPair(t.r);\n            },\n            'terrain',\n          );\n          // 路径类：必须是 M 开头的 SVG 路径串\n          json.roads = filterValid(cap(json.roads, 12, 'roads'), isPath, 'roads');\n          json.bays = filterValid(cap(json.bays, 6, 'bays'), isPath, 'bays');\n          if (json.river != null && !isPath(json.river)) {\n            dropped.push('river 非法');\n            delete json.river;\n          }\n          // 轮廓\n          if (json.outline && typeof json.outline === 'object') {\n            const o = json.outline;\n            const ok =\n              o.shape === 'path'\n                ? isPath(o.d)\n                : isPair(o.at) && isPair(o.size);\n            if (!ok) {\n              dropped.push('outline 非法');\n              delete json.outline;\n            } else if (o.shape !== 'path') {\n              o.shape = 'roundRect';\n              o.r = num(o.r) ? Math.max(0, Math.min(200, Number(o.r))) : 30;\n            }\n          } else if (json.outline != null) {\n            delete json.outline;\n          }\n          // 山脉\n          if (json.ridge && typeof json.ridge === 'object') {\n            if (!isPair(json.ridge.from) || !isPair(json.ridge.to)) {\n              dropped.push('ridge 非法');\n              delete json.ridge;\n            } else {\n              json.ridge.peaks = Math.max(2, Math.min(14, Math.round(Number(json.ridge.peaks) || 5)));\n            }\n          } else if (json.ridge != null) {\n            delete json.ridge;\n          }\n          // 桥梁 / 城区\n          json.bridges = filterValid(\n            cap(json.bridges, 8, 'bridges'),\n            (b) => b && typeof b === 'object' && isPair(b.at) && isPair(b.size),\n            'bridges',\n          );\n          json.districts = filterValid(\n            cap(json.districts, 10, 'districts'),\n            (d) => {\n              if (!d || typeof d !== 'object' || !isPair(d.at)) return false;\n              if (d.type && MMS_MAPART_DISTRICT_TYPES.indexOf(d.type) === -1) d.type = 'craft';\n              if (d.shape === 'ellipse') return isPair(d.r);\n              d.shape = 'rect';\n              return isPair(d.size);\n            },\n            'districts',\n          );\n          // 地物：type 必须在渲染器白名单内（否则命中 default 静默空绘）\n          json.features = filterValid(\n            cap(json.features, 90, 'features'),\n            (f) => f && typeof f === 'object' && isPair(f.at) && MMS_MAPART_FEATURE_TYPES.indexOf(f.type) !== -1,\n            'features',\n          );\n          // 坐标对数组\n          json.towers = filterValid(cap(json.towers, 24, 'towers'), isPair, 'towers').map(toPair);\n          json.gates = filterValid(cap(json.gates, 8, 'gates'), isPair, 'gates').map(toPair);\n          json.houses = filterValid(cap(json.houses, 60, 'houses'), isPair, 'houses').map(toPair);\n          json.trees = filterValid(cap(json.trees, 50, 'trees'), isPair, 'trees').map(toPair);\n          // 文字标注\n          json.labels = filterValid(\n            cap(json.labels, 14, 'labels'),\n            (l) => l && typeof l === 'object' && isPair(l.at) && l.text != null && String(l.text).trim(),\n            'labels',\n          ).map((l) => ({ at: toPair(l.at), text: String(l.text).slice(0, 20) }));\n\n          // 地标：清洗 + 按名称去重（旧的/先出现的胜出）\n          const seen = new Set();\n          const marks = [];\n          for (const m of Array.isArray(json.markers) ? json.markers : []) {\n            const name = String((m && m.name) || '').slice(0, 24).trim();\n            if (!name) continue;\n            const key = mmsNormalizeName(name);\n            if (seen.has(key)) { dropped.push('地标重名 ' + name); continue; }\n            seen.add(key);\n            marks.push({\n              emoji: String((m && m.emoji) || '📍').slice(0, 8),\n              name: name,\n              x: clamp(m && m.x),\n              y: clamp(m && m.y),\n              desc: String((m && m.desc) || '').slice(0, 80),\n            });\n            if (marks.length >= 40) { dropped.push('markers 超量截断'); break; }\n          }\n          json.markers = marks;\n\n          if (dropped.length) console.warn('[MMS] 大地图数据清洗：' + dropped.join('；'));\n          return json;\n        },\n\n        // 独立绘图 LLM：kind = 'mini' | 'big'；mode = 'full'（整图重绘） | 'merge'（增量合并）\n        async generateMapArt(kind, mode = 'full') {\n          const K = MMS_MAP_KINDS[kind];\n          if (!K) return false;\n          if (!this.hasGenApi() || !this.hasVarsApi()) {\n            alert('当前酒馆助手版本缺少 generateRaw 或变量接口，无法生成' + K.label);\n            return false;\n          }\n          const st = this.art[kind];\n          if (st.busy) {\n            alert(K.label + '正在生成中，请稍候');\n            return false;\n          }\n          if (mode === 'merge' && !st.json) mode = 'full';\n\n          const floorId = this.floorId != null ? this.floorId : 0;\n          const cfg = this.loadConfig();\n          const artCfg = this.loadRoster()[K.cfgKey] || {};\n\n          st.busy = true;\n          this.refreshMapCard(kind); // 原地显示\"生成中\"状态（不整栏重渲染）\n\n          try {\n            const floorCount = Math.min(10, Math.max(1, Number(cfg.contextFloors) || 2));\n            const { latest, context } = this.collectStorySegments(floorId, floorCount);\n            // 地点行是绘图最关键的输入：固定回溯 10 楼收集（正文直读模式无上下文楼数设置）\n            const locLines = this.collectLocationLines(floorId, 10);\n            const sysPrompt = this.buildMapArtSystemPrompt(mode, kind);\n            // 绘图输出体积远大于状态更新，给足输出余量（仅此次请求生效，不改用户全局设置）\n            const customApi = Object.assign({}, this.buildCustomApi(cfg), {\n              max_tokens: Math.max(Number(cfg.maxTokens) || 4096, 8192),\n            });\n            const baseArt = st.json;\n\n            let lastError = null;\n            let retryHint = null;\n            for (let attempt = 0; attempt < 3; attempt++) {\n              const userPrompt = this.buildMapArtUserPrompt(mode, kind, artCfg, latest, context, locLines, retryHint);\n              try {\n                const config = {\n                  ordered_prompts: [\n                    { role: 'system', content: sysPrompt },\n                    { role: 'user', content: userPrompt },\n                  ],\n                  custom_api: customApi,\n                  should_silence: true,\n                  generation_id: 'mms-mapart-' + kind + '-' + floorId + '-' + Date.now(),\n                };\n                const result = await generateRaw(config);\n                const raw = typeof result === 'string' ? result : (result && result.content) || '';\n\n                let json = null;\n                let okMsg = K.label + '已更新';\n                if (mode === 'merge' && baseArt) {\n                  // 增量：AI 只输出新增部分，本地追加合并（旧图结构上不可能被破坏）\n                  const patch = this.parseMapArtPatch(raw);\n                  const merged = this.mergeMapArtPatch(baseArt, patch);\n                  if (!merged.added && !patch.name) {\n                    // 空 patch 不算失败：剧情确实没有新地点\n                    st.busy = false;\n                    this.refreshMapCard(kind);\n                    alert('本轮未发现地图上缺失的新地点');\n                    return true;\n                  }\n                  json = this.sanitizeMapArt(merged.json);\n                  const parts = [];\n                  if (merged.newMarkers.length) parts.push('新增地标：' + merged.newMarkers.join('、'));\n                  if (merged.dupSkipped) parts.push('跳过重复 ' + merged.dupSkipped + ' 个');\n                  okMsg = parts.length ? K.label + '已更新（' + parts.join('，') + '）' : K.label + '已更新';\n                } else {\n                  json = this.sanitizeMapArt(this.parseMapArtOutput(raw));\n                  // 退化保护：整图重绘结果地标数骤降时让用户决定是否采用\n                  const oldCount = baseArt && baseArt.markers ? baseArt.markers.length : 0;\n                  if (oldCount >= 4 && json.markers.length < Math.ceil(oldCount * 0.5)) {\n                    const go = window.confirm(\
