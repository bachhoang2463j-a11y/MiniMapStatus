<h1>手机 LLM 地图版 · 回归 Harness</h1>
<p>内嵌 MiniMapStatusMobileLLM.html（srcdoc iframe + mock 酒馆 API），覆盖：内置 SVG 模板删除断言 / 设置面板三 tab（地图开关融入 LLM地图）/ 图片管理仅立绘+头像 / 双地图占位卡与 AI 生成（mock generateRaw，大小地图各一张）/ 增量状态与风格切换 / 开关回退列表 / 立绘 / 徽章折叠。</p>

<script>
(function () {
  const WIDGET_HTML = "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n  <head>\n\n        <!-- [新增] 动态立绘渲染引擎 (专属烙印版) -->\n<script>\n(function () {\n  console.log(\"✨ [立绘引擎] 启动：多角色匹配模式\");\n\n  const MAX_ATTEMPTS = 6;\n  const SCAN_INTERVAL = 1200;\n  const QUERY_SELECTOR = \"div, li, section\";\n  let attemptCount = 0;\n  let scanTimer = null;\n\n  function getPortraitMap() {\n    const map = window.PORTRAIT_MAP;\n    if (!map || typeof map !== \"object\" || Object.keys(map).length === 0) {\n      console.log(\"⚠️ [立绘引擎] PORTRAIT_MAP 未就绪或为空，等待下一轮...\");\n      return {};\n    }\n    return map;\n  }\n\nfunction buildPortraitHTML(roleName, portraitUrl) {\n  const isMobile = /Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent);\n\n  // 移动端：左右满幅 + 降低高度，避免“过长”\n  const wrapWidth = isMobile ? \"calc(100%)\" : \"100%\";\n  const wrapMarginX = isMobile ? \"-2px\" : \"0\";\n  const wrapHeight = isMobile ? \"24vh\" : \"40vh\";\n  const wrapMinHeight = isMobile ? \"140px\" : \"240px\";\n  const wrapMaxHeight = isMobile ? \"300px\" : \"7000px\";\n  const imgPos = isMobile ? \"center top\" : \"top\";\n\n  return `\n    <div data-pt-wrapper=\"1\" style=\"\n      position: relative;\n      width: ${wrapWidth};\n      margin-left: ${wrapMarginX};\n      margin-right: ${wrapMarginX};\n      height: ${wrapHeight};\n      min-height: ${wrapMinHeight};\n      max-height: ${wrapMaxHeight};\n      overflow: hidden;\n      -webkit-mask-image: linear-gradient(to bottom, black 68%, transparent 100%);\n      mask-image: linear-gradient(to bottom, black 68%, transparent 100%);\n    \">\n      <img src=\"${portraitUrl}\" alt=\"${roleName}\" style=\"\n        width: 100%;\n        height: 100%;\n        object-fit: cover;\n        object-position: ${imgPos};\n        display: block;\n      \">\n    <\/div>\n  `;\n}\n\n  function matchPortraitUrl(rawTag, map) {\n    const clean = rawTag.replace(/\\s+/g, '');\n    if (map[clean]) return { name: clean, url: map[clean] };\n    if (map[rawTag]) return { name: rawTag, url: map[rawTag] };\n    const matchedKey = Object.keys(map).find((k) => k === clean || clean.includes(k) || k.includes(clean));\n    if (matchedKey) return { name: matchedKey, url: map[matchedKey] };\n    return null;\n  }\n\n  function scanAllRoles() {\n    attemptCount++;\n    const map = getPortraitMap();\n    const entries = Object.entries(map);\n\n    console.log(`🧭 [立绘引擎] 第 ${attemptCount}/${MAX_ATTEMPTS} 轮扫描 (单次DOM遍历模式)`);\n\n    if (!entries.length) {\n      if (attemptCount < MAX_ATTEMPTS) scheduleNextScan();\n      return;\n    }\n\n    // textContent 不触发强制重排（innerText 在大 DOM 上会迫使全文档 reflow）\n    const bodyText = document.body ? document.body.textContent || \"\" : \"\";\n    if (!bodyText.includes(\"【立绘\") && !bodyText.includes(\"【 立绘\")) {\n      if (attemptCount < MAX_ATTEMPTS) {\n        scheduleNextScan();\n      } else {\n        console.log(\"🛌 [立绘引擎] 达到最大轮次，停止扫描。\");\n      }\n      return;\n    }\n\n    const allElements = document.querySelectorAll(QUERY_SELECTOR);\n    const tagRegex = /【\\s*立绘\\s*([^】]+)\\s*】/g;\n    let replacedCount = 0;\n\n    allElements.forEach((el) => {\n      if (el.getAttribute(\"data-pt-role\") || el.querySelector('[data-pt-wrapper=\"1\"]')) return;\n\n      const txt = el.textContent || \"\";\n      if (!txt.includes(\"【立绘\") && !txt.includes(\"【 立绘\")) return;\n\n      const hasMatchingChild = Array.from(el.children).some((child) => {\n        const cTxt = child.textContent || \"\";\n        return cTxt.includes(\"【立绘\") || cTxt.includes(\"【 立绘\");\n      });\n      if (hasMatchingChild) return;\n\n      let match;\n      tagRegex.lastIndex = 0;\n      while ((match = tagRegex.exec(txt)) !== null) {\n        const rawRole = match[1].trim();\n        const found = matchPortraitUrl(rawRole, map);\n        if (found) {\n          console.log(`✅ [立绘引擎] 锁定并渲染角色：${found.name}（原始标签：${rawRole}）`, el);\n          el.setAttribute(\"data-pt-role\", found.name);\n\n          Array.from(el.children).forEach((child) => {\n            if (child.tagName !== \"SCRIPT\" && child.tagName !== \"STYLE\") {\n              child.style.display = \"none\";\n            }\n          });\n\n          Array.from(el.childNodes).forEach((node) => {\n            if (node.nodeType === 3) node.textContent = \"\";\n          });\n\n          el.style.cssText +=\n            \"padding:0 !important;border:none !important;background:transparent !important;box-shadow:none !important;display:block !important;overflow:hidden !important;\";\n\n          const holder = document.createElement(\"div\");\n          holder.innerHTML = buildPortraitHTML(found.name, found.url);\n          el.appendChild(holder.firstElementChild);\n\n          replacedCount++;\n          break;\n        }\n      }\n    });\n\n    console.log(`📊 [立绘引擎] 本轮结果：匹配并替换 ${replacedCount} 处立绘`);\n\n    if (attemptCount < MAX_ATTEMPTS) {\n      scheduleNextScan();\n    } else {\n      console.log(\"🛌 [立绘引擎] 达到最大轮次，停止扫描。\");\n    }\n  }\n\n  function scheduleNextScan() {\n    clearTimeout(scanTimer);\n    scanTimer = setTimeout(scanAllRoles, SCAN_INTERVAL);\n  }\n\n  const observer = new MutationObserver(() => {\n    if (attemptCount >= MAX_ATTEMPTS) {\n      // 轮次耗尽后断开监听：此后状态栏的整栏重绘不再空触发回调\n      observer.disconnect();\n      return;\n    }\n    console.log(\"♻️ [立绘引擎] DOM 发生变化，重新排队扫描\");\n    scheduleNextScan();\n  });\n\n  function startEngine() {\n    observer.observe(document.body, { childList: true, subtree: true, characterData: true });\n    scheduleNextScan();\n  }\n\n  if (document.readyState === \"loading\") {\n    document.addEventListener(\"DOMContentLoaded\", startEngine);\n  } else {\n    startEngine();\n  }\n})();\n<\/script>\n\n\n        \n        \n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <title>故事情情节状态<\/title>\n    <style>\n/* ==== INLINE-DEP font-awesome START（build_inline_deps.mjs 生成的 31 图标子集，新增图标后重跑） ==== */\n/* FA_SUBSET_CODE 5rem;\n  margin: 0.25rem 0;\n  border-radius: 6px;\n  background: linear-gradient(135deg, rgba(157, 124, 245, 0.08) 0%, rgba(157, 124, 245, 0.03) 100%);\n  border: 1px solid rgba(157, 124, 245, 0.15);\n  transition: all 0.25s ease;\n}\n.character-entry:hover {\n  background: linear-gradient(135deg, rgba(157, 124, 245, 0.15) 0%, rgba(157, 124, 245, 0.08) 100%);\n  border-color: rgba(157, 124, 245, 0.3);\n  transform: translateX(2px);\n}\n.character-entry .char-emoji {\n  font-size: 0.85rem;\n  margin-right: 0.4rem;\n  flex-shrink: 0;\n}\n.character-entry .char-content {\n  flex: 1;\n  min-width: 0;\n}\n/* 【】包裹的名字 - 更紧凑 */\n.char-name {\n  font-weight: 600;\n  font-size: 0.75rem;\n  color: rgba(255, 255, 255, 0.95);\n  background: linear-gradient(135deg, rgba(168, 139, 247, 0.25) 0%, rgba(139, 108, 224, 0.18) 100%);\n  padding: 0.1rem 0.4rem;\n  border-radius: 4px;\n  border: 1px solid rgba(168, 139, 247, 0.4);\n  display: inline-block;\n  margin-right: 0.3rem;\n  box-shadow: 0 1px 4px rgba(157, 124, 245, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);\n  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);\n  letter-spacing: 0.01em;\n}\n/* []包裹的标签 - 更小更紧凑，确保不换行 */\n.char-tag {\n  font-size: 0.6rem;\n  font-weight: 500;\n  color: #8C8476;\n  background: rgba(255, 255, 255, 0.06);\n  padding: 0.05rem 0.3rem;\n  border-radius: 3px;\n  border: 1px solid rgba(255, 255, 255, 0.12);\n  display: inline-block;\n  margin-right: 0.2rem;\n  margin-top: 0;\n  line-height: 1.3;\n  white-space: nowrap;\n  vertical-align: middle;\n}\n.char-name {\n  /* ...保留原有样式... */\n  white-space: nowrap;\n  vertical-align: middle;\n}\n/* 描述文字 */\n.char-desc {\n  font-size: 0.7rem;\n  color: #8C8476;\n  margin-top: 0.2rem;\n  line-height: 1.35;\n  display: block;\n}\n\n/* 分类标题样式 - 紧凑版 */\n.char-category {\n  display: flex;\n  align-items: center;\n  font-size: 0.7rem;\n  font-weight: 600;\n  color: rgba(157, 124, 245, 0.9);\n  margin-top: 0.5rem;\n  margin-bottom: 0.2rem;\n  padding-left: 0.2rem;\n}\n.char-category::before {\n  content: '';\n  width: 2px;\n  height: 10px;\n  background: linear-gradient(180deg, rgba(157, 124, 245, 0.8), rgba(157, 124, 245, 0.3));\n  border-radius: 1px;\n  margin-right: 0.4rem;\n}\n\n/* 盟友条目 */\n.character-entry.ally-entry {\n  background: linear-gradient(135deg, rgba(74, 222, 128, 0.1) 0%, rgba(34, 197, 94, 0.05) 100%);\n  border-color: rgba(74, 222, 128, 0.2);\n}\n.character-entry.ally-entry:hover {\n  background: linear-gradient(135deg, rgba(74, 222, 128, 0.18) 0%, rgba(34, 197, 94, 0.1) 100%);\n  border-color: rgba(74, 222, 128, 0.35);\n}\n.character-entry.ally-entry .char-name {\n  background: linear-gradient(135deg, rgba(74, 222, 128, 0.25) 0%, rgba(34, 197, 94, 0.18) 100%);\n  border-color: rgba(74, 222, 128, 0.45);\n  box-shadow: 0 1px 4px rgba(34, 197, 94, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);\n}\n\n/* NPC条目 */\n.character-entry.npc-entry {\n  background: linear-gradient(135deg, rgba(251, 191, 36, 0.1) 0%, rgba(245, 158, 11, 0.05) 100%);\n  border-color: rgba(251, 191, 36, 0.2);\n}\n.character-entry.npc-entry:hover {\n  background: linear-gradient(135deg, rgba(251, 191, 36, 0.18) 0%, rgba(245, 158, 11, 0.1) 100%);\n  border-color: rgba(251, 191, 36, 0.35);\n}\n.character-entry.npc-entry .char-name {\n  background: linear-gradient(135deg, rgba(251, 191, 36, 0.25) 0%, rgba(245, 158, 11, 0.18) 100%);\n  border-color: rgba(251, 191, 36, 0.45);\n  box-shadow: 0 1px 4px rgba(245, 158, 11, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);\n}\n\n/* 敌人条目 */\n.character-entry.enemy-entry {\n  background: linear-gradient(135deg, rgba(248, 113, 113, 0.12) 0%, rgba(239, 68, 68, 0.06) 100%);\n  border-color: rgba(248, 113, 113, 0.25);\n}\n.character-entry.enemy-entry:hover {\n  background: linear-gradient(135deg, rgba(248, 113, 113, 0.2) 0%, rgba(239, 68, 68, 0.12) 100%);\n  border-color: rgba(248, 113, 113, 0.4);\n}\n.character-entry.enemy-entry .char-name {\n  background: linear-gradient(135deg, rgba(248, 113, 113, 0.3) 0%, rgba(239, 68    position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);\n            width: 20px; height: 8px; background: rgba(0,0,0,0.4); border-radius: 50%;\n            animation: shadow-pulse 2s ease-in-out infinite;\n            z-index: 1; pointer-events: none;\n        }\n        .map-marker:nth-child(2n) .marker-shadow { animation-delay: 0.3s; animation-duration: 2.2s; }\n        .map-marker:nth-child(3n) .marker-shadow { animation-delay: 0.7s; animation-duration: 1.8s; }\n\n        /* 选中时的光圈 */\n        .marker-pulse { position: absolute; inset: -8px; border-radius: 50%; border: 3px dashed #fbbf24; transform: scale(0); transition: all 0.3s; opacity: 0; }\n        .map-marker.active .marker-pulse { animation: select-spin 4s linear infinite; opacity: 1; transform: scale(1); }\n        .map-marker.active .marker-emoji { filter: drop-shadow(0px 0px 8px #fbbf24); }\n        \n        /* 复古 Tooltip 适配多环境 */\n        .map-tooltip { \n            position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%) translateY(-10px); \n            background: rgba(30, 30, 40, 0.9); color: #fff; padding: 4px 8px; border: 2px solid #5a6988; border-radius: 0px; \n            font-size: 0.75rem; font-weight: bold; white-space: nowrap; pointer-events: none; opacity: 0; \n            transition: opacity 0.2s, transform 0.2s; box-shadow: 4px 4px 0 rgba(0,0,0,0.3);\n        }\n        .map-marker:hover .map-tooltip { opacity: 1; transform: translateX(-50%) translateY(-15px); }\n        \n        /* 复古弹窗面板 */\n        .map-info-panel { \n            position: absolute; bottom: 10px; left: 10px; right: 10px; \n            background: #181425; border: 4px solid #3a4466; border-radius: 4px; padding: 6px 10px; z-index: 50; cursor: pointer; \n            transform: translateY(150%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); \n            pointer-events: auto; box-shadow: 0 8px 16px rgba(0,0,0,0.6);\n        }\n        \n        .map-info-panel. tton>\n              <button class=\"theme-dot-btn\" data-theme=\"day\" title=\"白天 (☼)\" type=\"button\"><i class=\"fa fa-sun-o\"><\/i><\/button>\n              <button class=\"theme-dot-btn\" data-theme=\"jade\" title=\"血色 (🗡)\" type=\"button\"><i class=\"fa fa-leaf\"><\/i><\/button>\n              <button class=\"theme-dot-btn\" data-theme=\"classic\" title=\"古典 (📖)\" type=\"button\"><i class=\"fa fa-book\"><\/i><\/button>\n              <button class=\"theme-dot-btn\" data-theme=\"night\" title=\"黑夜 (🌙)\" type=\"button\"><i class=\"fa fa-moon-o\"><\/i><\/button>\n              <button class=\"theme-dot-btn\" data-theme=\"fresh\" title=\"清新 (🍃)\" type=\"button\"><i class=\"fa fa-envira\"><\/i><\/button>\n            <\/div>\n          <\/div>\n\n          <!-- 显示模式（沿用现有 radio 机制） -->\n          <div class=\"settings-group\">\n            <label class=\"settings-label\">显示模式<\/label>\n            <div class=\"display-mode-options\">\n              <label class=\"display-mode-option\">\n                <input type=\"radio\" name=\"display-mode\" value=\"integrated\" id=\"integrated-mode\" />\n                <span class=\"radio-custom\"><\/span>\n                <div class=\"option-content\">\n                  <span class=\"option-title\">一体式美化<\/span>\n                  <span class=\"option-desc\">显示完整的故事内容和状态信息<\/span>\n                <\/div>\n              <\/label>\n              <label class=\"display-mode-option\">\n                <input type=\"radio\" name=\"display-mode\" value=\"status-only\" id=\"status-only-mode\" checked />\n                <span class=\"radio-custom\"><\/span>\n                <div class=\"option-content\">\n                  <span class=\"option-title\">美化状态栏<\/span>\n                  <span class=\"option-desc\">仅显示状态信息，隐藏正文内容<\/span>\n                <\/div>\n              <\/label>\n            <\/div>\n          <\/div>\n\n          <!-- 徽章折叠字符数（用户设置） -->\n          <div class=\"flex items-center justify-between py-1\">\n            <div>\n              <span class=\"text-xs font-bold text-gray-300 block\">徽章折叠字符数<\/span>\n              <span class=\"text-[10px] text-gray-400\">单行累计字符超过该值即折叠<\/span>\n            <\/div>\n            <div class=\"flex items-center gap-1.5\">\n              <button id=\"foldchar-minus\" class=\"w-6 h-6 rounded bg-black/10 text-gray-300 font-bold text-xs flex items-center justify-center hover:bg-primary/20\" type=\"button\" aria-label=\"减少字符数\">−<\/button>\n              <span id=\"foldchar-value\" class=\"text-xs font-bold px-1.5 text-primary\">40<\/span>\n              <button id=\"foldchar-plus\" class=\"w-6 h-6 rounded bg-black/10 text-gray-300 font-bold text-xs flex items-center justify-center hover:bg-primary/20\" type=\"button\" aria-label=\"增加字符数\">+<\/button>\n            <\/div>\n          <\/div>\n          <p class=\"settings-hint\">徽章按显示顺序累计字符数（含间隙），超过该值的部分折叠为\"+N\"，点开可展开/收起；数值越小折叠越早，越大越宽松（按你的字体与屏宽自行校准）<\/p>\n\n          <!-- 行动选项点击处理 -->\n          <div class=\"settings-group\">\n            <label class=\"settings-label\">行动选项点击处理<\/label>\n            <div class=\"action-mode-options\">\n              <label class=\"action-mode-option\">\n                <input type=\"radio\" name=\"action-mode\" value=\"send-to-chat\" id=\"send-to-chat-mode\" checked />\n                <span class=\"radio-custom\"><\/span>\n                <div class=\"option-content\">\n                  <span class=\"option-title\">发送到酒馆聊天框<\/span>\n                  <span class=\"option-desc\">点击后将选项文本添加到聊天输入框中<\/span>\n                <\/div>\n              <\/label>\n              <label class=\"action-mode-option\">\n                <input type=\"radio\" name=\"action-mode\" value=\"direct-execute\" id=\"direct-execute-mode\" />\n                <span class=\"radio-custom\"><\/span>\n                <div class=\"option-content\">\n                  <span class=\"option-title\">点击直接执行<\/span>\n                  <span class=\"option-desc\">点击后立即发送消息并触发回复<\/span>\n                <\/div>\n              <\/label>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- ============================================================ -->\n        <!-- Tab 2：LLM地图（绘图 AI 接口 + 大小地图开关与设定） -->\n        <!-- ============================================================ -->\n        <div id=\"tab-content-ai\" class=\"p-3.5 space-y-3\" style=\"display: none\">\n          <!-- API 预设（下拉栏 + 增删改 + 文件导入导出） -->\n          <div class=\"settings-group\">\n            <div class=\"flex justify-between items-center mb-2\">\n              <label class=\"settings-label\">独立绘图 AI 接口<\/label>\n              <div class=\"flex gap-1\">\n                <button id=\"mms-api-add\" class=\"mms-btn\" type=\"button\" title=\"新建 API 预设\" style=\"padding: 2px 8px\"><i class=\"fa fa-plus\"><\/i><\/button>\n                <button id=\"mms-api-import\" class=\"mms-btn\" type=\"button\" title=\"导入 JSON 文件\" style=\"padding: 2px 8px\"><i class=\"fa fa-download\"><\/i><\/button>\n                <button id=\"mms-api-export\" class=\"mms-btn\" type=\"button\" title=\"导出当前预设为 JSON 文件\" style=\"padding: 2px 8px\"><i class=\"fa fa-upload\"><\/i><\/button>\n              <\/div>\n            <\/div>\n            <div class=\"flex gap-1.5 mb-2\">\n              <select id=\"mms-api-preset-select\" class=\"form-input\" style=\"flex: 1\"><\/select>\n              <button id=\"mms-api-rename\" class=\"mms-btn\" type=\"button\" title=\"重命名\" style=\"padding: 2px 10px\"><i class=\"fa fa-pencil\"><\/i><\/button>\n              <button id=\"mms-api-delete\" class=\"mms-btn\" type=\"button\" title=\"删除\" style=\"padding: 2px 10px\"><i class=\"fa fa-trash-o\"><\/i><\/button>\n            <\/div>\n            <div class=\"mms-field\">\n              <label for=\"mms-api-source\">API 源<\/label>\n              <select id=\"mms-api-source\">\n                <option value=\"custom\">自定义 (OpenAI 兼容)<\/option>\n                <option value=\"openai\">OpenAI<\/option>\n                <option value=\"deepseek\">DeepSeek<\/option>\n                <option value=\"openrouter\">OpenRouter<\/option>\n                <option value=\"claude\">Claude<\/option>\n                <option value=\"makersuite\">Google MakerSuite<\/option>\n                <option value=\"xai\">xAI (Grok)<\/option>\n              <\/select>\n            <\/div>\n            <div class=\"mms-field\">\n              <label for=\"mms-api-url\">API 地址（端点）<\/label>\n              <input id=\"mms-api-url\" type=\"text\" placeholder=\"https://api.example.com/v1（留空使用当前酒馆连接）\" spellcheck=\"false\" />\n            <\/div>\n            <div class=\"grid grid-cols-2 gap-2\">\n              <div class=\"mms-field\">\n                <label for=\"mms-api-key\">API 密钥<\/label>\n                <input id=\"mms-api-key\" type=\"password\" placeholder=\"sk-...\" spellcheck=\"false\" />\n              <\/div>\n              <div class=\"mms-field\">\n                <label for=\"mms-api-model\">模型名称<\/label>\n                <div class=\"flex gap-1.5\">\n                  <input id=\"mms-api-model\" type=\"text\" placeholder=\"例：deepseek-chat\" spellcheck=\"false\" style=\"flex: 1\" />\n                  <button id=\"mms-fetch-models\" class=\"mms-btn\" type=\"button\" title=\"从 API 地址拉取可用模型列表（需先填写 API 地址）\" style=\"padding: 2px 10px\"><i class=\"fa fa-download\"><\/i><\/button>\n                <\/div>\n                <select id=\"mms-model-select\" style=\"display: none; margin-top: 6px\" title=\"点击选择拉取到的模型\"><\/select>\n              <\/div>\n            <\/div>\n            <div class=\"mms-field\">\n              <label for=\"mms-api-preset\">酒馆代理预设（可选）<\/label>\n              <input id=\"mms-api-preset\" type=\"text\" placeholder=\"预设名称，优先于地址/密钥\" spellcheck=\"false\" />\n            <\/div>\n            <div class=\"grid grid-cols-3 gap-2\">\n              <div class=\"mms-field\">\n                <label for=\"mms-api-temperature\">温度<\/label>\n                <input id=\"mms-api-temperature\" type=\"number\" min=\"0\" max=\"2\" step=\"0.1\" placeholder=\"0.3\" />\n              <\/div>\n              <div class=\"mms-field\">\n                <label for=\"mms-api-max-tokens\">最大 tokens<\/label>\n                <input id=\"mms-api-max-tokens\" type=\"number\" min=\"256\" max=\"32000\" step=\"256\" placeholder=\"4096\" />\n              <\/div>\n              <div class=\"mms-field\">\n                <label for=\"mms-api-top-p\">Top P<\/label>\n                <input id=\"mms-api-top-p\" type=\"number\" min=\"0\" max=\"1\" step=\"0.05\" placeholder=\"1\" />\n              <\/div>\n            <\/div>\n            <p class=\"settings-hint\">此接口仅用于大小地图的 AI 绘制（生成/更新地图底图与地标），状态栏数据仍从正文 Status_block 直读；默认预设（当前酒馆连接）不可删除，新建预设自动复制当前配置<\/p>\n          <\/div>\n\n          <!-- 双地图（AI 绘制）：开关 + 风格 + 设定备注 -->\n          <div class=\"roster-surface rounded-xl border border-gray-700/10 p-2.5 space-y-2\">\n            <div class=\"flex gap-4\">\n              <label class=\"mms-toggle-row\">\n                <input type=\"checkbox\" id=\"mms-map-minimap\" checked />\n                <span class=\"text-xs font-bold\">🗺️ 小地图（当前场景平面图）<\/span>\n              <\/label>\n              <label class=\"mms-toggle-row\">\n                <input type=\"checkbox\" id=\"mms-map-bigmap\" checked />\n                <span class=\"text-xs font-bold\">🌍 大地图（区域/全局场景图）<\/span>\n              <\/label>\n            <\/div>\n            <div id=\"mms-miniart-form\" class=\"space-y-2\">\n              <div class=\"flex gap-2 items-center\">\n                <span class=\"text-[11px] text-gray-400 w-14 shrink-0\">小地图风格<\/span>\n                <select id=\"mms-miniart-style\" class=\"form-input flex-1 text-xs\" style=\"height: 28px\">\n                  <option value=\"flat\">简约平面（色块+线条）<\/option>\n                  <option value=\"parchment\">手绘羊皮纸<\/option>\n                <\/select>\n              <\/div>\n              <textarea\n                id=\"mms-miniart-note\"\n                class=\"form-input w-full text-xs\"\n                rows=\"2\"\n                placeholder=\"小地图设定备注（可选）：当前场景的空间设定/风格要求，绘图 AI 会优先遵循。例：酒店共三层，当前在二楼总统套房，走廊尽头是电梯…\"\n              ><\/textarea>\n            <\/div>\n            <div id=\"mms-bigart-form\" class=\"space-y-2\">\n              <div class=\"flex gap-2 items-center\">\n                <span class=\"text-[11px] text-gray-400 w-14 shrink-0\">大地图风格<\/span>\n                <select id=\"mms-bigart-style\" class=\"form-input flex-1 text-xs\" style=\"height: 28px\">\n                  <option value=\"flat\">简约平面（色块+线条）<\/option>\n                  <option value=\"parchment\">手绘羊皮纸<\/option>\n                <\/select>\n              <\/div>\n              <textarea\n                id=\"mms-bigart-note\"\n                class=\"form-input w-full text-xs\"\n                rows=\"3\"\n                placeholder=\"大地图设定备注（可选）：粘贴区域设定/世界书摘录，绘图 AI 会优先遵循。例：故事发生在1925年的悉尼，主要区域有环形码头、岩石区、总督府…\"\n              ><\/textarea>\n            <\/div>\n            <p class=\"settings-hint\">\n              开关开启后：地图卡片由上方绘图 AI 生成「布局+地标」语义 JSON（约 1K tokens/次，每个聊天首次手动生成，之后缓存零开销），\n              本地渲染成图并缓存到聊天变量；小地图=当前场景平面，大地图=区域全局。\n              生成与更新按钮在地图卡片上（更新=增量合并保留旧图，重绘=整图重来），风格可随时免费切换。\n            <\/p>\n          <\/div>\n        <\/div>\n\n        <!-- ============================================================ -->\n        <!-- Tab 3：图片管理（内置图片表增删改，保存写回正则源码） -->\n        <!-- ============================================================ -->\n        <div id=\"tab-content-images\" class=\"p-3.5 space-y-3\" style=\"display: none\">\n          <!-- 头部：说明 + 保存/复制/导出/导入 -->\n          <div class=\"flex flex-wrap justify-between items-center gap-2 roster-surface rounded-xl border border-gray-700/10 px-3 py-2\">\n            <div class=\"min-w-[140px]\">\n              <span class=\"text-xs font-bold text-gray-300 flex items-center gap-1.5\">\n                <i class=\"fa fa-picture-o text-primary\"><\/i> 内置图片库\n                <span id=\"mms-img-dirty\" class=\"mms-count-badge\" style=\"display: none\">未保存 0 项<\/span>\n              <\/span>\n              <p class=\"text-[10px] text-gray-400 mt-0.5\">\n                立绘 / 头像链接内置于页面源码，修改立即生效；点「保存到源码」写回正则，随正则一起导出迁移\n              <\/p>\n            <\/div>\n            <div class=\"flex items-center gap-1.5 flex-shrink-0\">\n              <button\n                id=\"mms-img-save\"\n                class=\"px-2.5 py-1.5 rounded-xl bg-primary text-white text-xs font-semibold hover:opacity-90 shadow-sm transition-all\"\n                type=\"button\"\n              >\n                <i class=\"fa fa-save mr-1\"><\/i>保存到源码\n              <\/button>\n              <button id=\"mms-img-copy\" class=\"mms-btn\" type=\"button\" title=\"复制标记块代码，可粘贴回本地 MiniMapStatusMobileLLM.html 同步\">复制配置<\/button>\n              <button id=\"mms-img-export\" class=\"mms-btn\" type=\"button\" title=\"导出为 JSON 文件备份\">导出<\/button>\n              <button id=\"mms-img-import\" class=\"mms-btn\" type=\"button\" title=\"从 JSON 文件导入\">导入<\/button>\n            <\/div>\n          <\/div>\n\n          <!-- 分类切换 + 搜索 -->\n          <div class=\"flex items-center gap-2 flex-wrap\">\n            <button class=\"mms-img-cat-btn active\" type=\"button\" data-cat=\"portrait\">\n              🖼 立绘 <span id=\"mms-img-count-portrait\">0<\/span>\n            <\/button>\n            <button class=\"mms-img-cat-btn\" type=\"button\" data-cat=\"avatar\">\n              👤 小头像 <span id=\"mms-img-count-avatar\">0<\/span>\n            <\/button>\n            <input id=\"mms-img-search\" class=\"form-input flex-1\" style=\"min-width: 110px\" placeholder=\"搜索名称/链接…\" />\n          <\/div>\n\n          <!-- 条目列表 -->\n          <div id=\"mms-img-list\" class=\"space-y-1.5\"><\/div>\n\n          <!-- 新增行 -->\n          <div class=\"flex gap-1.5 items-center\">\n            <input id=\"mms-img-new-name\" class=\"form-input\" style=\"width: 128px\" placeholder=\"名称（角色名/地图名）\" />\n            <input id=\"mms-img-new-url\" class=\"form-input flex-1\" style=\"min-width: 0\" placeholder=\"图片链接 https://…\" />\n            <button id=\"mms-img-add\" class=\"mms-btn mms-btn-primary flex-shrink-0\" type=\"button\">\n              <i class=\"fa fa-plus\"><\/i> 添加\n            <\/button>\n          <\/div>\n          <p id=\"mms-img-status\" class=\"text-[10px] text-primary\" style=\"display: none\"><\/p>\n          <p class=\"settings-hint\">\n            立绘按角色名匹配（含「弗兰克脱衣」等状态变体）；小头像按角色名匹配小地图标记。\n            链接需以 http(s):// 开头；保存前刷新页面即可撤销全部修改。\n          <\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <script>\n      // [扩展] 内置图片表：立绘 portrait / 小头像 avatar\n      // 由「设置 → 图片管理」页签维护；「保存到源码」会整体重写标记块之间的内容，请勿改动两行标记注释\n      /* ==== MMS_IMAGE_DATA_START ==== */\nwindow.MMS_IMAGE_DATA = {\n  \"portrait\": {\n    \"弗兰克\": \"https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/立绘/弗兰克穿衣2_compressed.jpg\",\n    \"弗兰克脱衣\": \"https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/立绘/弗兰克脱衣2_compressed.jpg\",\n    \"弗兰克全裸\": \"https://imgur.la/images/2026/09/02/_compressedc598ebc34dd37cce.jpg\",\n    \"埃利奥特\": \"https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/立绘/埃利奥特_compressed.jpg\",\n    \"玛德琳\": \"https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/立绘/玛德琳_compressed.jpg\",\n    \"阴茎射后\": \"https://www.imgur.la/images/2026/03/13/0d9533d2f58683fe9efa9defcff69687.jpg\",\n    \"阴茎疲软\": \"https://www.imgur.la/images/2026/03/13/2.jpg\",\n    \"阴茎全勃\": \"https://www.imgur.la/images/2026/03/13/a54ae93f120b1da93b2bb55d3897762e.jpg\",\n    \"阴茎取精仪疲软\": \"https://www.imgur.la/images/2026/03/13/db221a5e38158e6491efb3f0703f5347.jpg\",\n    \"阴茎取精仪勃起\": \"https://www.imgur.la/images/2026/03/13/46b916ebbc97c0e17fc417d6ed3630a6.jpg\",\n    \"阴茎前勃\": \"https://www.imgur.la/images/2026/03/13/a82ddd776ef96e92b0d01b171a380ede.jpg\",\n    \"阴茎斜勃\": \"https://www.imgur.la/images/2026/03/13/dbab00693cf6003edbe8340ec2f5b184.jpg\",\n    \"阴茎勃起\": \"https://www.imgur.la/images/2026/03/13/42ec8c7a7ae8eba87328596c4c87bbc9.jpg\",\n    \"阴茎微勃\": \"https://www.imgur.la/images/2026/03/13/d346720db1cb6fdb9d2fec4bf5f8386a.jpg\",\n    \"阴茎半勃\": \"https://www.imgur.la/images/2026/03/13/6fbc63343f057109b7ad2cdf1d8af8d6.jpg\",\n    \"军人裸上身\": \"https://www.imgur.la/images/2026/03/13/Gemini_Generated_Image_jx5pd4jx5pd4jx5p_compressed.jpg\",\n    \"军人穿衣\": \"https://imgur.la/images/2026/03/13/Gemini_Generated_Image_qjdewmqjdewmqjde_compressed.jpg\",\n    \"军人全裸\": \"https://imgur.la/images/2026/03/13/_compressed.jpg\",\n    \"向震虎\": \"https://www.imgur.la/images/2026/04/12/_2026-02-2709h39m30s714msb76746a7791c8e01.png\",\n    \"向震虎(投篮)\": \"https://www.imgur.la/images/2026/03/02/xiangzhen.jpg\"\n  },\n  \"avatar\": {\n    \"埃利奥特\": \"https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/头像/Eil.png\",\n    \"弗兰克\": \"https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/头像/Frank.png\",\n    \"玛德琳\": \"https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/头像/chen.png\",\n    \"洪雷威\": \"https://www.imgur.la/images/2026/03/01/AHongF.jpg\",\n    \"周云\": \"https://www.imgur.la/images/2026/03/01/ZhouyunF.jpg\",\n    \"向震虎\": \"https://www.imgur.la/images/2026/03/03/xiang.jpg\",\n    \"江魁锋\": \"https://imgur.la/images/2026/08/26/junren.png\",\n    \"赵伟国\": \"https://imgur.la/images/2026/08/26/junren.png\",\n    \"邱成钢\": \"https://imgur.la/images/2026/08/26/junren.png\",\n    \"赵震涛\": \"https://imgur.la/images/2026/08/26/junren.png\"\n  }\n};\n      /* ==== MMS_IMAGE_DATA_END ==== */\n\n      // 源码载入时的原始快照：图片管理页签据此计算未保存差异（必须先于任何 UI 代码捕获）\n      window.MMS_IMAGE_DATA_BASE = JSON.parse(JSON.stringify(window.MMS_IMAGE_DATA));\n\n      // 图片数据标记块定位（供「保存到源码」精确替换；惰性匹配到第一处 END 标记即止）\n      const MMS_IMG_BLOCK_RE = /\\/\\* ==== MMS_IMAGE_DATA_START[\\s\\S]*?MMS_IMAGE_DATA_END ==== \\*\\//;\n\n      // 既有引用保持兼容：绑定只读，内容仍可变（图片管理运行时原位写键）\n      window.PORTRAIT_MAP = window.MMS_IMAGE_DATA.portrait;\n      const AVATAR_MAP = window.MMS_IMAGE_DATA.avatar;\n\n      // ---------- 图片管理（设置 → 图片管理页签；自最新版移植） ----------\n      // imageData：编辑工作副本（保存时写回正则源码）\n      // imageBase：源码载入基线（MMS_IMAGE_DATA_BASE，仅保存成功后更新），两者差异 = 未保存项\n      const MMS_IMG = {\n        imageCats: [\n          { key: 'portrait', label: '立绘' },\n          { key: 'avatar', label: '小头像' },\n        ],\n        imageCat: 'portrait',\n        imageData: null,\n        imageBase: null,\n        imageSearch: '',\n\n        hasRegexApi() {\n          return typeof getTavernRegexes === 'function' && typeof replaceTavernRegexes === 'function';\n        },\n\n        // ---------- 预设 JSON 文件导入/导出 ----------\n        exportPresetFile(data, filename) {\n          try {\n            const json = JSON.stringify(data, null, 2);\n            const blob = new Blob([json], { type: 'application/json' });\n            const url = URL.createObjectURL(blob);\n            const a = document.createElement('a');\n            a.href = url;\n            a.download = filename;\n            document.body.appendChild(a);\n            a.click();\n            document.body.removeChild(a);\n            setTimeout(() => URL.revokeObjectURL(url), 1000);\n          } catch (e) {\n            alert('导出失败：' + e.message);\n          }\n        },\n\n        importPresetFile(accept, callback) {\n          const input = document.createElement('input');\n          input.type = 'file';\n          input.accept = accept;\n          input.style.display = 'none';\n          input.addEventListener('change', () => {\n            const file = input.files && input.files[0];\n            if (!file) return;\n            const reader = new FileReader();\n            reader.onload = () => {\n              try {\n                callback(JSON.parse(reader.result));\n              } catch (e) {\n                alert('JSON 解析失败：' + e.message);\n              }\n            };\n            reader.readAsText(file);\n            document.body.removeChild(input);\n          });\n          document.body.appendChild(input);\n          input.click();\n        },\n\n        initImageUI() {\n          const base = window.MMS_IMAGE_DATA_BASE || window.MMS_IMAGE_DATA;\n          this.imageBase = base;\n          this.imageData = JSON.parse(JSON.stringify(base));\n\n          const list = document.getElementById('mms-img-list');\n          if (list) {\n            list.addEventListener('change', (e) => this.onImageRowEdit(e));\n            list.addEventListener('click', (e) => {\n              const del = e.target.closest('.mms-img-del');\n              if (del) this.deleteImageKey(del.getAttribute('data-name'));\n            });\n          }\n          const search = document.getElementById('mms-img-search');\n          if (search) {\n            search.addEventListener('input', () => {\n              this.imageSearch = search.value.trim().toLowerCase();\n              this.renderImageList();\n            });\n          }\n          document.querySelectorAll('.mms-img-cat-btn').forEach((btn) => {\n            btn.addEventListener('click', () => {\n              this.imageCat = btn.getAttribute('data-cat') || 'portrait';\n              document.querySelectorAll('.mms-img-cat-btn').forEach((b) => b.classList.toggle('active', b === btn));\n              this.renderImageList();\n            });\n          });\n          const addBtn = document.getElementById('mms-img-add');\n          if (addBtn) addBtn.addEventListener('click', () => this.addImageEntry());\n          const saveBtn = document.getElementById('mms-img-save');\n          if (saveBtn) saveBtn.addEventListener('click', () => this.saveImageDataToSource());\n          const copyBtn = document.getElementById('mms-img-copy');\n          if (copyBtn) copyBtn.addEventListener('click', () => this.copyImageDataCode());\n          const expBtn = document.getElementById('mms-img-export');\n          if (expBtn) expBtn.addEventListener('click', () => this.exportPresetFile(this.imageData, 'mms-images.json'));\n          const impBtn = document.getElementById('mms-img-import');\n          if (impBtn) impBtn.addEventListener('click', () => this.importImageData());\n\n          this.syncImageUI();\n        },\n\n        renderImageList() {\n          const listEl = document.getElementById('mms-img-list');\n          if (!listEl || !this.imageData) return;\n          const data = this.imageData[this.imageCat] || {};\n          const q = this.imageSearch;\n          const names = Object.keys(data).filter(\n            (k) => !q || k.toLowerCase().includes(q) || String(data[k]).toLowerCase().includes(q),\n          );\n          listEl.innerHTML = '';\n          if (!names.length) {\n            listEl.innerHTML =\n              '<p class=\"text-[10px] text-gray-500 py-2 text-center\">' +\n              (q ? '没有匹配「' + q + '」的条目' : '此分类暂无图片，请在下方添加') +\n              '<\/p>';\n            return;\n          }\n          names.forEach((name) => {\n            const url = data[name];\n            const row = document.createElement('div');\n            row.className = 'mms-img-row';\n            row.setAttribute('data-name', name);\n            if (this.validateImageName(name) || this.validateImageUrl(url)) row.classList.add('invalid');\n\n            const thumb = document.createElement('div');\n            thumb.className = 'mms-img-thumb';\n            thumb.title = name;\n            this.fillImageThumb(thumb, url);\n            row.appendChild(thumb);\n\n            const nameInput = document.createElement('input');\n            nameInput.className = 'form-input mms-img-name';\n            nameInput.value = name;\n            nameInput.placeholder = '名称';\n            row.appendChild(nameInput);\n\n            const urlInput = document.createElement('input');\n            urlInput.className = 'form-input mms-img-url';\n            urlInput.value = url;\n            urlInput.placeholder = 'https://…';\n            urlInput.spellcheck = false;\n            row.appendChild(urlInput);\n\n            const del = document.createElement('button');\n            del.className = 'mms-img-del';\n            del.type = 'button';\n            del.title = '删除「' + name + '」';\n            del.setAttribute('data-name', name);\n            del.textContent = '✕';\n            row.appendChild(del);\n\n            listEl.appendChild(row);\n          });\n        },\n\n        fillImageThumb(thumb, url) {\n          thumb.innerHTML = '';\n          if (!url) {\n            thumb.textContent = '🖼';\n            return;\n          }\n          const img = document.createElement('img');\n          img.loading = 'lazy';\n          img.alt = '';\n          img.src = url;\n          img.onerror = () => {\n            thumb.innerHTML = '';\n            thumb.textContent = '⚠';\n          };\n          thumb.appendChild(img);\n        },\n\n        onImageRowEdit(e) {\n          const row = e.target.closest('.mms-img-row');\n          if (!row || !this.imageData) return;\n          const oldName = row.getAttribute('data-name');\n          const cat = this.imageCat;\n          const data = this.imageData[cat];\n          if (!data || !(oldName in data)) return;\n\n          if (e.target.classList.contains('mms-img-name')) {\n            const newName = e.target.value.trim();\n            const err = this.validateImageName(newName);\n            if (err) {\n              alert('名称' + err);\n              e.target.value = oldName;\n              return;\n            }\n            if (newName !== oldName) {\n              if (newName in data) {\n                alert('已存在同名条目：' + newName);\n                e.target.value = oldName;\n                return;\n              }\n              this.renameImageKey(cat, oldName, newName);\n              this.syncImageUI();\n              this.setImageStatus('已重命名为「' + newName + '」');\n            }\n          } else if (e.target.classList.contains('mms-img-url')) {\n            const url = e.target.value.trim();\n            data[oldName] = url;\n            // 就地更新缩略图并同步运行时表\n            this.fillImageThumb(row.querySelector('.mms-img-thumb'), url);\n            row.classList.toggle('invalid', !!(this.validateImageName(oldName) || this.validateImageUrl(url)));\n            this.applyImageEntry(cat, oldName, url);\n            this.updateImageCounts();\n            this.updateImageDirty();\n          }\n        },\n\n        // 单条变更同步到运行时三张表（立即生效）；url 传 null 表示删除\n        applyImageEntry(cat, name, url) {\n          const live = window.MMS_IMAGE_DATA && window.MMS_IMAGE_DATA[cat];\n          if (!live) return;\n          if (url == null) delete live[name];\n          else live[name] = url;\n        },\n\n        // 原位替换（保持对象引用，PORTRAIT_MAP/AVATAR_MAP 等别名继续有效）\n        replaceMapInPlace(target, src) {\n          if (!target || !src) return;\n          Object.keys(target).forEach((k) => delete target[k]);\n          Object.keys(src).forEach((k) => {\n            target[k] = src[k];\n          });\n        },\n\n        renameImageKey(cat, oldName, newName) {\n          const reorder = (obj) => {\n            const next = {};\n            Object.keys(obj).forEach((k) => {\n              next[k === oldName ? newName : k] = obj[k];\n            });\n            this.replaceMapInPlace(obj, next);\n          };\n          reorder(this.imageData[cat]);\n          const live = window.MMS_IMAGE_DATA && window.MMS_IMAGE_DATA[cat];\n          if (live && oldName in live) reorder(live);\n        },\n\n        deleteImageKey(name) {\n          if (!this.imageData || !(name in this.imageData[this.imageCat])) return;\n          delete this.imageData[this.imageCat][name];\n          this.applyImageEntry(this.imageCat, name, null);\n          this.syncImageUI();\n          this.setImageStatus('已删除「' + name + '」（保存前刷新页面可撤销）');\n        },\n\n        addImageEntry() {\n          if (!this.imageData) return;\n          const nameEl = document.getElementById('mms-img-new-name');\n          const urlEl = document.getElementById('mms-img-new-url');\n          const name = ((nameEl && nameEl.value) || '').trim();\n          const url = ((urlEl && urlEl.value) || '').trim();\n          const err = this.validateImageName(name);\n          if (err) {\n            alert('名称' + err);\n            return;\n          }\n          if (name in this.imageData[this.imageCat]) {\n            alert('已存在同名条目：' + name);\n            return;\n          }\n          const urlErr = this.validateImageUrl(url);\n          if (urlErr) {\n            alert('链接' + urlErr);\n            return;\n          }\n          this.imageData[this.imageCat][name] = url;\n          this.applyImageEntry(this.imageCat, name, url);\n          if (nameEl) nameEl.value = '';\n          if (urlEl) urlEl.value = '';\n          this.syncImageUI();\n          this.setImageStatus('已添加「' + name + '」');\n        },\n\n        validateImageName(name) {\n          if (!name) return '不能为空';\n          if (/[<>\"`]/.test(name)) return '不能包含 < > \" ` 字符';\n          if (/[\\r\\n\\t]/.test(name)) return '不能包含换行或制表符';\n          // 名称作为 JSON 键同样进入正则替换串，$& 等记号会在酒馆套用替换时撕裂注入的 HTML\n          if (/\\$(?:&|`|'|<|\\d|\\$)/.test(name)) return '包含 $&、$1 等 JS 替换特殊记号，会破坏页面注入';\n          return '';\n        },\n\n        validateImageUrl(url) {\n          if (!url) return '不能为空';\n          if (!/^https?:\\/\\/\\S+$/i.test(url)) return '需以 http:// 或 https:// 开头';\n          if (/[\\r\\n\\s\"`]/.test(url)) return '不能包含空格、换行、引号';\n          if (/[<>]/.test(url)) return '不能包含 < > 字符';\n          // $&、$1、$` 等是 JS 替换串特殊记号，会把注入的 HTML 撕裂\n          if (/\\$(?:&|`|'|<|\\d|\\$)/.test(url)) return '包含 $&、$1 等 JS 替换特殊记号，会破坏页面注入';\n          return '';\n        },\n\n        syncImageUI() {\n          this.renderImageList();\n          this.updateImageCounts();\n          this.updateImageDirty();\n        },\n\n        updateImageCounts() {\n          if (!this.imageData) return;\n          this.imageCats.forEach((c) => {\n            const el = document.getElementById('mms-img-count-' + c.key);\n            if (el) el.textContent = String(Object.keys(this.imageData[c.key] || {}).length);\n          });\n        },\n\n        imageDiffCount() {\n          if (!this.imageData || !this.imageBase) return 0;\n          const diff = (a, b) => {\n            let n = 0;\n            new Set([...Object.keys(a), ...Object.keys(b)]).forEach((k) => {\n              if (a[k] !== b[k]) n++;\n            });\n            return n;\n          };\n          let total = 0;\n          this.imageCats.forEach((c) => {\n            total += diff(this.imageData[c.key] || {}, this.imageBase[c.key] || {});\n          });\n          return total;\n        },\n\n        updateImageDirty() {\n          const n = this.imageDiffCount();\n          const badge = document.getElementById('mms-img-dirty');\n          const saveBtn = document.getElementById('mms-img-save');\n          if (badge) {\n            badge.style.display = n ? '' : 'none';\n            badge.textContent = '未保存 ' + n + ' 项';\n          }\n          if (saveBtn) saveBtn.disabled = n === 0;\n        },\n\n        setImageStatus(text) {\n          const el = document.getElementById('mms-img-status');\n          if (!el) return;\n          el.textContent = text || '';\n          el.style.display = text ? '' : 'none';\n          if (text) {\n            clearTimeout(this._imgStatusTimer);\n            this._imgStatusTimer = setTimeout(() => {\n              el.style.display = 'none';\n            }, 4000);\n          }\n        },\n\n        // 把图片数据序列化为带标记的源码块（< 转义为 \\u003c，防止出现 script 闭合标签截断内联脚本）\n        // & 全量转义为 \\u0026（字符串里语义等价）：酒馆管线连无分号旧式实体都解码\n        // （&not→¬、&quot→\"），任何裸 & 都是活弹；且 \\u0026 不含 & 字符，本地\n        // 「复制配置」粘贴回源码再构建时不会被全量 &amp; 转义二次叠加\n        // 注意：标记用拼接构造——若以完整字面量出现在本函数里，源码中会存在第二处可被\n        // MMS_IMG_BLOCK_RE 匹配的文本，导致「保存到源码」的唯一性校验永远失败\n        serializeImageData(data) {\n          const json = JSON.stringify(data, null, 2)\n            .replace(/<\/g, '\\\\u003c')\n            .replace(/&/g, '\\\\u0026');\n          const startMark = '/* ' + '==== MMS_IMAGE_DATA_START ==== */';\n          const endMark = '/* ' + '==== MMS_IMAGE_DATA_END ==== */';\n          return startMark + '\\nwindow.MMS_IMAGE_DATA = ' + json + ';\\n' + endMark;\n        },\n\n        // 定位承载本页面的正则。名称优先于 id：酒馆导入（尤其随角色卡）会重新生成条目 id，\n        // 仓库构建的固定 UUID 在酒馆侧不可靠（实测两版共存时纯标记兜底会命中数组中靠前的旧手机版，\n        // 导致「保存到源码」写错目标）。源码内嵌 SELF_ID 是本版构建的指纹，用于排除同名旧构建。\n        async findSelfRegex() {\n          const SELF_ID = 'f7d93e53-a3b3-4f25-8199-6822f7665ff2';\n          const SELF_NAME = '美化状态栏[手机专用LLM地图]';\n          const options = [{ type: 'global' }, { type: 'character', name: 'current' }];\n          for (const option of options) {\n            let regexes;\n            try {\n              regexes = getTavernRegexes(option);\n              if (regexes && typeof regexes.then === 'function') regexes = await regexes;\n            } catch (e) {\n              continue;\n            }\n            if (!Array.isArray(regexes) || !regexes.length) continue;\n            const hasMarker = (r) => String((r && r.replace_string) || '').includes('MMS_IMAGE_DATA_START');\n            const nameOf = (r) => String((r && (r.script_name || r.scriptName)) || '');\n            const srcOf = (r) => String((r && r.replace_string) || '');\n            let index = regexes.findIndex((r) => r && hasMarker(r) && nameOf(r) === SELF_NAME && srcOf(r).includes(SELF_ID));\n            if (index < 0) index = regexes.findIndex((r) => r && hasMarker(r) && nameOf(r) === SELF_NAME);\n            if (index < 0) index = regexes.findIndex((r) => r && r.id === SELF_ID && hasMarker(r));\n            if (index < 0) index = regexes.findIndex((r) => r && nameOf(r) === SELF_NAME);\n            if (index < 0) index = regexes.findIndex(hasMarker);\n            if (index >= 0) return { option, regexes, index };\n          }\n          return null;\n        },\n\n        // 核心流程：校验 → 定位正则 → 精确替换标记块 → replaceTavernRegexes 写回\n        //（写回后酒馆会重载聊天并触发 CHAT_CHANGED，本 iframe 自动以新源码重建）\n        async saveImageDataToSource() {\n          if (!this.imageData) return;\n          // 1. 全量校验，有非法条目则拒绝保存\n          const problems = [];\n          this.imageCats.forEach((c) => {\n            const data = this.imageData[c.key] || {};\n            Object.keys(data).forEach((k) => {\n              const e1 = this.validateImageName(k);\n              const e2 = this.validateImageUrl(data[k]);\n              if (e1) problems.push(c.label + '「' + k + '」名称' + e1);\n              else if (e2) problems.push(c.label + '「' + k + '」链接' + e2);\n            });\n          });\n          if (problems.length) {\n            alert(\n              '以下条目有问题，请先修正：\\n' +\n                problems.slice(0, 10).join('\\n') +\n                (problems.length > 10 ? '\\n…共 ' + problems.length + ' 项' : ''),\n            );\n            this.renderImageList();\n            return;\n          }\n\n          if (!this.hasRegexApi()) {\n            alert('当前环境没有酒馆助手正则 API，无法写回源码。\\n可先「导出」JSON 备份，或「复制配置」后手动粘贴回 MiniMapStatusMobile.html。');\n            return;\n          }\n\n          const btn = document.getElementById('mms-img-save');\n          const restoreBtn = () => {\n            if (btn) {\n              btn.disabled = false;\n              btn.innerHTML = '<i class=\"fa fa-save mr-1\"><\/i>保存到源码';\n            }\n          };\n          if (btn) {\n            btn.disabled = true;\n            btn.innerHTML = '<i class=\"fa fa-spinner fa-spin mr-1\"><\/i>写入中…';\n          }\n\n          try {\n            const found = await this.findSelfRegex();\n            if (!found) {\n              alert('未找到承载本页面的正则脚本（美化状态栏[手机专用LLM地图]）。\\n请确认该正则未被删除或改名；数据仍在编辑中，可「导出」先备份。');\n              return;\n            }\n            const { option, regexes, index } = found;\n            const src = String((regexes[index] && regexes[index].replace_string) || '');\n            const matches = src.match(MMS_IMG_BLOCK_RE) || [];\n            if (matches.length !== 1) {\n              alert('正则源码中未找到唯一的图片数据标记块（匹配 ' + matches.length + ' 处），为安全起见已取消写入。');\n              return;\n            }\n            const block = this.serializeImageData(this.imageData);\n            regexes[index].replace_string = src.replace(MMS_IMG_BLOCK_RE, () => block);\n            await replaceTavernRegexes(regexes, option);\n            // 走到这里通常页面已被酒馆重载；若未重载则手动对齐基线\n            window.MMS_IMAGE_DATA_BASE = JSON.parse(JSON.stringify(this.imageData));\n            this.imageBase = window.MMS_IMAGE_DATA_BASE;\n            this.updateImageDirty();\n            this.setImageStatus('已写回源码，页面即将自动刷新');\n          } catch (e) {\n            console.error('[MMS] 图片配置写回失败:', e);\n            alert('写回失败：' + (e && e.message ? e.message : e) + '\\n数据未丢失（仍在编辑中），可「导出」先备份。');\n          } finally {\n            restoreBtn();\n          }\n        },\n\n        async copyImageDataCode() {\n          if (!this.imageData) return;\n          const code = this.serializeImageData(this.imageData);\n          let ok = false;\n          try {\n            // 剪贴板 API 可能因权限挂起（iframe/嵌入式环境），超时后走 execCommand 降级\n            const write = navigator.clipboard && navigator.clipboard.writeText\n              ? navigator.clipboard.writeText(code)\n              : Promise.reject(new Error('no clipboard api'));\n            await Promise.race([write, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 1500))]);\n            ok = true;\n          } catch (e) {\n            // 降级：临时 textarea + execCommand\n            try {\n              const ta = document.createElement('textarea');\n              ta.value = code;\n              ta.style.position = 'fixed';\n              ta.style.opacity = '0';\n              document.body.appendChild(ta);\n              ta.select();\n              ok = document.execCommand('copy');\n              document.body.removeChild(ta);\n            } catch (e2) {\n              ok = false;\n            }\n          }\n          if (ok) {\n            this.setImageStatus('已复制：在本地 MiniMapStatusMobile.html 中全选旧标记块（START 到 END 两行含中间内容）后粘贴替换');\n          } else {\n            alert('复制失败，请改用「导出」保存 JSON。');\n          }\n        },\n\n        importImageData() {\n          if (!this.imageData) return;\n          this.importPresetFile('application/json', (data) => {\n            const errMsg = 'JSON 格式不对：应为「导出」产生的 { portrait, background, avatar } 结构';\n            if (!data || typeof data !== 'object' || Array.isArray(data)) {\n              alert(errMsg);\n              return;\n            }\n            const next = {};\n            for (const c of this.imageCats) {\n              const src = data[c.key];\n              if (!src || typeof src !== 'object' || Array.isArray(src)) {\n                alert(errMsg);\n                return;\n              }\n              for (const k of Object.keys(src)) {\n                if (typeof src[k] !== 'string') {\n                  alert(errMsg + '（' + c.label + '「' + k + '」的链接不是字符串）');\n                  return;\n                }\n              }\n              next[c.key] = Object.assign({}, src);\n            }\n            if (!confirm('导入将覆盖当前编辑中的两张图片表（未保存的修改会丢失），继续？')) return;\n            this.imageData = next;\n            for (const c of this.imageCats) {\n              this.replaceMapInPlace(window.MMS_IMAGE_DATA[c.key], next[c.key]);\n            }\n            this.syncImageUI();\n            this.setImageStatus(\n              '导入完成（立绘 ' +\n                Object.keys(next.portrait).length +\n                ' / 头像 ' +\n                Object.keys(next.avatar).length +\n                ' 项），记得「保存到源码」',\n            );\n          });\n        },\n      };\n\n      // 页签切换钩子（mmsSwitchSettingTab 切到图片管理时刷新列表）\n      function renderImageList() {\n        if (MMS_IMG) MMS_IMG.renderImageList();\n      }\n\n      // ---------- 名称工具（自最新版移植：立绘变体/卡片显示共用） ----------\n      const MMS_EMOJI_SRC =\n        '[\\\\u{1F000}-\\\\u{1FAFF}\\\\u{2190}-\\\\u{21FF}\\\\u{2300}-\\\\u{23FF}\\\\u{2460}-\\\\u{25FF}\\\\u{2600}-\\\\u{27BF}\\\\u{2900}-\\\\u{297F}\\\\u{2B00}-\\\\u{2BFF}\\\\u{FE0F}\\\\u{200D}\\\\u{20E3}]';\n      function mmsStripEmoji(s) {\n        return String(s || '').replace(new RegExp(MMS_EMOJI_SRC, 'gu'), '');\n      }\n      // 轻清洗：仅去emoji与空白（用于展示、正文命中检测）\n      function mmsPlainName(name) {\n        return mmsStripEmoji(name).replace(/[\\s【】]/g, '').trim();\n      }\n      // 名字显示归一：emoji 打头时补前导空格（保留页签/卡片标题的 emoji 图标约定）\n      function mmsNormalizeDisplayName(name) {\n        const s = String(name == null ? '' : name).trim();\n        if (s && /^\\p{Extended_Pictographic}/u.test(s)) return ' ' + s;\n        return s;\n      }\n\n      const triggerQuickReply = text => {\n        if (!text || ['…', '...'].includes(text.trim()) || text.trim().length === 0) return;\n        if (typeof triggerSlash === 'function') {\n          triggerSlash(`/send ${text}|/trigger`);\n        } else {\n          console.log('SillyTavern environment not detected. Would send:', text);\n        }\n      };\n\n      const sendToChatBox = text => {\n        if (!text || ['…', '...'].includes(text.trim()) || text.trim().length === 0) return;\n\n        try {\n          const textarea = parent.document.getElementById('send_textarea') || parent.document.querySelector('#send_textarea');\n          if (!textarea) {\n            console.log('未找到聊天输入框 (#send_textarea)');\n            return;\n          }\n          const currentContent = textarea.value || '';\n          if (currentContent.includes(text.trim())) {\n            console.log('聊天框中已包含该文本，跳过添加');\n            return;\n          }\n          const separator = currentContent.trim() ? '\\n' : '';\n          const newContent = currentContent + separator + text.trim();\n          textarea.value = newContent;\n          textarea.dispatchEvent(new Event('input', { bubbles: true }));\n          console.log('已添加文本到聊天框:', text.trim());\n        } catch (error) {\n          console.error('发送到聊天框时出错:', error);\n          triggerQuickReply(text);\n        }\n      };\n\n      document.addEventListener('DOMContentLoaded', () => {\n        initSettingsPanel();\n        initErrorModal();\n        initThemeToggle();\n        formatMainText();\n        MMS_IMG.initImageUI();\n        MMS.boot();\n        MMS.initApiPresetUI();\n        MMS.initMapArtUI();\n\n        const storyRenderer = new StoryRenderer('yaml-data-source');\n        storyRenderer.init();\n\n        console.log('设置为美化状态栏模式...');\n        updateDisplayMode('status-only');\n\n        document.getElementById('options-list').addEventListener('click', event => {\n          if (event.target.tagName === 'LI') {\n            const optionText = event.target.textContent.trim();\n            const cleanedText = optionText.replace(/^\\d+\\.\\s*/, '');\n\n            const actionMode = getActionMode();\n            if (actionMode === 'send-to-chat') {\n              sendToChatBox(cleanedText);\n            } else {\n              triggerQuickReply(cleanedText);\n            }\n\n            const originalBg = event.target.style.backgroundColor;\n            event.target.style.backgroundColor = 'rgba(157, 124, 245, 0.2)';\n            setTimeout(() => {\n              event.target.style.backgroundColor = originalBg;\n            }, 300);\n          }\n        });\n\n        function getActionMode() {\n          const savedMode = localStorage.getItem('actionMode');\n          return savedMode || 'send-to-chat';\n        }\n      });\n\n      function formatMainText(text) {\n        const maintextContainer = document.getElementById('maintext-container');\n        try {\n          if (typeof text === 'undefined' || !text.trim()) {\n            maintextContainer.innerHTML = '<div class=\"loading-state\"><i class=\"fa fa-spinner fa-spin mr-2\"><\/i>加载中...<\/div>';\n            return;\n          }\n\n          const englishDoubleQuoteRegex = /\"([^\"\\\\]*(?:\\\\.[^\"\\\\]*)*)\"/g;\n          text = text.replace(englishDoubleQuoteRegex, (match, content) => {\n            return `<span class=\"double-quoted\">\"<\/span><span class=\"double-quoted\">${content}<\/span><span class=\"double-quoted\">\"<\/span>`;\n          });\n\n          const chineseLeftQuoteRegex = /\"([^\"]*?)\"/g;\n          text = text.replace(chineseLeftQuoteRegex, (match, content) => {\n            return `<span class=\"double-quoted\">\"<\/span><span class=\"double-quoted\">${content}<\/span><span class=\"double-quoted\">\"<\/span>`;\n          });\n\n          const singleQuoteRegex = /'([^'\\\\]*(?:\\\\.[^'\\\\]*)*)'/g;\n          text = text.replace(singleQuoteRegex, (match, content) => {\n            return `<span class=\"single-quoted\">'<\/span><span class=\"single-quoted\">${content}<\/span><span class=\"single-quoted\">'<\/span>`;\n          });\n\n          const asteriskRegex = /\\*([^\\*]+)\\*/g;\n          text = text.replace(asteriskRegex, (match, content) => {\n            return `<span class=\"asterisk-quoted\">${content}<\/span>`;\n          });\n\n          const paragraphs = text\n            .replace(/\\n\\s*\\n/g, '\\n\\n')\n            .split(/\\n\\s*\\n/)\n            .filter(paragraph => paragraph.trim().length > 0);\n\n          const formattedParagraphs = paragraphs.map(paragraph => {\n            return `<p class=\"paragraph\">${paragraph}<\/p>`;\n          });\n\n          maintextContainer.innerHTML = formattedParagraphs.join('');\n        } catch (error) {\n          console.error('正文渲染失败:', error);\n          maintextContainer.innerHTML =\n            '<div class=\"error-state\"><i class=\"fa fa-exclamation-triangle mr-2\"><\/i>渲染正文失败,请检查正文是否被 &lt;maintext&gt;正文&lt;/maintext&gt;包裹.<\/div>';\n        }\n      }\n\n      function initErrorModal() {\n        const errorModal = document.getElementById('error-modal');\n        const errorClose = document.getElementById('error-close');\n        const errorConfirm = document.getElementById('error-confirm');\n\n        const closeErrorModal = () => {\n          errorModal.style.display = 'none';\n          document.body.style.overflow = '';\n        };\n\n        errorClose.addEventListener('click', closeErrorModal);\n        errorConfirm.addEventListener('click', closeErrorModal);\n\n        errorModal.addEventListener('click', e => {\n          if (e.target === errorModal) {\n            closeErrorModal();\n          }\n        });\n\n        document.addEventListener('keydown', e => {\n          if (e.key === 'Escape' && errorModal.style.display === 'flex') {\n            closeErrorModal();\n          }\n        });\n      }\n\n      function showErrorModal(errorMessage) {\n        const errorModal = document.getElementById('error-modal');\n        const errorDetails = document.getElementById('error-details');\n\n        errorDetails.textContent = errorMessage;\n        errorModal.style.display = 'flex';\n        document.body.style.overflow = 'hidden';\n      }\n\n      // ---------- 徽章按字符数折叠 ----------\n      // 不做 DOM 测量（各环境字体/缩放差异大）：按徽章文本累计字符数判定，\n      // 阈值由用户在设置面板调整（每行字符数）。\n\n      // 每个徽章额外占用的近似间隙字符数\n      const MMS_BADGE_GAP_CHARS = 1;\n\n      function getBadgeFoldCharLimit() {\n        const v = parseInt(localStorage.getItem('badgeFoldCharLimit'), 10);\n        return Number.isFinite(v) && v >= 8 && v <= 200 ? v : 40;\n      }\n\n      function badgeCharLen(text) {\n        return String(text || '').length + MMS_BADGE_GAP_CHARS;\n      }\n\n      function createBadgeExpandButton(badgeContainer) {\n        const btn = document.createElement('button');\n        btn.className = 'item-expand-btn';\n        btn.title = '点击展开全部';\n        btn.textContent = '+N';\n        btn.addEventListener('click', (e) => {\n          e.stopPropagation();\n          if (badgeContainer.classList.contains('expanded')) {\n            // 收起：重新按字符数折叠\n            badgeContainer.classList.remove('expanded');\n            foldBadgeContainer(badgeContainer);\n          } else {\n            badgeContainer.classList.add('expanded');\n            badgeContainer.classList.remove('collapsed');\n            badgeContainer.querySelectorAll('.item-badge-folded').forEach((b) => b.classList.remove('item-badge-folded'));\n            btn.textContent = '收起';\n          }\n        });\n        return btn;\n      }\n\n      // 按字符数折叠单个徽章容器：累计字符超过阈值的第一个徽章起全部隐藏\n      function foldBadgeContainer(container) {\n        const wrapper = container.parentElement;\n        if (!wrapper || !wrapper.classList.contains('item-badge-wrapper')) return;\n        if (container.classList.contains('expanded')) return; // 用户已展开，保持展开\n        const badges = Array.from(container.querySelectorAll('.item-badge'));\n        container.classList.remove('collapsed');\n        badges.forEach((b) => b.classList.remove('item-badge-folded'));\n        let btn = wrapper.querySelector('.item-expand-btn');\n        if (badges.length <= 1) {\n          if (btn) btn.style.display = 'none';\n          return;\n        }\n        const limit = getBadgeFoldCharLimit();\n        // 逐徽章累计字符，超限即折叠（至少保留第 1 个）\n        let acc = 0;\n        let foldFrom = badges.length;\n        for (let i = 0; i < badges.length; i++) {\n          acc += badgeCharLen(badges[i].textContent);\n          if (acc > limit && i > 0) {\n            foldFrom = i;\n            break;\n          }\n        }\n        const hiddenCount = badges.length - foldFrom;\n        if (hiddenCount <= 0) {\n          if (btn) btn.style.display = 'none';\n          return;\n        }\n        for (let i = foldFrom; i < badges.length; i++) badges[i].classList.add('item-badge-folded');\n        container.classList.add('collapsed');\n        if (!btn) {\n          btn = createBadgeExpandButton(container);\n          wrapper.appendChild(btn);\n        }\n        btn.style.display = '';\n        btn.textContent = `+${hiddenCount}`;\n        btn.title = '点击展开全部';\n      }\n\n      // 重算全部徽章容器（设置阈值变化时调用）\n      function refreshExistingBadgeContainers() {\n        document.querySelectorAll('.item-badge-container').forEach((container) => {\n          foldBadgeContainer(container);\n        });\n      }\n\n      // 设置视图就地整栏切换（无遮罩模态）\n      // 页签注册表：新增页签只需在此加一行（按钮 id 约定 tab-btn-<key>，内容 id 约定 tab-content-<key>）\n      const MMS_SETTING_TAB_NAMES = {\n        theme: '界面与交互',\n        ai: 'LLM地图',\n        images: '图片管理',\n      };\n\n      function mmsToggleSettingsView(show) {\n        const mainView = document.getElementById('mms-main-view');\n        const settingsView = document.getElementById('settings-panel');\n        if (!mainView || !settingsView) return;\n        if (show) {\n          mainView.style.display = 'none';\n          settingsView.style.display = 'block';\n          // 面板从隐藏变可见后页签栏才有真实宽度，重算边缘渐隐\n          if (typeof mmsTabScrollerUpdateEdges === 'function') mmsTabScrollerUpdateEdges();\n        } else {\n          settingsView.style.display = 'none';\n          mainView.style.display = 'block';\n        }\n      }\n\n      function mmsSwitchSettingTab(tabKey) {\n        const tabBtns = {};\n        const tabContents = {};\n        Object.keys(MMS_SETTING_TAB_NAMES).forEach((k) => {\n          tabBtns[k] = document.getElementById('tab-btn-' + k);\n          tabContents[k] = document.getElementById('tab-content-' + k);\n        });\n        Object.keys(MMS_SETTING_TAB_NAMES).forEach(k => {\n          if (tabBtns[k]) {\n            tabBtns[k].classList.remove('active', 'text-primary');\n            tabBtns[k].classList.add('hover:text-gray-200');\n          }\n          if (tabContents[k]) tabContents[k].style.display = 'none';\n        });\n        if (tabBtns[tabKey]) {\n          tabBtns[tabKey].classList.add('active', 'text-primary');\n          tabBtns[tabKey].classList.remove('hover:text-gray-200');\n          // 页签栏可横向滚动：把激活按钮滚进可视区\n          // （用即时滚动：个别嵌入式浏览器对 smooth 滚动静默失败）\n          if (typeof tabBtns[tabKey].scrollIntoView === 'function') {\n            const siv = () => tabBtns[tabKey].scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'auto' });\n            siv();\n            // 激活态字重有 0.15s 过渡，按钮/整栏宽度随后才稳定（rAF 在未聚焦 iframe 会被节流，改用定时器）\n            setTimeout(siv, 60);\n            setTimeout(siv, 250);\n          }\n        }\n        if (tabContents[tabKey]) tabContents[tabKey].style.display = 'block';\n        // 页签栏边缘渐隐：切页签后重算（scrollIntoView 未发生滚动时没有 scroll 事件）\n        if (typeof mmsTabScrollerUpdateEdges === 'function') mmsTabScrollerUpdateEdges();\n        // 切到图片管理时按最新数据重渲染列表（保存/导入后可能已变化）\n        if (tabKey === 'images' && typeof renderImageList === 'function') {\n          renderImageList();\n        }\n        const titleSpan = document.getElementById('settings-current-tab-name');\n        if (titleSpan) titleSpan.textContent = MMS_SETTING_TAB_NAMES[tabKey] || '设置';\n      }\n\n      // 页签栏横向滚动：PC 鼠标按住拖动（位移阈值区分点击/拖动），移动端不接管（原生惯性滑动）。\n      // 边缘渐隐（mask）由 .at-start/.at-end 类控制；字体异步加载会改变页签宽度，\n      // 初始计算可能失真，故在字体就绪/延迟后重算，切页签时也主动重算。\n      let mmsTabScrollerUpdateEdges = null;\n\n      function initTabDragScroll() {\n        const scroller = document.querySelector('.mms-tab-scroller');\n        if (!scroller) return;\n        let dragging = false;\n        let moved = false;\n        let startX = 0;\n        let startY = 0;\n        let startScroll = 0;\n\n        const updateEdges = () => {\n          const max = scroller.scrollWidth - scroller.clientWidth;\n          scroller.classList.toggle('at-start', scroller.scrollLeft <= 1);\n          scroller.classList.toggle('at-end', scroller.scrollLeft >= max - 1);\n        };\n        mmsTabScrollerUpdateEdges = updateEdges;\n\n        scroller.addEventListener('scroll', updateEdges, { passive: true });\n        window.addEventListener('resize', updateEdges);\n        if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {\n          document.fonts.ready.then(() => updateEdges());\n        }\n        setTimeout(updateEdges, 500);\n        setTimeout(updateEdges, 1500);\n        // ResizeObserver 兜底：视口变化/页签变宽（字体加载、激活加粗）后按布局完成时机的精确值重算\n        if (typeof ResizeObserver !== 'undefined') {\n          const ro = new ResizeObserver(() => updateEdges());\n          ro.observe(scroller);\n          Array.prototype.forEach.call(scroller.children, (child) => ro.observe(child));\n        }\n        // 兜底的兜底：个别嵌入式浏览器不投递 resize/RO 回调，面板可见期间周期自检（开销可忽略）\n        setInterval(() => {\n          if (scroller.clientWidth > 0) updateEdges();\n        }, 1500);\n\n        scroller.addEventListener('pointerdown', (e) => {\n          if (e.pointerType !== 'mouse' || e.button !== 0) return;\n          dragging = true;\n          moved = false;\n          startX = e.clientX;\n          startY = e.clientY;\n          startScroll = scroller.scrollLeft;\n        });\n\n        scroller.addEventListener('pointermove', (e) => {\n          if (!dragging) return;\n          const dx = e.clientX - startX;\n          const dy = e.clientY - startY;\n          if (!moved && Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)) {\n            moved = true;\n            scroller.classList.add('dragging');\n            try { scroller.setPointerCapture(e.pointerId); } catch (err) { /* 捕获失败不影响拖动 */ }\n          }\n          if (moved) {\n            e.preventDefault();\n            scroller.scrollLeft = startScroll - dx;\n          }\n        });\n\n        const endDrag = () => {\n          if (!dragging) return;\n          dragging = false;\n          if (moved) {\n            scroller.classList.remove('dragging');\n            // 吞掉拖动结束后的这一次 click，避免误触页签切换\n            const swallowClick = (ev) => {\n              ev.stopPropagation();\n              ev.preventDefault();\n            };\n            scroller.addEventListener('click', swallowClick, { capture: true, once: true });\n            setTimeout(() => scroller.removeEventListener('click', swallowClick, { capture: true }), 0);\n          }\n        };\n        scroller.addEventListener('pointerup', endDrag);\n        scroller.addEventListener('pointercancel', endDrag);\n        scroller.addEventListener('pointerleave', endDrag);\n\n        updateEdges();\n      }\n\n      function initSettingsPanel() {\n        const settingsBtn = document.getElementById('settings-btn');\n        const settingsClose = document.getElementById('settings-close');\n        const displayModeRadios = document.querySelectorAll('input[name=\"display-mode\"]');\n        const actionModeRadios = document.querySelectorAll('input[name=\"action-mode\"]');\n\n        if (settingsBtn) {\n          settingsBtn.addEventListener('click', () => mmsToggleSettingsView(true));\n        }\n        if (settingsClose) {\n          settingsClose.addEventListener('click', () => mmsToggleSettingsView(false));\n        }\n        Object.keys(MMS_SETTING_TAB_NAMES).forEach(k => {\n          const btn = document.getElementById('tab-btn-' + k);\n          if (btn) btn.addEventListener('click', () => mmsSwitchSettingTab(k));\n        });\n        // 页签栏横向拖动滚动（PC）；移动端保留原生滑动\n        initTabDragScroll();\n\n        document.addEventListener('keydown', e => {\n          if (e.key === 'Escape') {\n            const settingsView = document.getElementById('settings-panel');\n            if (settingsView && settingsView.style.display === 'block') {\n              mmsToggleSettingsView(false);\n            }\n          }\n        });\n\n        const savedDisplayMode = localStorage.getItem('displayMode') || 'status-only';\n        displayModeRadios.forEach(radio => {\n          if (radio.value === savedDisplayMode) {\n            radio.checked = true;\n          }\n          radio.addEventListener('change', () => {\n            if (radio.checked) {\n              updateDisplayMode(radio.value);\n              localStorage.setItem('displayMode', radio.value);\n            }\n          });\n        });\n\n        updateDisplayMode(savedDisplayMode);\n\n        const savedActionMode = localStorage.getItem('actionMode') || 'send-to-chat';\n        actionModeRadios.forEach(radio => {\n          if (radio.value === savedActionMode) {\n            radio.checked = true;\n          }\n          radio.addEventListener('change', () => {\n            if (radio.checked) {\n              localStorage.setItem('actionMode', radio.value);\n            }\n          });\n        });\n\n        // 徽章折叠字符数设置（+/- 调整后即时重算全部徽章）\n        const foldCharValueEl = document.getElementById('foldchar-value');\n        const foldMinusBtn = document.getElementById('foldchar-minus');\n        const foldPlusBtn = document.getElementById('foldchar-plus');\n        const syncFoldCharUI = () => {\n          const t = getBadgeFoldCharLimit();\n          if (foldCharValueEl) foldCharValueEl.textContent = String(t);\n          if (foldMinusBtn) foldMinusBtn.disabled = t <= 8;\n          if (foldPlusBtn) foldPlusBtn.disabled = t >= 200;\n        };\n        const setFoldCharLimit = (v) => {\n          const t = Math.max(8, Math.min(200, v));\n          localStorage.setItem('badgeFoldCharLimit', String(t));\n          syncFoldCharUI();\n          // 已展开的容器先复位再统一重算\n          document.querySelectorAll('.item-badge-container.expanded').forEach((c) => c.classList.remove('expanded'));\n          refreshExistingBadgeContainers();\n        };\n        if (foldMinusBtn) foldMinusBtn.addEventListener('click', () => setFoldCharLimit(getBadgeFoldCharLimit() - 2));\n        if (foldPlusBtn) foldPlusBtn.addEventListener('click', () => setFoldCharLimit(getBadgeFoldCharLimit() + 2));\n        syncFoldCharUI();\n      }\n\n      function updateDisplayMode(mode) {\n        const bodyElement = document.body;\n        bodyElement.classList.remove('status-only-mode');\n\n        if (mode === 'status-only') {\n          bodyElement.classList.add('status-only-mode');\n        }\n      }\n\n      // 主题圆点选择器（替换原主题网格）\n      const MMS_THEME_LABELS = {\n        romantic: '修仙风格',\n        day: '白天模式',\n        jade: '血色模式',\n        classic: '古典模式',\n        night: '黑夜模式',\n        fresh: '小清新风格',\n      };\n\n      function initThemeToggle() {\n        const themeDots = document.querySelectorAll('.theme-dot-btn');\n        const bodyElement = document.body;\n\n        const savedTheme = localStorage.getItem('storyTheme') || 'romantic';\n        switchToTheme(savedTheme);\n\n        themeDots.forEach(dot => {\n          dot.addEventListener('click', () => {\n            const theme = dot.getAttribute('data-theme');\n            switchToTheme(theme);\n            localStorage.setItem('storyTheme', theme);\n          });\n        });\n\n        function switchToTheme(theme) {\n          bodyElement.classList.remove(\n            'night-mode',\n            'day-mode',\n            'jade-mode',\n            'classic-mode',\n            'romantic-mode',\n            'fresh-mode',\n          );\n\n          bodyElement.classList.add(`${theme}-mode`);\n\n          themeDots.forEach(dot => {\n            if (dot.getAttribute('data-theme') === theme) {\n              dot.classList.add('active');\n            } else {\n              dot.classList.remove('active');\n            }\n          });\n          const nameEl = document.getElementById('mms-theme-name');\n          if (nameEl) nameEl.textContent = '当前：' + (MMS_THEME_LABELS[theme] || theme);\n        }\n      }\n\n      \n      // ==========================================\n      // AI 地图：语义 JSON 渲染器（绘图 LLM 只输出布局+地标 JSON，视觉全部由本渲染器固定）\n      // 大小地图共用此渲染器与生成管道，按 kind 区分\n      // ==========================================\n\n      // 双地图注册表：mini=小地图（当前场景局部平面）/ big=大地图（区域全局）\n      const MMS_MAP_KINDS = {\n        mini: {\n          varName: '$mms_map_mini_art', // 聊天变量（每个聊天各存一张演化中的图）\n          dataKey: '小地图',             // 渲染前注入 display 数据的模块键\n          cfgKey: 'miniArt',             // $mms_roster 里的设定键（note/style）\n          toggleKey: 'minimap',          // $mms_roster.maps 的开关键\n          label: '小地图',\n        },\n        big: {\n          varName: '$mms_map_art',\n          dataKey: '大地图',\n          cfgKey: 'bigArt',\n          toggleKey: 'bigmap',\n          label: '大地图',\n        },\n      };\n\n      // 当前楼层两地图的渲染状态（由 MMS.injectMapArt 在每次渲染前写入，createAttributeItem 读取）\n      let MMS_MAP_ART_STATE = { mini: { enabled: false }, big: { enabled: false } };\n\n      const MMS_MAPART_STYLES = {\n        flat: {\n          ground: { field: '#ece4c9', sea: '#9cc4dc' },\n          grass: '#d3e0ae', snow: '#edf2f5', forest: '#b6cc97', desert: '#ecd9a4',\n          fieldCrop: '#e6d49a', lake: '#a9d2e8', river: '#a9d2e8', riverEdge: '#82b3cf',\n          road: '#faf5e6', roadEdge: '#d9cba6', landStroke: '#bfb086', wall: '#a08e66',\n          wallInner: '#c9b992', tower: '#b3a179', towerEdge: '#8f7d5c',\n          stone: '#c6a97e', stoneEdge: '#a68c60', wood: '#c9a97a', woodEdge: '#8a6a42',\n          roof: '#a2705a', plaster: '#f4efe2', plasterEdge: '#b0a687',\n          houseFill: '#e3d5b2', houseEdge: '#c8b790', tree: '#a8c489', treeEdge: '#8ba76e',\n          crop: '#c9a852', water: '#a9d2e8', waterEdge: '#82b3cf', boat: '#b05a4a', boatEdge: '#8a4238',\n          label: '#8a7a58', font: \"'PingFang SC','Microsoft YaHei',sans-serif\",\n          strokeW: { road: 8, roadEdge: 20, river: 40, wall: 15, thin: 2 },\n        },\n        parchment: {\n          ground: { field: '#ecd9ae', sea: '#a8c4d4' },\n          grass: '#c6d3a0', snow: '#eef2f4', forest: '#9db07a', desert: '#e4cf9a',\n          fieldCrop: '#dfc98e', lake: '#a9c9dd', river: '#8fb5c9', riverEdge: '#6e93a6',\n          road: '#5f4a30', roadEdge: null, landStroke: '#3f3020', wall: '#6b533a',\n          wallInner: '#3f3020', tower: '#d8c298', towerEdge: '#4a3826',\n          stone: '#d9c294', stoneEdge: '#3f3020', wood: '#cfae7d', woodEdge: '#5f4630',\n          roof: '#a2705a', plaster: '#f2ead2', plasterEdge: '#4a3826',\n          houseFill: '#e2cda0', houseEdge: '#4a3826', tree: '#9db07a', treeEdge: '#5f7a4a',\n          crop: '#c9a852', water: '#a9c9dd', waterEdge: '#5f7a88', boat: '#8a4238', boatEdge: '#3f3020',\n          label: '#6b4326', font: \"'KaiTi','STKaiti','PingFang SC',serif\",\n          strokeW: { road: 1.6, roadEdge: 0, river: 36, wall: 5, thin: 2 },\n          roadDash: '11 9',\n        },\n      };\n\n      function mmsMapArtRoundRect(x, y, w, h, r) {\n        return (\n          'M ' + (x + r) + ' ' + y + ' h ' + (w - 2 * r) +\n          ' a ' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r +\n          ' v ' + (h - 2 * r) + ' a ' + r + ' ' + r + ' 0 0 1 ' + -r + ' ' + r +\n          ' h ' + -(w - 2 * r) + ' a ' + r + ' ' + r + ' 0 0 1 ' + -r + ' ' + -r +\n          ' v ' + -(h - 2 * r) + ' a ' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + -r + ' Z'\n        );\n      }\n\n      // 渲染器支持的地物类型白名单（同时用于提示词与 sanitize 校验，避免 LLM 编造类型导致静默空绘）\n      const MMS_MAPART_FEATURE_TYPES = [\n        'castle', 'church', 'opera', 'house', 'boathouse', 'boat', 'fountain', 'stall',\n        'farm', 'pavilion', 'city', 'fortress', 'gate', 'port', 'volcano',\n      ];\n      const MMS_MAPART_TERRAIN_TYPES = ['grass', 'snow', 'forest', 'desert', 'field', 'lake'];\n      const MMS_MAPART_DISTRICT_TYPES = ['royal', 'craft', 'garden', 'plaza', 'harbor'];\n\n      function mmsMapArtFeature(f, S, style) {\n        const x = f.at[0], y = f.at[1];\n        const w = f.size ? f.size[0] : 0, h = f.size ? f.size[1] : 0;\n        switch (f.type) {\n          case 'castle': {\n            const st = style === 'parchment' ? { fill: '#d9c294', edge: '#3f3020', sw: 2.5 } : { fill: '#c6a97e', edge: '#a68c60', sw: 2 };\n            let g = '';\n            g += '<polygon points=\"' + (x - 64) + ',' + (y - 68) + ' ' + (x - 51) + ',' + (y - 92) + ' ' + (x - 38) + ',' + (y - 68) + '\" fill=\"' + S.roof + '\" stroke=\"' + st.edge + '\" stroke-width=\"2\"/>';\n            g += '<polygon points=\"' + (x + 38) + ',' + (y - 68) + ' ' + (x + 51) + ',' + (y - 92) + ' ' + (x + 64) + ',' + (y - 68) + '\" fill=\"' + S.
