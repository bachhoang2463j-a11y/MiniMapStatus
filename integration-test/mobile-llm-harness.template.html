<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>手机 LLM 地图版 · 回归 Harness</title>
<style>
  body { font-family: Consolas, monospace; font-size: 13px; max-width: 900px; margin: 24px auto; padding: 0 12px; }
  h2 { border-bottom: 2px solid #333; padding-bottom: 4px; }
  .grp { margin: 10px 0; }
  .row { padding: 2px 6px; border-left: 3px solid #999; margin: 2px 0; background: #f6f6f6; }
  .row.ok { border-color: #2e8b57; }
  .row.bad { border-color: #d93025; background: #fdeceb; }
  .total { font-weight: bold; font-size: 15px; margin-top: 14px; padding: 6px; background: #eee; }
  #run { font-size: 14px; padding: 6px 16px; }
  pre { background: #222; color: #9f9; padding: 8px; font-size: 11px; overflow: auto; max-height: 260px; }
  iframe { width: 100%; height: 640px; border: 1px solid #888; margin-top: 10px; }
</style>
</head>
<body>
<h1>手机 LLM 地图版 · 回归 Harness</h1>
<p>内嵌 MiniMapStatusMobileLLM.html（srcdoc iframe + mock 酒馆 API），覆盖：内置 SVG 模板删除断言 / 设置面板三 tab（地图开关融入 LLM地图）/ 图片管理仅立绘+头像 / 双地图占位卡与 AI 生成（mock generateRaw，小地图=室内近景样例、大地图=城堡样例）/ 小地图近景材质渲染直测（木地板/雪原/街道/健身房/羊皮纸/罗盘区分/rot）/ 增量状态与风格切换 / 开关回退列表 / 立绘 / 徽章折叠 / 图片表 localStorage 本机持久化。</p>
<button id="run" type="button">▶ 运行全部断言</button>
<div id="out"></div>
<pre id="log"></pre>
<iframe id="stage"></iframe>

<script>
(function () {
  const WIDGET_HTML = /*__WIDGET_HTML_JSON__*/;

  const out = document.getElementById('out');
  const logEl = document.getElementById('log');
  const log = (...a) => { logEl.innerText += a.join(' ') + '\n'; };
  let passCount = 0, total = 0;

  function assert(desc, fn) {
    total++;
    const row = document.createElement('div');
    row.className = 'row';
    row.textContent = '… ' + desc;
    out.appendChild(row);
    try {
      const ok = fn();
      row.className = 'row ' + (ok ? 'ok' : 'bad');
      row.textContent = (ok ? '✓ ' : '✗ ') + desc;
      if (ok) passCount++;
      else log('FAIL', desc);
    } catch (e) {
      row.className = 'row bad';
      row.textContent = '✗ ' + desc + ' — 异常: ' + e.message;
      log('EXC', desc, e.stack);
    }
  }
  function group(name) {
    const g = document.createElement('div');
    g.className = 'grp';
    const h = document.createElement('h2');
    h.textContent = name;
    g.appendChild(h);
    out.appendChild(g);
  }
  const totalRow = document.createElement('div');
  totalRow.className = 'total';
  totalRow.textContent = '0 项通过';
  out.appendChild(totalRow);
  function finish() {
    totalRow.textContent = passCount + ' / ' + total + ' 项通过' + (passCount === total ? '（全部通过）' : '（存在失败项）');
  }

  // ============ mock 酒馆数据 ============
  const mockMessage = [
    '<maintext>',
    '正文测试段落，带引号对话"你好"与【📍悉尼·澳大利亚酒店-总督套房】地点行。',
    '【立绘弗兰克】',
    '</maintext>',
    '<Status_block>',
    '状态栏:',
    '  日期: 第1天',
    '  时间: 08:00',
    '  地点: 酒店套房',
    '  角色列表:',
    '    - 名字: 弗兰克',
    '      立绘: 【立绘弗兰克】',
    "      属性: \"[❤️HP:80/100][🛡️防:5][💥攻:12][⚡速:8][🎯命中:75][🍀幸运:60][🔫武器:步枪][🧪物品:绷带][💊药品:止痛药][📖情报:地图][🔑钥匙:房卡][💰现金:120美元]\"",
    '    - 名字: 埃利奥特',
    "      属性: '[❤️HP:50/50]'",
    '  小地图:',
    '    当前场景:',
    '      - "🛏️【床铺】(20, 80) 可以休息"',
    '      - "🚪【房门】(50, 90) 通往走廊"',
    '</Status_block>',
  ].join('\n');

  // mock 绘图 AI 的语义 JSON 输出：小地图=室内近景样例（近景材质+家具），大地图=城堡地理样例
  const mockMiniJson = {
    name: '总督套房',
    ground: 'wood',
    outline: { shape: 'roundRect', at: [90, 110], size: [820, 780], r: 24, wall: true },
    gates: [[500, 880]],
    terrain: [{ type: 'carpet', shape: 'rect', at: [330, 380], size: [340, 260] }],
    features: [
      { type: 'wall', at: [430, 110], size: [16, 240] },
      { type: 'door', at: [446, 380] },
      { type: 'bed', at: [150, 190], size: [80, 110], rot: 90 },
      { type: 'table', at: [640, 520] },
      { type: 'lantern', at: [500, 300] },
    ],
    markers: [
      { emoji: '🛏️', name: '床铺', x: 20, y: 26, desc: '可以休息' },
      { emoji: '🚪', name: '房门', x: 50, y: 88, desc: '通往走廊' },
      { emoji: '🪑', name: '会客桌', x: 64, y: 52, desc: '桌面散着文件' },
    ],
  };
  const mockBigJson = {
    name: '测试场景',
    ground: 'field',
    markers: [
      { emoji: '🏰', name: '城堡', x: 50, y: 25, desc: '测试地标' },
      { emoji: '⛵', name: '港口', x: 20, y: 80, desc: '海边' },
    ],
    features: [{ type: 'castle', at: [500, 258] }],
  };

  // mock 修补 LLM 输出：带前后废话 + 已补上缺失的「行动选项」（检验 cleanOutput 的取块行为）
  const mockRepairBody = [
    '状态栏:',
    '  日期和时间: "第1天 08:00"',
    '  地点: "酒店套房"',
    '  角色列表:',
    '    - 名字: "弗兰克"',
    '      属性: "[❤️HP:80/100]"',
    '  行动选项:',
    '    名字: "弗兰克"',
    '    选项:',
    '      - "1. 检查房门"',
    '      - "2. 上床休息"',
  ].join('\n');
  const mockRepairReply = '已为您修复：\n<Status_block>\n' + mockRepairBody + '\n</Status_block>\n希望有帮助。';

  // 新版 roster schema：双开关默认开 + 每图 note/style
  const store = {
    chat: {
      $mms_roster: {
        maps: { minimap: true, bigmap: true },
        miniArt: { note: '', style: 'flat' },
        bigArt: { note: '', style: 'flat' },
      },
    },
    global: {},
  };

  // 注入到 iframe 头部的 mock 脚本（先于小部件脚本执行）
  // 做成工厂函数：迁移断言需要带不同的 global 种子重建 iframe
  const makeMockScript = (chatSeed, globalSeed) => `
<script>
(function () {
  window.__harnessLog = [];
  var STORE = {
    chat: ${JSON.stringify(chatSeed)},
    global: ${JSON.stringify(globalSeed || {})}
  };
  window.__getStore = function () { return STORE; };
  var MSG = { message: ${JSON.stringify(mockMessage)}, swipe_id: 0, swipes: [${JSON.stringify(mockMessage)}], role: 'assistant', is_user: false, message_id: 0 };
  window.__getMessage = function () { return MSG; };
  window.getCurrentMessageId = function () { return 0; };
  window.getChatMessages = function (id, opt) {
    var base = { message: MSG.message, role: 'assistant', is_user: false, message_id: 0 };
    if (opt && opt.include_swipes) {
      base.swipe_id = MSG.swipe_id;
      base.swipes = MSG.swipes.slice();
    }
    return [base];
  };
  window.setChatMessages = function (arr, opt) {
    (arr || []).forEach(function (m) {
      if (typeof m.message === 'string') {
        MSG.message = m.message;
        MSG.swipes[MSG.swipe_id] = m.message;
      }
      if (typeof m.swipe_id === 'number') MSG.swipe_id = m.swipe_id;
    });
    window.__harnessLog.push('setChatMessages:' + (arr || []).length);
    return Promise.resolve();
  };
  window.getVariables = function (opt) { return JSON.parse(JSON.stringify(opt && opt.type === 'global' ? STORE.global : STORE.chat)); };
  window.insertOrAssignVariables = function (obj, opt) {
    var t = opt && opt.type === 'global' ? STORE.global : STORE.chat;
    Object.keys(obj).forEach(function (k) { t[k] = obj[k]; });
  };
  window.replaceVariables = function (obj, opt) {
    if (opt && opt.type === 'global') STORE.global = obj; else STORE.chat = obj;
  };
  window.eventOn = function (name, cb) { window.__harnessLog.push('eventOn:' + name); };
  window.eventEmit = function (name, data) { window.__harnessLog.push('eventEmit:' + name); };
  window.generateRawCalls = [];
  window.__repairReply = ${JSON.stringify(mockRepairReply)};
  window.__repairFailTimes = 0;
  window.generateRaw = function (config) {
    window.generateRawCalls.push(config);
    var gid = String(config.generation_id || '');
    if (gid.indexOf('mms-repair-') === 0) {
      if (window.__repairFailTimes > 0) {
        window.__repairFailTimes--;
        return Promise.reject(new Error('mock 调用失败'));
      }
      return Promise.resolve(window.__repairReply);
    }
    var isMini = /-mini-/.test(gid);
    return Promise.resolve(JSON.stringify(isMini ? ${JSON.stringify(mockMiniJson)} : ${JSON.stringify(mockBigJson)}));
  };
  window.alert = function (msg) { window.__harnessLog.push('alert:' + String(msg).slice(0, 80)); };
  window.confirm = function (msg) { window.__harnessLog.push('confirm:' + String(msg).slice(0, 40)); return true; };
  window.__promptReply = null;
  window.prompt = function (msg, def) { window.__harnessLog.push('prompt:' + String(msg).slice(0, 30)); return window.__promptReply; };
})();
<\/script>
`;
  const mockScript = makeMockScript(store.chat, store.global);

  // 组装 iframe srcdoc：mock 脚本插在 <head> 最前
  const staged = WIDGET_HTML.replace('<head>', '<head>' + mockScript);
  const stage = document.getElementById('stage');

  function q(sel) { return stage.contentDocument.querySelector(sel); }
  function qa(sel) { return Array.from(stage.contentDocument.querySelectorAll(sel)); }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const click = (el) => el.dispatchEvent(new MouseEvent('click', { bubbles: true }));

  async function runAll() {
    out.innerHTML = '';
    totalRow.textContent = '… 运行中';
    passCount = 0; total = 0;
    out.appendChild(totalRow);
    // 图片表本机快照清零，保证每次运行从源码内置表出发
    try { localStorage.removeItem('mms_img_data_llm_v1'); } catch (e) {}

    group('〇、删减断言（内置 SVG 模板 / 标签池 / 底图外链已移除）');
    assert('源码无 env- 场景类残留', () => !WIDGET_HTML.includes('env-'));
    assert('源码无标签池芯片样式残留', () => !WIDGET_HTML.includes('map-tag-chip'));
    assert('源码无 BACKGROUND_MAP 残留', () => !WIDGET_HTML.includes('BACKGROUND_MAP'));
    assert('源码含中性网格兜底（唯一保留的内置底图）', () => WIDGET_HTML.includes('neutral-grid'));

    stage.srcdoc = staged;
    await sleep(1800); // 等 DOMContentLoaded + reRenderStatusBar(100ms) + 引擎(50ms) + 立绘扫描

    const win = stage.contentWindow;
    const doc = stage.contentDocument;

    group('一、基础渲染（正文直读管线）');
    assert('时间显示读取自 Status_block', () => q('#time-display').textContent.includes('第1天'));
    assert('地点显示读取自 Status_block', () => q('#location-display').textContent.includes('酒店套房'));
    assert('正文已渲染（maintext）', () => q('#maintext-container').textContent.includes('正文测试段落'));
    assert('角色标签页 ≥4（弗兰克/埃利奥特/小地图/大地图）', () => qa('.character-tab-btn').length >= 4);

    group('二、双地图初始态（默认开 + 未生成占位卡）');
    assert('小地图与大地图各渲染出占位卡', () => qa('.mms-bm-placeholder').length === 2);
    assert('占位卡带 kind 标记（mini/big 各一）', () =>
      !!q('li[data-mms-map-kind="mini"]') && !!q('li[data-mms-map-kind="big"]'));
    assert('未生成时不实例化地图引擎', () => qa('.tactical-map-container').length === 0);
    assert('YAML 小地图数据被注入覆盖（可见面板无床铺普通列表）', () => {
      const panel = q('.character-panel');
      return !!panel && !panel.textContent.includes('可以休息');
    });

    group('三、立绘渲染（原版引擎整幅替换，非双栏小图）');
    // 立绘引擎首轮扫描在启动后 ~1200ms；IAB 中 iframe 定时器可能被节流，轮询等待
    for (let i = 0; i < 12 && !qa('[data-pt-wrapper="1"]').length; i++) await sleep(600);
    (function () {
      const wrappers = qa('[data-pt-wrapper="1"]');
      if (!wrappers.length) return assert('弗兰克立绘由引擎渲染（data-pt-wrapper）', () => false);
      const w = wrappers[0];
      const isMobileUA = /Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent);
      assert('弗兰克立绘由原版立绘引擎渲染（data-pt-wrapper）', () => true);
      assert('立绘显示范围照搬原版引擎（height/min-height 分支与 UA 一致）', () => {
        const s = w.getAttribute('style') || '';
        const h = isMobileUA ? 'height: 24vh' : 'height: 40vh';
        const mh = isMobileUA ? 'min-height: 140px' : 'min-height: 240px';
        const img = w.querySelector('img');
        return s.includes(h) && s.includes(mh) && !!img && (img.getAttribute('style') || '').includes('object-fit: cover');
      });
      assert('立绘底部渐变羽化（mask-image 含 linear-gradient）', () => {
        const cs = win.getComputedStyle(w);
        return (cs.maskImage || cs.webkitMaskImage || '').includes('linear-gradient');
      });
      assert('卡片无双栏立绘结构（pc-portrait-box 已移除）', () => qa('.pc-portrait-box').length === 0);
      assert('立绘灯箱已移除（无 #pc-portrait-lightbox）', () => !q('#pc-portrait-lightbox'));
    })();

    group('四、徽章折叠（字符数阈值）');
    assert('超长徽章串折叠出 +N 按钮', () => !!q('.item-expand-btn'));
    assert('折叠按钮文案为 +N 形式', () => /^\+\d+$|收起/.test(q('.item-expand-btn').textContent.trim()));
    (function () {
      const btn = q('.item-expand-btn');
      if (!btn) return;
      click(btn);
      assert('点击 +N 展开全部徽章', () => btn.textContent.trim() === '收起');
      click(btn);
      assert('再次点击收起', () => /^\+\d+$/.test(btn.textContent.trim()));
    })();

    group('五、设置面板（四 tab，地图开关融入 LLM地图）');
    click(q('#settings-btn'));
    await sleep(100);
    assert('设置面板就地展开（主视图隐藏）', () => q('#settings-panel').style.display === 'block' && q('#mms-main-view').style.display === 'none');
    assert('恰好 4 个页签', () => qa('.setting-tab-btn').length === 4);
    assert('页签名：界面与交互/LLM地图/LLM修补/图片管理', () =>
      ['界面与交互', 'LLM地图', 'LLM修补', '图片管理'].every((n) => qa('.setting-tab-btn').some((b) => b.textContent.includes(n))));
    assert('主题圆点 6 个', () => qa('.theme-dot-btn').length === 6);
    click(q('#tab-btn-ai'));
    await sleep(120);
    assert('LLM地图页签含小地图/大地图开关', () => !!q('#mms-map-minimap') && !!q('#mms-map-bigmap'));
    assert('双开关默认开启（mock 名册）', () => q('#mms-map-minimap').checked === true && q('#mms-map-bigmap').checked === true);
    assert('每图风格与备注表单齐全', () =>
      !!q('#mms-miniart-style') && !!q('#mms-miniart-note') && !!q('#mms-bigart-style') && !!q('#mms-bigart-note'));
    (function () {
      const dayDot = qa('.theme-dot-btn').find((b) => b.getAttribute('data-theme') === 'day');
      click(dayDot);
      assert('主题圆点切换：白天模式生效', () => doc.body.classList.contains('day-mode'));
      const romanDot = qa('.theme-dot-btn').find((b) => b.getAttribute('data-theme') === 'romantic');
      click(romanDot);
      assert('切回修仙模式', () => doc.body.classList.contains('romantic-mode'));
    })();

    group('六、图片管理（底图分类已随 LLM 地图版移除）');
    click(q('#tab-btn-images'));
    await sleep(120);
    assert('切到图片管理 tab（面包屑更新）', () => q('#settings-current-tab-name').textContent.includes('图片管理'));
    assert('分类只剩 2 个（立绘/头像，无底图）', () => qa('.mms-img-cat-btn').length === 2);
    assert('无 background 分类按钮', () => !qa('.mms-img-cat-btn').some((b) => b.getAttribute('data-cat') === 'background'));
    assert('立绘分类渲染出条目行（20 条）', () => qa('.mms-img-row').length === 20);
    (function () {
      const avBtn = qa('.mms-img-cat-btn').find((b) => b.getAttribute('data-cat') === 'avatar');
      click(avBtn);
      assert('切到头像分类（10 条）', () => qa('.mms-img-row').length === 10);
      const pBtn = qa('.mms-img-cat-btn').find((b) => b.getAttribute('data-cat') === 'portrait');
      click(pBtn);
    })();

    group('七、双地图 AI 生成（mock generateRaw，各一张独立缓存）');
    click(q('#settings-close'));
    await sleep(100);
    const miniGen = qa('.mms-bm-btn').find((b) => b.textContent.includes('生成小地图'));
    assert('小地图占位卡上有「生成小地图」按钮', () => !!miniGen);
    if (miniGen) {
      click(miniGen);
      await sleep(900);
      assert('generateRaw 被调用 1 次（小地图独立绘图）', () => win.generateRawCalls.length === 1);
      assert('小地图写入聊天变量 $mms_map_mini_art（近景样例 3 地标）', () => {
        const s = win.__getStore().chat;
        return s.$mms_map_mini_art && s.$mms_map_mini_art.json && s.$mms_map_mini_art.json.markers.length === 3;
      });
      assert('小地图 ground=wood 通过 sanitize（近景材质保留）', () => {
        const s = win.__getStore().chat;
        return s.$mms_map_mini_art && s.$mms_map_mini_art.json.ground === 'wood';
      });
      assert('小地图系统提示词：近景绘制师 + 近景词表 + 场景判定引导', () => {
        const c = win.generateRawCalls[0].ordered_prompts[0].content;
        return c.includes('近景场景绘制师') && c.includes('crystal') && c.includes('machine') && c.includes('rubber');
      });
      assert('小地图卡片原地刷新（mini kind 卡片含工具栏）', () => !!q('li[data-mms-map-kind="mini"] .mms-bm-bar'));
      assert('小地图 AI 底图渲染为 SVG（含木地板材质 pattern）', () => {
        const svg = q('li[data-mms-map-kind="mini"] svg');
        return !!svg && qa('li[data-mms-map-kind="mini"] svg').length >= 1 && svg.innerHTML.includes('mms-mini-wood');
      });
      assert('无文字位置徽标（匹配与否均静默，当前位置仅地图高亮）', () => !q('li[data-mms-map-kind="mini"] .mms-bm-badge'));
    }
    const bigGen = qa('.mms-bm-btn').find((b) => b.textContent.includes('生成大地图'));
    assert('大地图占位卡上有「生成大地图」按钮', () => !!bigGen);
    if (bigGen) {
      click(bigGen);
      await sleep(900);
      assert('generateRaw 累计调用 2 次（两图互不影响）', () => win.generateRawCalls.length === 2);
      assert('大地图写入聊天变量 $mms_map_art（沿用旧变量名，老聊天继承）', () => {
        const s = win.__getStore().chat;
        return s.$mms_map_art && s.$mms_map_art.json && s.$mms_map_art.json.markers.length === 2;
      });
      assert('大地图系统提示词：地理词表、不含近景词', () => {
        const c = win.generateRawCalls[1].ordered_prompts[0].content;
        return c.includes('大地图绘制师') && !c.includes('crystal') && !c.includes('machine') && !c.includes('近景');
      });
      assert('大地图卡片原地刷新（big kind 卡片含工具栏）', () => !!q('li[data-mms-map-kind="big"] .mms-bm-bar'));
      assert('两图引擎并存（tactical-map-container ≥2）', () => qa('.tactical-map-container').length >= 2);
    }

    group('八、小地图近景材质渲染（直接调用渲染器：室内/野外/现代/图纸）');
    {
      const R = win.mmsRenderMapArt;
      assert('渲染器暴露在 window（kind 参数化）', () => typeof R === 'function');
      if (typeof R === 'function') {
        assert('室内：木地板 pattern 铺底 + 轻晕影', () => {
          const s = R({ name: '总督套房', ground: 'wood', markers: [] }, 'flat', 'mini');
          return s.includes('mms-mini-wood') && s.includes('mms-mini-vig');
        });
        assert('室内：ground 非法值回退木地板', () => R({ ground: 'xxx' }, 'flat', 'mini').includes('mms-mini-wood'));
        assert('雪原：雪纹 pattern + 晶体冷光晕 + 近景大树', () => {
          const s = R({ ground: 'snow', features: [{ type: 'crystal', at: [500, 400] }, { type: 'tree', at: [300, 620] }], markers: [] }, 'flat', 'mini');
          return s.includes('mms-mini-snow') && s.includes('mms-mini-cold') && /rect[^>]*width="7"/.test(s);
        });
        assert('街道：沥青 pattern + 现代导引线 + 塑料凳/金属栅栏（现代材质系）', () => {
          const s = R({ ground: 'street', roads: ['M 100 800 C 300 700, 600 700, 900 800'], features: [{ type: 'fence', at: [180, 260] }, { type: 'stool', at: [600, 480] }], markers: [] }, 'flat', 'mini');
          return s.includes('mms-mini-street') && s.includes('#5eead4') && s.includes('#dc2626') && s.includes('#78909c');
        });
        assert('健身房：橡胶地垫 + 器械发光屏', () => {
          const s = R({ ground: 'rubber', features: [{ type: 'machine', at: [300, 300] }, { type: 'screen', at: [620, 220] }], markers: [] }, 'flat', 'mini');
          return s.includes('mms-mini-rubber') && s.includes('#10b981');
        });
        assert('室内分区：红毯 carpet pattern', () => {
          const s = R({ ground: 'wood', terrain: [{ type: 'carpet', shape: 'rect', at: [300, 350], size: [400, 300] }], markers: [] }, 'flat', 'mini');
          return s.includes('mms-mini-carpet');
        });
        assert('厚墙体：outline 画双线墙 + 门洞开口', () => {
          const s = R({ ground: 'wood', outline: { shape: 'roundRect', at: [90, 110], size: [820, 780], r: 24, wall: true }, gates: [[500, 880]], markers: [] }, 'flat', 'mini');
          return s.includes('stroke-width="20"') && s.includes('mms-mini-brick') && s.includes('stroke-dasharray="5 4"');
        });
        assert('rot 朝向生效（床绕 at 旋转 90°）', () => {
          const s = R({ ground: 'wood', features: [{ type: 'bed', at: [200, 200], size: [70, 100], rot: 90 }], markers: [] }, 'flat', 'mini');
          return s.includes('rotate(90 200 200)');
        });
        assert('手绘图纸：羊皮纸底 + 材质 tint（无 flat pattern）', () => {
          const s = R({ ground: 'wood', markers: [] }, 'parchment', 'mini');
          return s.includes('mms-map-pn') && !s.includes('mms-mini-wood');
        });
        assert('小地图不画罗盘（近景场景无方位符号）', () => !R({ ground: 'wood', markers: [] }, 'flat', 'mini').includes('>N<'));
        assert('大地图仍画罗盘且不带 mini 材质', () => {
          const s = R({ ground: 'field', markers: [] }, 'flat', 'big');
          return s.includes('>N<') && !s.includes('mms-mini-');
        });
      }
    }

    group('九、风格切换与开关回退');
    { // 风格切换：本地重绘（不产生新的 AI 调用）
      const before = win.generateRawCalls.length;
      const styleBtn = qa('li[data-mms-map-kind="mini"] .mms-bm-btn').find((b) => b.textContent.includes('换'));
      if (!styleBtn) {
        assert('小地图卡片上有风格切换按钮', () => false);
      } else {
        click(styleBtn);
        await sleep(400);
        assert('风格切换零 AI 调用（本地重绘）', () => win.generateRawCalls.length === before);
        assert('小地图风格切为羊皮纸（mms-miniart-style 同步）', () => q('#mms-miniart-style').value === 'parchment');
      }
    }
    { // 开关：关掉小地图 → 注入停止，YAML 小地图回退普通列表
      click(q('#settings-btn'));
      await sleep(100);
      click(q('#tab-btn-ai'));
      await sleep(120);
      const miniChk = q('#mms-map-minimap');
      miniChk.checked = false;
      miniChk.dispatchEvent(new Event('change', { bubbles: true }));
      await sleep(400);
      assert('关闭小地图：AI 卡片消失，YAML 数据回退普通列表', () =>
        !q('li[data-mms-map-kind="mini"]') && q('.character-panel').textContent.includes('可以休息'));
      assert('关闭小地图不影响大地图卡片', () => !!q('li[data-mms-map-kind="big"]'));
      miniChk.checked = true;
      miniChk.dispatchEvent(new Event('change', { bubbles: true }));
      await sleep(400);
      assert('重新开启小地图：AI 卡片恢复（读缓存零 AI 调用）', () =>
        !!q('li[data-mms-map-kind="mini"]') && win.generateRawCalls.length === 2);
    }

    group('十、图片表本机持久化（localStorage，不依赖正则 API）');
    { // 组八末尾设置面板开着（LLM地图页签），直接切图片管理
      click(q('#tab-btn-images'));
      await sleep(150);
      assert('初始为内置表（立绘 20 条）', () => qa('.mms-img-row').length === 20);
      const rows = qa('.mms-img-row');
      const delBtn = rows.length ? rows[rows.length - 1].querySelector('.mms-img-del') : null;
      if (!delBtn) {
        assert('删除一条立绘', () => false);
      } else {
        click(delBtn);
        await sleep(450); // persistLocal 防抖 250ms
        assert('删除后立绘 19 条', () => qa('.mms-img-row').length === 19);
        assert('本机快照已落盘（立绘 19 / 头像 10）', () => {
          const s = JSON.parse(localStorage.getItem('mms_img_data_llm_v1'));
          return !!s && Object.keys(s.portrait).length === 19 && Object.keys(s.avatar).length === 10;
        });
        assert('「未写回源码」徽标计数为 1', () => q('#mms-img-dirty').textContent.includes('1'));
      }
    }
    { // 重建 iframe（等效刷新）：快照应覆盖内置表；再验证「恢复内置」
      stage.srcdoc = staged;
      await sleep(1800);
      click(q('#settings-btn'));
      await sleep(150);
      click(q('#tab-btn-images'));
      await sleep(150);
      assert('重建后立绘仍 19 条（本机持久化生效）', () => qa('.mms-img-row').length === 19);
      const resetBtn = q('#mms-img-reset');
      if (!resetBtn) {
        assert('存在「恢复内置」按钮', () => false);
      } else {
        click(resetBtn);
        await sleep(200);
        assert('恢复内置后立绘回到 20 条', () => qa('.mms-img-row').length === 20);
        assert('本机快照已清除', () => localStorage.getItem('mms_img_data_llm_v1') === null);
      }
    }

    group('十一、独立LLM修补（诊断 / 预览 / 写回 / 撤销 / 手工编辑 / 提示词）');
    click(q('#settings-close'));
    await sleep(150);

    const repBtn = q('#mms-repair-btn');
    const repIcon = () => (repBtn.querySelector('i').className || '');
    assert('右上角修补按钮默认态为「修补」（fa-magic）', () => !!repBtn && repIcon().includes('fa-magic'));
    assert('铅笔编辑按钮存在且可见', () => !!q('#mms-edit-data-btn'));
    assert('mock 楼层缺「行动选项」被诊断出异常 → 按钮高亮告警', () =>
      repBtn.classList.contains('alert') && repBtn.title.includes('行动选项'));
    assert('默认提示词源码级无代码围栏（会提前闭合消息里的代码块）', () => {
      const i = WIDGET_HTML.indexOf('MMS_REPAIR_DEFAULT_PROMPT');
      return i > -1 && !WIDGET_HTML.slice(i, i + 4000).includes('```');
    });

    { // 修补：mock 首次调用失败一次 → 重试成功；返回带前后废话的块 → cleanOutput 取块
      win.__repairFailTimes = 1;
      const before = win.generateRawCalls.length;
      click(repBtn);
      await sleep(1800); // 含一次 1s 退避
      assert('API 失败自动重试（共 2 次 generateRaw）', () => win.generateRawCalls.length === before + 2);
      const call = win.generateRawCalls[win.generateRawCalls.length - 1];
      assert('generation_id 以 mms-repair- 前缀发起', () => String(call.generation_id).indexOf('mms-repair-') === 0);
      assert('系统提示词＝内置默认（角色定位 + 参考模板 + 只输出块本身的纪律）', () => {
        const sys = call.ordered_prompts[0].content;
        return call.ordered_prompts[0].role === 'system' &&
          sys.includes('YAML 修补专家') &&
          sys.includes('只输出修补后的 <Status_block> 块本身') &&
          sys.includes('状态栏:') && sys.includes('用户列表') && sys.includes('行动选项');
      });
      assert('用户消息按三段素材注入（待修补内容/本轮正文/报错信息）', () => {
        const u = call.ordered_prompts[1].content;
        return call.ordered_prompts[1].role === 'user' &&
          u.includes('<待修补内容>') && u.includes('</待修补内容>') &&
          u.includes('<本轮正文>') && u.includes('正文测试段落') &&
          u.includes('<报错信息>') && u.includes('行动选项');
      });
      assert('cleanOutput 剥掉前后废话，只取 <Status_block> 块', () =>
        q('#yaml-data-source').textContent.trim() === mockRepairBody.trim());
      assert('预览直接更新界面（选项区渲染出修补后的选项）', () =>
        qa('#options-list li').map((li) => li.textContent).join('|').includes('检查房门'));
      assert('预览后按钮切到「保存」态（fa-save + state-save）', () =>
        repIcon().includes('fa-save') && repBtn.classList.contains('state-save'));
      assert('预览未写回正文（mock 楼层正文仍是原始文本）', () => !win.__getMessage().message.includes('检查房门'));
    }

    { // 保存：只替换 Status_block 区间，正文与其它内容一字不动
      click(repBtn);
      await sleep(700);
      const msg = win.__getMessage().message;
      assert('写回正文：块换为修补结果，maintext/立绘标记原样保留', () =>
        msg.includes('检查房门') && msg.includes('<maintext>') &&
        msg.includes('正文测试段落') && msg.includes('【立绘弗兰克】'));
      assert('写回后按钮切到「撤销」态（fa-times + state-undo）', () =>
        repIcon().includes('fa-times') && repBtn.classList.contains('state-undo'));
      assert('撤销备份写入聊天变量 $mms_repair_undo（存修补前原始块、不含新选项）', () => {
        const u = win.__getStore().chat.$mms_repair_undo;
        return !!u && Number(u.floorId) === 0 &&
          typeof u.block === 'string' && u.block.includes('角色列表') && !u.block.includes('检查房门');
      });
    }

    { // 撤销：单步还原
      click(repBtn);
      await sleep(700);
      assert('撤销还原正文（回到修补前的块）', () => {
        const msg = win.__getMessage().message;
        return !msg.includes('检查房门') && msg.includes('角色列表');
      });
      assert('撤销备份已清除（$mms_repair_undo 为 null）', () => win.__getStore().chat.$mms_repair_undo === null);
      assert('撤销后按钮回到「修补」态（fa-magic）', () => repIcon().includes('fa-magic'));
    }

    { // 输出过不了解析门槛：不套用坏结果，转交手工编辑面板
      const logBefore = win.__harnessLog.length;
      win.__repairReply = '这不是 YAML，也没有块标签';
      click(repBtn);
      await sleep(800);
      assert('无法解析的输出：弹提示不套用', () =>
        win.__harnessLog.slice(logBefore).some((l) => String(l).includes('无法解析为合法 YAML')));
      assert('无法解析的输出：自动打开手工编辑面板并预填原始输出', () =>
        q('#mms-edit-mode').style.display === 'block' &&
        q('#mms-yaml-editor').value.includes('这不是 YAML'));
      assert('未产生预览（按钮仍是修补态）', () => repIcon().includes('fa-magic'));
      click(q('#mms-edit-cancel'));
      await sleep(150);
      assert('取消编辑返回主视图', () =>
        q('#mms-edit-mode').style.display !== 'block' && q('#mms-main-view').style.display === 'block');
      win.__repairReply = mockRepairReply;
    }

    { // 手工编辑面板：校验 + 行号提示 + 保存即写回
      click(q('#mms-edit-data-btn'));
      await sleep(200);
      assert('点铅笔：整栏切到编辑面板', () =>
        q('#mms-edit-mode').style.display === 'block' && q('#mms-main-view').style.display === 'none');
      assert('编辑框预填本楼 Status_block 原文', () => q('#mms-yaml-editor').value.includes('角色列表'));

      const editor = q('#mms-yaml-editor');
      editor.value = '状态栏: [未闭合的流式序列';
      click(q('#mms-edit-save'));
      await sleep(300);
      assert('非法 YAML：错误行带原因与行号，面板保持打开', () => {
        const err = q('#mms-edit-error');
        return err.style.display === 'block' && err.textContent.includes('YAML 错误') &&
          q('#mms-edit-mode').style.display === 'block';
      });

      editor.value = [
        '状态栏:',
        '  日期和时间: "第2天 09:00"',
        '  地点: "手工修正"',
        '  行动选项:',
        '    名字: "弗兰克"',
        '    选项:',
        '      - "1. 手工选项"',
      ].join('\n');
      click(q('#mms-edit-save'));
      await sleep(500);
      assert('合法 YAML：写回正文并关闭面板', () =>
        q('#mms-edit-mode').style.display !== 'block' && win.__getMessage().message.includes('手工选项'));
      assert('手工保存同样留下撤销点', () => {
        const u = win.__getStore().chat.$mms_repair_undo;
        return !!u && typeof u.block === 'string' && u.block.includes('角色列表');
      });
      click(repBtn); // 撤销回修补前，同时把按钮复位成修补态
      await sleep(700);
      assert('按钮撤销手工编辑结果', () => !win.__getMessage().message.includes('手工选项'));
    }

    { // 提示词页签：默认预填 / 自定义整个替换 / 清空回默认
      click(q('#settings-btn'));
      await sleep(150);
      click(q('#tab-btn-repair'));
      await sleep(200);
      assert('切到 LLM修补页签（面包屑更新）', () => q('#settings-current-tab-name').textContent.includes('LLM修补'));
      const sel = q('#mms-repair-preset-select');
      const ta = q('#mms-repair-prompt');
      assert('预设下拉初始仅「内置默认」一条且被选中', () =>
        !!sel && sel.options.length === 1 && sel.value === 'default');
      assert('内置默认预设：正文预填默认提示词且只读', () =>
        ta.value.includes('YAML 修补专家') && ta.value.includes('用户列表') &&
        ta.value.includes('行动选项') && ta.readOnly === true);
      assert('默认预设提示文案标明只读', () => q('#mms-repair-prompt-hint').textContent.includes('只读'));

      win.__promptReply = 'COC7 卡';
      click(q('#mms-repair-preset-add'));
      await sleep(300);
      assert('新建预设：下拉变 2 条并自动切到新预设', () => sel.options.length === 2 && sel.value !== 'default');
      assert('新预设初始内容＝内置默认提示词快照，且可编辑', () =>
        ta.readOnly === false && ta.value.includes('YAML 修补专家'));
      assert('预设池写入全局变量（active / 名称 / locked）', () => {
        const g = win.__getStore().global.$mms_repair_prompt;
        return !!g && Array.isArray(g.presets) && g.presets.length === 2 &&
          g.presets[0].id === 'default' && g.presets[0].locked === true &&
          g.presets[1].name === 'COC7 卡' && g.active === g.presets[1].id;
      });

      ta.value = '你是修补器。只输出块。';
      ta.dispatchEvent(new Event('blur'));
      await sleep(250);
      assert('编辑正文只写入当前预设，内置默认内容不受影响', () => {
        const g = win.__getStore().global.$mms_repair_prompt;
        const cur = g.presets.find((p) => p.id === g.active);
        return cur.content === '你是修补器。只输出块。' && g.presets[0].content === '';
      });

      click(q('#settings-close'));
      await sleep(150);
      click(repBtn);
      await sleep(700);
      assert('选中预设整个替换系统提示词（默认文案不再出现）', () => {
        const c = win.generateRawCalls[win.generateRawCalls.length - 1];
        return c.ordered_prompts[0].content === '你是修补器。只输出块。' &&
          c.ordered_prompts[1].content.includes('<待修补内容>');
      });

      click(q('#settings-btn'));
      await sleep(150);
      click(q('#tab-btn-repair'));
      await sleep(200);
      const sel2 = q('#mms-repair-preset-select');
      const ta2 = q('#mms-repair-prompt');
      sel2.value = 'default';
      sel2.dispatchEvent(new Event('change'));
      await sleep(250);
      assert('手动切回默认预设：正文回默认并恢复只读', () =>
        ta2.value.includes('YAML 修补专家') && ta2.readOnly === true);

      click(q('#mms-repair-preset-delete'));
      await sleep(250);
      assert('内置默认预设不可删除（下拉仍 2 条）', () => {
        const g = win.__getStore().global.$mms_repair_prompt;
        return sel2.options.length === 2 && !!g && g.presets.length === 2;
      });

      sel2.value = win.__getStore().global.$mms_repair_prompt.presets[1].id;
      sel2.dispatchEvent(new Event('change'));
      await sleep(200);
      win.__promptReply = '改造过的卡';
      click(q('#mms-repair-preset-rename'));
      await sleep(300);
      assert('重命名生效（下拉项文案同步）', () => {
        const g = win.__getStore().global.$mms_repair_prompt;
        return g.presets[1].name === '改造过的卡' && sel2.options[1].textContent === '改造过的卡';
      });

      click(q('#mms-repair-preset-delete'));
      await sleep(300);
      assert('删除预设后回落内置默认预设', () => {
        const g = win.__getStore().global.$mms_repair_prompt;
        return g.presets.length === 1 && g.active === 'default' && sel2.options.length === 1;
      });
      click(q('#settings-close'));
      await sleep(150);
    }

    group('十二、旧版单条提示词迁移（{prompt} → 预设池）');
    { // 用携带旧版 global 种子的 mock 重建 iframe
      stage.srcdoc = WIDGET_HTML.replace(
        '<head>',
        '<head>' + makeMockScript(store.chat, { $mms_repair_prompt: { prompt: '旧版单条自定义文案' } }),
      );
      await sleep(1800);
      click(q('#settings-btn'));
      await sleep(200);
      click(q('#tab-btn-repair'));
      await sleep(250);
      const selM = q('#mms-repair-preset-select');
      const taM = q('#mms-repair-prompt');
      assert('旧版单条自定义文案迁移成一条预设并被选中', () =>
        selM.options.length === 2 && selM.value !== 'default' &&
        taM.readOnly === false && taM.value === '旧版单条自定义文案');
      assert('迁移后内置默认预设仍在首位且 locked', () => {
        const g = win.__getStore().global.$mms_repair_prompt;
        return !!g && g.presets[0].id === 'default' && g.presets[0].locked === true;
      });
      click(q('#settings-close'));
      await sleep(150);
    }

    finish();
  }

  document.getElementById('run').addEventListener('click', runAll);
})();
</script>
</body>
</html>
